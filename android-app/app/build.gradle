plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.digitalcardbinder.app'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.digitalcardbinder.app.test'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.8.1-native-auth-guard'
    }

    signingConfigs {
        debug {
            storeFile file('../test-signing.keystore')
            storePassword 'digital-card-binder-test'
            keyAlias 'digitalcardbinder-test'
            keyPassword 'digital-card-binder-test'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
