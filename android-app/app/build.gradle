plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.digitalcardbinder.app'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.digitalcardbinder.app.test'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.6.0-webview-diagnostic'
    }

    signingConfigs {
        debug {
            storeFile file('../test-signing.keystore')
            storePassword 'digital-card-binder-test'
            keyAlias 'digitalcardbinder-test'
            keyPassword 'digital-card-binder-test'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
