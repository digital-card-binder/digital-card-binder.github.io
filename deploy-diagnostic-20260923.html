<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>디지털 카드 바인더 · 배포 진단</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#17233f;background:#f5f7fb}
    *{box-sizing:border-box}body{margin:0;padding:20px}.wrap{max-width:780px;margin:auto}
    h1{font-size:24px;margin:0 0 8px}.lead{color:#63708a;margin:0 0 18px}
    .card{background:#fff;border:1px solid #dfe4ed;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 8px 24px rgba(23,35,63,.06)}
    .row{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid #eef1f5}.row:last-child{border-bottom:0}
    .label{font-weight:800}.value{overflow-wrap:anywhere}.ok{color:#087f5b;font-weight:900}.bad{color:#d63346;font-weight:900}.wait{color:#6c757d}
    button,a.button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:12px;padding:0 16px;background:#17233f;color:#fff;font-weight:800;text-decoration:none;margin:6px 6px 0 0}
    button.secondary{background:#eef2f8;color:#17233f}.small{font-size:12px;color:#7a8498;line-height:1.5}
    @media(max-width:600px){body{padding:14px}.row{grid-template-columns:1fr;gap:3px}}
  </style>
</head>
<body>
<main class="wrap">
  <h1>배포 상태 진단</h1>
  <p class="lead">현재 기기에서 실제로 받는 파일을 직접 확인합니다.</p>
  <section class="card" id="summary"><div class="wait">확인 중…</div></section>
  <section class="card" id="details"></section>
  <section class="card">
    <strong>문제가 브라우저 캐시로 확인되면</strong>
    <p class="small">아래 버튼은 이 사이트의 Service Worker와 CacheStorage만 정리한 뒤 최신 홈을 다시 엽니다. 로그인 데이터나 Firestore 보유 기록은 삭제하지 않습니다.</p>
    <button id="reset">사이트 캐시 정리 후 최신 홈 열기</button>
    <a class="button" id="latest" href="/index.html?diagnostic=20260923-8">최신 홈 직접 열기</a>
  </section>
</main>
<script>
(async()=>{
  const rows=[];
  const add=(k,v,state="")=>rows.push({k,v,state});
  async function getText(url){
    const u=new URL(url,location.origin); u.searchParams.set("_diag",Date.now()+"-"+Math.random());
    const r=await fetch(u,{cache:"no-store",headers:{"Cache-Control":"no-cache"}});
    return {status:r.status,text:await r.text(),url:r.url};
  }
  let version="",indexText="",navText="";
  try{ const x=await getText("/site-version.json"); version=JSON.parse(x.text).version||""; add("site-version",version,version==="20260923-6"?"ok":"bad"); }catch(e){add("site-version",String(e),"bad")}
  try{
    const x=await getText("/index.html");
    indexText=x.text;
    const isNew=indexText.includes("주요 도감")&&indexText.includes("AR 전종도감")&&!indexText.includes("도감 갤러리");
    const script=(indexText.match(/collector-nav\.js\?v=[^"'<> ]+/)||[])[0]||"없음";
    add("index.html 응답",isNew?"신버전":"구버전",""+(isNew?"ok":"bad"));
    add("index 내 nav 파일",script,isNew?"ok":"bad");
  }catch(e){add("index.html 응답",String(e),"bad")}
  try{
    const x=await getText("/collector-nav.js?v=20260923-5");
    navText=x.text;
    const isNew=navText.includes('navigationSection("주요 도감")')&&navText.includes('"커뮤니티"');
    add("collector-nav 응답",isNew?"신버전":"구버전",isNew?"ok":"bad");
  }catch(e){add("collector-nav 응답",String(e),"bad")}
  if("serviceWorker" in navigator){
    try{
      const regs=await navigator.serviceWorker.getRegistrations();
      add("SW controller",navigator.serviceWorker.controller?.scriptURL||"없음");
      add("SW registrations",regs.length?regs.map(r=>(r.active||r.waiting||r.installing)?.scriptURL||"등록됨").join(" | "):"없음");
    }catch(e){add("Service Worker",String(e),"bad")}
  }else add("Service Worker","미지원");
  if("caches" in window){
    try{const keys=await caches.keys();add("CacheStorage",keys.length?keys.join(", "):"비어 있음");}catch(e){add("CacheStorage",String(e),"bad")}
  }
  add("현재 주소",location.href);
  add("브라우저",navigator.userAgent);
  const indexNew=indexText.includes("주요 도감")&&indexText.includes("AR 전종도감")&&!indexText.includes("도감 갤러리");
  const navNew=navText.includes('navigationSection("주요 도감")')&&navText.includes('"커뮤니티"');
  const summary=document.querySelector("#summary");
  if(indexNew&&navNew){
    summary.innerHTML='<div class="ok">서버는 최신 파일을 정상 응답 중입니다. 현재 홈 화면만 브라우저/PWA 쪽 구버전 상태입니다.</div>';
  }else{
    summary.innerHTML='<div class="bad">이 기기에서는 서버 응답 자체에 구버전 파일이 섞여 있습니다. 결과 화면을 캡처해 주세요.</div>';
  }
  document.querySelector("#details").innerHTML=rows.map(r=>'<div class="row"><div class="label">'+escapeHtml(r.k)+'</div><div class="value '+(r.state||"")+'">'+escapeHtml(String(r.v))+'</div></div>').join("");
  document.querySelector("#reset").onclick=async()=>{
    const btn=document.querySelector("#reset");btn.disabled=true;btn.textContent="정리 중…";
    try{
      if("serviceWorker" in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()));}
      if("caches" in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)));}
    }catch(e){}
    location.replace("/index.html?reset="+Date.now());
  };
  function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
})();
</script>
</body></html>
