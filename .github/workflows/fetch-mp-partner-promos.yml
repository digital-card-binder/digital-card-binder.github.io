name: Fetch M-P partner promo images (one-shot)
on:
  push:
    branches: [mp-partner-images]
    paths: [.github/workflows/fetch-mp-partner-promos.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - run: python3 scripts/fetch-mp-partner-promos-20261127.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/mp-30th-partner
          git commit -m "M-P 058~084 공식 한국판 이미지 저장"
          git push
