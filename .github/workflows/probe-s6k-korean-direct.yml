name: Probe direct S6K 089 090 092 093 094 Korean retailer image URLs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-s6k-korean-direct.yml'
      - 'scripts/probe-s6k-korean-direct.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-direct-089-090-092-093-094
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Collect photos without approving print identity
        run: python scripts/probe-s6k-korean-direct.py
      - name: Archive read-only contact and evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s6K/korean-candidates/direct
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): archive direct Korean 089 090 092 093 094 photo probes"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/probe-s6k-korean-direct.py
          done
