name: Build popular artists temporary

on:
  push:
    branches:
      - feat/add-popular-artists-final-20260826
    paths:
      - ".github/workflows/build-popular-artists-temp.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-popular-artists-final-20260826
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect series records
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          payload=json.loads(Path('data/series.json').read_text(encoding='utf-8'))
          rows=[]
          def walk(node):
              if isinstance(node,dict):
                  if any(k in node for k in ('image','code','cardNumber','name')):
                      rows.append(node)
                  for v in node.values(): walk(v)
              elif isinstance(node,list):
                  for v in node: walk(v)
          walk(payload)
          print('rows',len(rows))
          targets=[('SV4a',41),('SV4a',62),('SV2a',52),('SV2P',63),('SV6',67),('SV5a',26),('SV5M',50),('SV4K',26),('SV4M',20),('SV3a',85),('SV2D',9),('SV1S',43)]
          for setcode,num in targets:
              print('\nTARGET',setcode,num)
              found=[]
              for r in rows:
                  text=' '.join(str(r.get(k,'')) for k in ('code','set','cardNumber','number','image','name'))
                  if setcode.lower() in text.lower() and re.search(r'(^|\D)0*'+str(num)+r'(\D|$)',text):
                      found.append(r)
              print('found',len(found))
              for r in found[:5]: print(json.dumps(r,ensure_ascii=False)[:1600])
          print('\nSV4a samples')
          count=0
          for r in rows:
              text=' '.join(str(r.get(k,'')) for k in ('code','set','cardNumber','number','image'))
              if 'sv4a' in text.lower():
                  print(json.dumps(r,ensure_ascii=False)[:1200]); count+=1
                  if count>=8: break
          PY
