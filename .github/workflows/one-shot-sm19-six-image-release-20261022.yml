name: One-shot validate six Korean SM image URLs and release safely
on:
  push:
    branches:
      - release/sm19-six-verified-image-recovery-20261022
    paths:
      - .github/workflows/one-shot-sm19-six-image-release-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-sm19-six-image-release-20261022
  cancel-in-progress: false
jobs:
  test-six-image-recoveries:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Import exact documented full-resolution printed-number confirmations
        run: |
          set -euo pipefail
          git fetch origin audit/sm19-797-image-identity-recheck-20261022
          git restore --source=FETCH_HEAD -- data/audits/theme-sm19-six-korean-print-footer-verified-20261022.json data/audits/theme-sm19-797-six-recovered-printed-identity-evidence-20261022.json
          node --check scripts/restore-sm19-six-verified-korean-images-20261022.mjs
          node scripts/restore-sm19-six-verified-korean-images-20261022.mjs
          test "$(git diff --numstat -- data/series.json data/series-legacy.json | awk '{s+=$1+$2} END{print s+0}')" -le 40
          git diff --check
          if ! git diff --quiet -- data/art-themes.json series-scope-filter.js tests/base-series-dex.test.mjs; then
            echo 'Unexpected theme/RGB source modification'; exit 1
          fi
      - name: Install project regression prerequisites
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Rebuild site and verify all card datasets
        run: |
          set -euo pipefail
          npm run site:prepare
          git diff --check
      - name: Run complete website, registry, RGB and Firestore tests
        run: npm test
      - name: Confirm six replacements, 20,243 master cards and 22,032 themed slots
        run: |
          node - <<'JS'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const all=[...read('data/series.json'),...read('data/series-legacy.json')];
          const sum=read('data/audits/theme-series-coverage.json').summary;
          const updates=read('data/audits/theme-sm19-six-restored-korean-image-urls-20261022.json');
          if(all.length!==273||all.reduce((n,s)=>n+s.cards.length,0)!==20243||
             sum.themeCardSlots!==22032||updates.cards.length!==6)
            throw Error('Master series/dex count regression');
          for(const a of updates.cards){
            const matches=all.flatMap(s=>s.cards).filter(c=>c.code.toLowerCase()===a.code.toLowerCase());
            if(matches.length!==1||matches[0].image!==a.newImageUrl)throw Error('Image recovery invariant '+a.code);
          }
          console.log('SM19_SIX_RELEASE_VERIFIED',JSON.stringify({recovered:6,held:791,themeSlots:sum.themeCardSlots,cards:20243}));
          JS
      - name: Commit approved six image replacements to the release branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/sm19-six-verified-image-recovery-20261022"
          git add -u
          git add data/audits/theme-sm19-six-korean-print-footer-verified-20261022.json
          git add data/audits/theme-sm19-797-six-recovered-printed-identity-evidence-20261022.json
          git add data/audits/theme-sm19-six-restored-korean-image-urls-20261022.json
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(data/art-themes.json|series-scope-filter.js|catalog.js|tests/base-series-dex.test.mjs|radar-service/|radar-server/|api/radar/|data/card-radar-|firestore.rules)'; then
            echo 'Protected theme, RGB, radar or ownership file modified'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sm): restore six verified Korean printed-number image URLs without changing theme collections'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
