name: Close six Korean SVLS evidence holds
on:
  push:
    branches: [main]
    paths: ['data/audits/theme-svls-held-closure-20261013.json']
permissions:
  contents: write
concurrency:
  group: close-theme-svls-holds
  cancel-in-progress: false
jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply only six reviewed Korean cards and finish SVLS
        run: node scripts/apply-theme-svls-held-closure.mjs
      - name: Synchronize all downstream audits
        run: npm run site:prepare
      - name: Validate site audit consistency
        run: npm run site:check
      - name: Full project regression checks
        run: npm test
      - name: Commit after full validation success
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-series-coverage.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Close Korean SVLS six artwork holds and mark 25 of 25 strictly reviewed"
          git push origin HEAD:main
