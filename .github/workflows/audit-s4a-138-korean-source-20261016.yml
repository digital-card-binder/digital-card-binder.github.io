name: Diagnose missing Korean S4a 138 Zamazenta image source
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-s4a-138-korean-source-20261016.yml'
      - 'scripts/audit-s4a-138-korean-image-source-20261016.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s4a-138-official-source-diagnostic
  cancel-in-progress: false
jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - run: python scripts/audit-s4a-138-korean-image-source-20261016.py
      - name: Archive read-only diagnostic record
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/audits/theme-visual-evidence/s4a/121-150/s4a-138-source-diagnostics.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s4a): record official and owned image status for Korean 138"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-s4a-138-korean-image-source-20261016.py
          done
