name: Upgrade ORIGIN ADV Korean Images

on:
  push:
    branches: [main]
    paths:
      - "scripts/upgrade_origin_adv_korean_images.py"
      - ".github/workflows/upgrade-origin-adv-korean-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Upgrade Korean images
        run: python scripts/upgrade_origin_adv_korean_images.py
      - name: Commit generated catalog
        run: |
          if git diff --quiet -- data/series-legacy.json; then
            echo "No catalog changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series-legacy.json
          git commit -m "Upgrade ORIGIN ADV images to Korean scans"
          git pull --rebase origin main
          git push origin HEAD:main
