name: Complete Korean Snow Hazard 99-card thematic review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-sv2p-final-061-099.yml'
      - 'data/audits/theme-sv2P-061-099-art-review.json'
      - 'data/audits/theme-sv2P-set-progress-20261013.json'
permissions:
  contents: write
concurrency:
  group: theme-sv2p-guarded-batches
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply guarded final 39 Korean Snow Hazard cards and twelve themes
        run: node scripts/apply-theme-sv2p-final-061-099.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Push only fully regression-tested complete-set data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sv2P-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete 99 Korean Snow Hazard artworks, 12-theme review and card names"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          node scripts/apply-theme-sv2p-final-061-099.mjs
          npm run site:prepare
          npm run site:check
          npm test
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sv2P-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete 99 Korean Snow Hazard artworks on latest main"
          git push origin HEAD:main
