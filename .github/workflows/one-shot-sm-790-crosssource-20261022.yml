name: One-shot SM 790 Korean print source and mapping integrity audit
on:
  push:
    branches:
      - audit/sm-790-crosssource-print-20261022
    paths:
      - .github/workflows/one-shot-sm-790-crosssource-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-sm790-source-audit-20261022
  cancel-in-progress: false
jobs:
  source-check-and-preserve:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore last verified 797 source checks and 13-card probe evidence
        run: |
          set -euo pipefail
          git fetch --no-tags origin audit/sm19-13-hard-missing-source-probe-20261022
          git restore --source=FETCH_HEAD -- data/audits/theme-sm19-797-print-source-recheck-20261022.json data/audits/theme-sm19-13-source-rescue-probe-20261022.json
          test -s data/audits/theme-sm19-797-print-source-recheck-20261022.json
      - name: Install one auditable HTTP client
        run: python -m pip install requests
      - name: Verify all 790 independent source rows and 12 Korean reference pages
        run: |
          set -euo pipefail
          python -m py_compile scripts/audit-sm-790-crosssource-20261022.py
          python scripts/audit-sm-790-crosssource-20261022.py
      - name: Assert previous seven Korean print repairs and theme totals unchanged
        run: |
          python - <<'PY'
          import json
          f=lambda p:json.load(open(p))
          summary=f('data/audits/theme-series-coverage.json')['summary']
          a=f('data/audits/theme-sm-790-crosssource-card-identity-20261022.json')
          assert summary['masterCardCount']==20243
          assert summary['themeCardSlots']==22032
          assert a['totalRemainingHeld']==790 and a['stillMissing']==12
          assert a['downloadableAndNumberUnverified']==778
          assert len(a['cards'])==790
          assert not any(x['physicalKoreanNumberVerified'] for x in a['cards'])
          print('SM790_INTEGRITY_OK',summary['masterCardCount'],summary['themeCardSlots'])
          PY
      - name: Commit only evidence (never change deployed master, user data or radar)
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/sm-790-crosssource-print-20261022"
          git add data/audits/theme-sm19-797-print-source-recheck-20261022.json data/audits/theme-sm19-13-source-rescue-probe-20261022.json data/audits/theme-sm-790-crosssource-card-identity-20261022.json
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(data/series.json|data/series-legacy.json|data/art-themes.json|firestore.rules|api/radar/|radar-service/)'; then
            echo 'Protected master or Firestore changed'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(sm): identify 790 held Korean print sources and exact mismatched print-name candidates'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
