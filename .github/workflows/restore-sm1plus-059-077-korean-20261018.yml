name: Restore Korean SM1+ 059-077 19 wrong card images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-sm1plus-059-077-korean-20261018.yml'
      - 'scripts/restore-sm1plus-059-077-korean-20261018.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: restore-sm1plus-059-077-korean
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow beautifulsoup4
      - name: Download exactly 19 approved Korean print photos into first-party site assets
        run: python scripts/restore-sm1plus-059-077-korean-20261018.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Resynchronize indexes, site bundle and cache fingerprints
        run: |
          npm run series-inventory:sync
          npm run master-db-audit:sync
          npm run theme-audit:sync
          npm run downstream-sync:sync
          npm run search-index:sync
          npm run catalog-metrics:sync
          npm run related-dex:sync
          npm run shell:sync
          npm run versions:sync
      - name: Test all existing site and ownership structures
        run: |
          npm run site:check
          npm run test:registry
          npm run test:syntax
          npm run test:architecture
      - name: Commit only exact images, source pointers, report and generated references
        run: |
          set -euo pipefail
          git add assets/cards/sm1plus-korean
          git add data/audits/sm1plus-059-077-Korean-source-image-recovery-20261018.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(images): replace 19 wrong SM1+ high-range arts with Korean app images"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
