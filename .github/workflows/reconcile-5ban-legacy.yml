name: Reconcile 5ban legacy Korean cards

on:
  push:
    branches:
      - fix/5ban-legacy-korean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/5ban-legacy-korean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile official Korean BW and XY cards
        run: python scripts/reconcile_5ban_legacy.py
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artists.json data/5ban-legacy-audit.json
          if ! git diff --cached --quiet; then
            git commit -m "data: reconcile Korean BW XY 5ban cards"
            git push
          fi
