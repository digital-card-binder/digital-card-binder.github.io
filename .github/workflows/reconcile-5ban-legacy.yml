name: Reconcile 5ban legacy Korean cards

on:
  push:
    branches:
      - fix/5ban-legacy-korean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/5ban-legacy-korean
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconcile official Korean BW and XY cards
        run: |
          if [ ! -f data/5ban-legacy-audit.json ]; then
            python scripts/reconcile_5ban_legacy.py
          fi
      - name: Finalize counts and rebuild safety
        run: python scripts/finalize_5ban_legacy.py
      - name: Validate artist data
        run: python scripts/validate_artist_data.py
      - name: Validate registry regression
        run: node --test tests/collector-registry.test.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artists.json data/5ban-legacy-audit.json collector-collection-registry.js scripts/validate_artist_data.py tests/collector-registry.test.mjs artists.js scripts/build_5ban_artist_data.py docs/5ban-graphics-data-note.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: finalize Korean legacy 5ban catalog"
            git push
          fi
