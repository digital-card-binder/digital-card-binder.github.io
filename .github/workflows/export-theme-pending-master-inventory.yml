name: Export Korean theme-review master evidence inventory
on:
  push:
    branches: [main]
    paths:
      - 'scripts/export-theme-pending-master-inventory.mjs'
permissions:
  contents: write
concurrency:
  group: theme-evidence-inventory
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export existing canonical identity and image source references only
        run: node scripts/export-theme-pending-master-inventory.mjs
      - name: Commit evidence inventory without modifying live catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-next-batches-master-inventory.json
          if git diff --cached --quiet; then
            echo "Inventory unchanged."
            exit 0
          fi
          git commit -m "Record existing Korean master card/image references for pending theme review"
          git push origin HEAD:main
