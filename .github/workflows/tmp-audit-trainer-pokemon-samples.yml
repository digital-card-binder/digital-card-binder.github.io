name: Temporary trainer Pokemon sample audit

on:
  push:
    branches:
      - feature/rename-and-expand-trainer-pokemon-dex
    paths:
      - .github/workflows/tmp-audit-trainer-pokemon-samples.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rename-and-expand-trainer-pokemon-dex
      - name: Inspect exact official Korean sample cards
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, str(Path('scripts').resolve()))
          import build_legacy_series_data as official

          ids = [
            'BS2020014012','BS2020014026','BS2021015006','BS2021015014','BS2021015015',
            'BS2021015017','BS2022001081','BS2022002081','BS2021004018','BS2021004021','BS2022008024'
          ]
          for card_num in ids:
            detail = official.parse_detail(official.detail_payload(card_num))
            print('DETAIL', json.dumps({'CardNum': card_num, **detail}, ensure_ascii=False))

          product = 'BW 확장팩 「EX 배틀 부스트」'
          wanted_numbers = {'017','018','019'}
          records = []
          for card_type in (1,2,3):
            page = 0
            while True:
              batch = official.ajax_page(product, card_type, page)
              records.extend(batch)
              if len(batch) < 30: break
              page += 1
          print('EBB_RECORDS', len(records))
          for row in records:
            card_num = str(row.get('CardNum') or '').strip()
            feature = str(row.get('feature_image') or '').strip()
            if not card_num or not feature: continue
            detail = official.parse_detail(official.detail_payload(card_num))
            number = str(detail.get('number') or '').zfill(3)
            if number not in wanted_numbers: continue
            print('EBB', json.dumps({
              'CardNum': card_num,
              **detail,
              'image': official.feature_image_url(feature),
              'source': f'https://pokemoncard.co.kr/cards/detail/{card_num}',
            }, ensure_ascii=False))
          PY
