name: Audit full Korean sv3 Obsidian Flames card images
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-theme-sv3-visual.py'
permissions:
  contents: write
concurrency:
  group: sv3-evidence-main
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Verify 141 Korean printed cards using owned Cloudflare assets
        run: python scripts/audit-theme-sv3-visual.py
      - name: Commit read-only Korean artwork contact sheets and image reports
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/sv3
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture all 141 Korean sv3 Obsidian Flames owned-CDN image proofs"
          git pull --rebase origin main
          git push origin HEAD:main
