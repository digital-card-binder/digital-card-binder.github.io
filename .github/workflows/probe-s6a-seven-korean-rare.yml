name: Source seven Korean Eevee Heroes rare print photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-s6a-seven-korean-rare.yml'
      - 'scripts/probe-s6a-seven-korean-rare-sources.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6a-seven-Korean-source-evidence
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Archive seven Korean seller photo candidates and source evidence
        run: python scripts/probe-s6a-seven-korean-rare-sources.py
      - name: Commit photo candidates without changing card catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 5); do
            git add assets/cards/s6a-korean-rare data/audits/theme-visual-evidence/s6a/korean-candidates
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6a): archive seven Korean seller source photo candidates"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/probe-s6a-seven-korean-rare-sources.py
          done
