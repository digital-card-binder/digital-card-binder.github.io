name: Apply s6a Korean Eevee Heroes 101 reviewed artworks with foreign-print holds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-s6a-001-101.yml'
      - 'scripts/apply-theme-s6a-001-101-korean.mjs'
      - 'data/audits/theme-s6a-001-035-Korean-art-review-20261015.json'
      - 'data/audits/theme-s6a-036-070-Korean-art-review-20261015.json'
      - 'data/audits/theme-s6a-071-101-Korean-art-review-20261015.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6a-001-101-Korean-theme-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Register 101 reviewed artworks, preserve existing 95 night theme and hold 7 Japanese print placeholders
        run: node scripts/apply-theme-s6a-001-101-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:architecture
      - run: node --test tests/theme-navigation.test.mjs tests/audit-regressions.test.mjs tests/related-dex-links.test.mjs
      - name: Commit Eevee Heroes reviewed art and safe print-status checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json
            git add data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json
            git add data/audits/theme-s6a-001-101-progress-20261015.json
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Audit Korean s6a Eevee Heroes all 101 artworks; hold 7 foreign print placeholders"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 8 ]]; then exit 1; fi
            sleep 4
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-theme-s6a-001-101-korean.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:architecture
            node --test tests/theme-navigation.test.mjs tests/audit-regressions.test.mjs tests/related-dex-links.test.mjs
          done
