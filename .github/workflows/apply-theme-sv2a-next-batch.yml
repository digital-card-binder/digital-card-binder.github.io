name: Apply next Korean 151 canonical 30-card batch
on:
  push:
    branches: [main]
    paths:
      - 'data/audits/theme-sv2a-151-180-art-review.json'
      - 'data/audits/theme-sv2a-181-210-art-review.json'
      - '.github/workflows/apply-theme-sv2a-next-batch.yml'
permissions:
  contents: write
concurrency:
  group: theme-sv2a-guarded-batches
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Validate and apply next independent Korean printed-card batch
        run: node scripts/apply-theme-sv2a-next-batch.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit tested data and durable checkpoint, not user ownership
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sv2a-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then
            echo "No content changed; verified batch already committed."
            exit 0
          fi
          git commit -m "Apply next verified Korean 151 thirty-card theme review batch"
          git pull --rebase origin main
          git push origin HEAD:main
