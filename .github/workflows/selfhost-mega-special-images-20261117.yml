name: Selfhost MEZ/MEE/MEM series images
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: selfhost-mega-special-images
  cancel-in-progress: false
jobs:
  selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install --quiet Pillow==12.3.0
      - run: npm ci
      - run: python scripts/probe-mega.py
