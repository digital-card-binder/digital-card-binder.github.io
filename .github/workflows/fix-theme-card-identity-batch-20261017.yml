name: Repair all verified theme card identities

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-theme-card-identity-batch-20261017.mjs'
      - '.github/workflows/fix-theme-card-identity-batch-20261017.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-theme-identities-once
  cancel-in-progress: false

jobs:
  fix-verified-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair verified Korean card identities in source datasets
        run: node scripts/fix-theme-card-identity-batch-20261017.mjs
      - name: Validate changed JavaScript
        run: |
          node --check art-themes.js
          node --check core/catalog/card-identity.js
          node --check scripts/fix-theme-card-identity-batch-20261017.mjs
      - name: Synchronize derived indexes and static references
        run: npm run site:prepare
      - name: Verify source and generated catalogs
        run: npm run site:check
      - name: Commit all validated corrections
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ art-themes.js art-themes.html core/catalog/card-identity.js
          git diff --cached --stat
          git diff --cached --quiet && { echo "No changed files."; exit 0; }
          git commit -m "fix: correct 782 theme identities, 27 labels and verified Korean art"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
