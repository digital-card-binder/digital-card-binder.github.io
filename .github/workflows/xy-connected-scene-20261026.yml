name: XY independent connected illustration scene audit
on:
  push:
    branches:
      - audit/xy-connected-scene-reviewed-20261026
    paths:
      - scripts/audit-xy-linked-scenes-20261026.mjs
      - .github/workflows/xy-connected-scene-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xy-connected-scene-20261026
  cancel-in-progress: false
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/xy-connected-scene-reviewed-20261026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply only cross-referenced Korean XY connected-artwork scenes
        run: node scripts/audit-xy-linked-scenes-20261026.mjs
      - name: Verify site data and entire regression suite
        run: |
          npm ci --no-fund
          npm run site:prepare
          npm test
      - name: Confirm existing user and card master data unmodified
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(data/series\.json|data/series-legacy\.json|firestore\.rules|radar-server/|api/radar/|data/radar-|data/card-radar-|tests/card-radar-|scripts/.*radar|\.github/)'; then
            echo "Protected files unexpectedly modified"
            exit 1
          fi
      - name: Commit passing audit evidence on branch only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add data/audits/theme-xy-connected-groups-batch-001-20261026.json
          git commit -m "audit(xy): register 13 scene-specific memberships from five Korean-connected groups"
          git push origin HEAD:audit/xy-connected-scene-reviewed-20261026
