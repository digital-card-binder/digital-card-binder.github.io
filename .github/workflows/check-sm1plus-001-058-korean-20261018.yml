name: Check 58 previously art-reviewed Korean SM1+ printed numbers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-sm1plus-001-058-korean-20261018.yml'
      - 'scripts/check-sm1plus-001-058-korean-20261018.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow beautifulsoup4
      - name: Inspect 58 exact Korean app card numbers against preserved owned artwork
        run: python scripts/check-sm1plus-001-058-korean-20261018.py
