name: Reconcile pending Korean images with existing app catalog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-pending-149-app-sources-20261018.yml'
      - 'scripts/reconcile-pending-149-app-sources-20261018.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/reconcile-pending-149-app-sources-20261018.mjs
