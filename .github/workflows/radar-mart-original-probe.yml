name: Mart original site verification (one-shot)
on:
  pull_request:
    paths:
      - 'scripts/radar-mart-original-probe.mjs'
      - '.github/workflows/radar-mart-original-probe.yml'
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/radar-mart-original-probe.mjs
