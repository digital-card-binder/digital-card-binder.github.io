name: Finalize early Korean pack images

on:
  push:
    paths:
      - ".github/workflows/finalize-early-pack-images.yml"
      - "scripts/finalize_early_pack_images.py"

permissions:
  contents: write

concurrency:
  group: finalize-early-pack-images
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Build final self-hosted early pack images
        run: python scripts/finalize_early_pack_images.py
      - name: Commit final pack assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packs/legacy
          if git diff --cached --quiet; then
            echo "No pack image changes."
            exit 0
          fi
          git commit -m "Finalize self-hosted early Korean pack images"
          git push origin HEAD:main
