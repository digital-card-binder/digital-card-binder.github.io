name: Bootstrap trainer pokemon dex

on:
  push:
    branches:
      - feature/trainer-pokemon-dex
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trainer-pokemon-dex
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build trainer and Pokemon dex
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'{path}: anchor not found')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          data = {
            "version": 1,
            "updatedAt": "2026-09-02",
            "title": "트레이너 & 포켓몬 도감",
            "description": "트레이너 또는 사람이 포켓몬과 같은 일러스트 안에 함께 등장하는 한글판 카드 컬렉션",
            "rules": {
              "include": [
                "이름이 확인되는 트레이너·주요 인물과 포켓몬이 같은 일러스트 안에 함께 등장",
                "이름을 특정하기 어려운 일반인·NPC·관중도 포켓몬과 장면의 주체로 함께 등장하면 '그 외의 사람들'에 포함"
              ],
              "exclude": [
                "트레이너 얼굴 아이콘·마크·사진·간판만 있는 경우",
                "배경에 점처럼 작게 보이는 군중처럼 사람과 포켓몬의 관계가 장면의 주제가 아닌 경우"
              ]
            },
            "groups": [
              {"name":"심향","type":"named","cards":[{"order":1,"name":"심향의 블레이범","pokemonName":"블레이범","trainer":"심향","set":"SV9a","setName":"열풍의 아레나","rarity":"AR","cardNumber":"070/063","code":"sv9a_070/063","illustrator":"GIDORA","image":"https://cards.image.pokemonkorea.co.kr/data/wmimages/SV/SV9a/SV9a_070.png","source":"https://pokemoncard.co.kr/cards/detail/BS2025005070","owned":False}]},
              {"name":"이슬","type":"named","cards":[{"order":1,"name":"이슬의 고라파덕","pokemonName":"고라파덕","trainer":"이슬","set":"SV9a","setName":"열풍의 아레나","rarity":"AR","cardNumber":"071/063","code":"sv9a_071/063","illustrator":"OKACHEKE","image":"https://cards.image.pokemonkorea.co.kr/data/wmimages/SV/SV9a/SV9a_071.png","source":"https://pokemoncard.co.kr/cards/detail/BS2025005071","owned":False},{"order":2,"name":"이슬의 라프라스","pokemonName":"라프라스","trainer":"이슬","set":"SV9a","setName":"열풍의 아레나","rarity":"AR","cardNumber":"072/063","code":"sv9a_072/063","illustrator":"Orca","image":"https://cards.image.pokemonkorea.co.kr/data/wmimages/SV/SV9a/SV9a_072.png","source":"https://pokemoncard.co.kr/cards/detail/BS2025005072","owned":False}]},
              {"name":"페퍼","type":"named","cards":[{"order":1,"name":"페퍼의 요씽리스","pokemonName":"요씽리스","trainer":"페퍼","set":"SV9a","setName":"열풍의 아레나","rarity":"AR","cardNumber":"075/063","code":"sv9a_075/063","illustrator":"Natsumi Yoshida","image":"https://cards.image.pokemonkorea.co.kr/data/wmimages/SV/SV9a/SV9a_075.png","source":"https://pokemoncard.co.kr/cards/detail/BS2025005075","owned":False}]},
              {"name":"난천","type":"named","cards":[{"order":1,"name":"난천의 한카리아스 ex","pokemonName":"한카리아스","trainer":"난천","set":"SV9a","setName":"열풍의 아레나","rarity":"SAR","cardNumber":"087/063","code":"sv9a_087/063","illustrator":"HICO KIM","image":"https://cards.image.pokemonkorea.co.kr/data/wmimages/SV/SV9a/SV9a_087.png","source":"https://pokemoncard.co.kr/cards/detail/BS2025005087","owned":False}]},
              {"name":"N","type":"named","cards":[{"order":1,"name":"N의 제크로무","pokemonName":"제크로무","trainer":"N","set":"M2a","setName":"MEGA 드림 ex","rarity":"AR","cardNumber":"210/193","code":"m2a_210/193","illustrator":"Bun Toujo","image":"https://cards.image.pokemonkorea.co.kr/data/wmimages/MEGA/M2a/M2a_210.png","source":"https://pokemoncard.co.kr/cards/detail/BS2025015210","owned":False}]},
              {"name":"그 외의 사람들","type":"other","cards":[]}
            ]
          }
          Path('data/trainer-pokemon.json').write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

