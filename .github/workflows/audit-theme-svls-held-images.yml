name: Verify held Korean SVLS images
on:
  push:
    branches: [main]
    paths: [scripts/audit-theme-svls-held-cdn.py]
permissions:
  contents: write
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Inspect only existing user-owned CDN images
        run: python scripts/audit-theme-svls-held-cdn.py
      - name: Commit visual evidence, not site code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/SVLS-held.json data/audits/theme-visual-evidence/SVLS-held.webp.b64
          git commit -m "Verify existing Korean SVLS six held card images"
          git push origin HEAD:main
