name: Validate streamlined personal dex mobile UX
on:
  push:
    branches: [ux/custom-mobile-simplify-tools-20261027]
    paths:
      - custom.html
      - custom.css
      - custom-mobile-ux.js
      - custom-loader.js
      - tests/custom-ux-simplification.test.mjs
      - package.json
      - .github/workflows/ux-custom-simplify-20261027.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ux-custom-simplify-20261027
  cancel-in-progress: false
jobs:
  qa-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/custom-mobile-simplify-tools-20261027
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Test personal dex management and photo/search interactions
        run: node --test tests/custom-ux-simplification.test.mjs
      - name: Generate versioned assets and static site metadata
        run: npm run site:prepare
      - name: Full UI, data consistency and Firestore tests
        run: npm test
      - name: Check original cards and user storage are unaffected
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(data/|firestore\.rules|radar-service/|android-app/|\.github/|firebase-config\.js)'; then
            echo 'Unexpected protected data or backend file mutation'
            exit 1
          fi
      - name: Persist only generated asset references after passing QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add -u
            git commit -m 'build: sync static assets after personal-dex UX simplification'
            git push origin HEAD:ux/custom-mobile-simplify-tools-20261027
          fi
