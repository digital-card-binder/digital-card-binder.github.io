name: One-time add Android v0.9 news

on:
  push:
    branches:
      - chore/news-android-v09-20260904
    paths:
      - '.github/workflows/one-time-add-v09-news.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/news-android-v09-20260904

      - name: Add v0.9 news and sync regression expectation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          news_path = Path('news.json')
          data = json.loads(news_path.read_text(encoding='utf-8'))
          item_id = 'android-app-v09-update'
          if not any(item.get('id') == item_id for item in data.get('items', [])):
              data['items'].insert(0, {
                  'id': item_id,
                  'date': '2026-09-04',
                  'category': '업데이트',
                  'title': '안드로이드 앱 v0.9 업데이트',
                  'summary': '새소식 푸시 알림, 앱 업데이트 확인 기능, 안정성 개선이 반영된 안드로이드 앱 v0.9를 배포했습니다.',
                  'details': [
                      '디지털 카드 바인더 안드로이드 앱을 v0.9로 업데이트했습니다.',
                      '새 도감이나 주요 업데이트가 새소식에 등록되면 앱에서 푸시 알림으로 받아볼 수 있습니다. 처음 실행할 때 알림 권한을 허용해 주세요.',
                      '이후 새로운 앱 버전이 배포되면 앱에서 업데이트 안내를 확인하고 바로 새 버전을 설치할 수 있습니다.',
                      '네트워크나 Firebase 연결에 문제가 발생하더라도 앱 이용에 미치는 영향을 줄이도록 오류 처리와 전반적인 안정성을 개선했습니다.',
                      '기존 v0.8 이용자는 사이트에서 v0.9를 한 번 직접 설치해야 합니다. v0.9 설치 이후부터는 다음 버전 업데이트 안내를 앱에서 받을 수 있습니다.'
                  ]
              })
          news_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = Path('tests/collector-ui-contract.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          old = 'assert.equal(newsData.items[0].id, "trainer-pokemon-dex-launch");'
          new = 'assert.equal(newsData.items[0].id, "android-app-v09-update");'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('latest-news expectation not found')
          test_path.write_text(text, encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json tests/collector-ui-contract.test.mjs
          git commit -m "Add Android v0.9 release news"
          git push
