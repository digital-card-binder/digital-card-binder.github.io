name: Audit series print variants

on:
  push:
    branches:
      - feature/series-print-variant-audit-20260928
    paths:
      - scripts/audit-series-print-variants.py
      - scripts/build_legacy_series_data.py
      - .github/workflows/audit-series-print-variants.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Sword & Shield print variants
        run: python3 scripts/audit-series-print-variants.py --era S --workers 4 --output series-print-variant-audit.json
      - name: Upload audit result
        uses: actions/upload-artifact@v4
        with:
          name: series-print-variant-audit-s
          path: series-print-variant-audit.json
          if-no-files-found: error
