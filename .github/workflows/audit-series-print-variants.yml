name: Audit legacy series print variants

on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-series-print-variants.py'
      - 'scripts/merge-series-print-variant-audit.mjs'
      - 'scripts/audit-series-canonical-slots.mjs'
      - 'scripts/audit-master-card-db.mjs'
      - '.github/workflows/audit-series-print-variants.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legacy-series-print-variant-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Pokemon Korea audit cache
        uses: actions/cache@v4
        with:
          path: tmp/legacy-series-cache
          key: legacy-series-print-audit-v2-${{ runner.os }}
          restore-keys: |
            legacy-series-print-audit-v2-
            legacy-series-print-audit-v1-

      - name: Refresh canonical slot baseline
        run: |
          node scripts/audit-series-inventory.mjs
          node scripts/audit-series-canonical-slots.mjs

      - name: Audit official print variants
        run: |
          mkdir -p data/audits
          for era in ORIGIN ADV DP BW XY SM S; do
            python3 scripts/audit-series-print-variants.py \
              --era "$era" \
              --workers 3 \
              --output "data/audits/series-print-variant-audit-${era}.json"
            node scripts/merge-series-print-variant-audit.mjs \
              "data/audits/series-print-variant-audit-${era}.json"
          done

      - name: Refresh master DB audit
        run: node scripts/audit-master-card-db.mjs

      - name: Verify variant contracts
        run: |
          node --test \
            tests/series-print-variants.test.mjs \
            tests/master-card-db-audit.test.mjs \
            tests/dp-series-dex.test.mjs \
            tests/bw-series-dex.test.mjs \
            tests/xy-series-dex.test.mjs

      - name: Commit verified audit data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/audits/series-print-variant-audit-ORIGIN.json \
            data/audits/series-print-variant-audit-ADV.json \
            data/audits/series-print-variant-audit-DP.json \
            data/audits/series-print-variant-audit-BW.json \
            data/audits/series-print-variant-audit-XY.json \
            data/audits/series-print-variant-audit-SM.json \
            data/audits/series-print-variant-audit-S.json \
            data/series-inventory-audit.json \
            data/series-canonical-slot-audit.json \
            data/series-print-variants.json \
            data/master-card-db-audit.json
          if git diff --cached --quiet; then
            echo "No legacy print-variant audit changes."
            exit 0
          fi
          git commit -m "Audit legacy Korean print variants"
          git pull --rebase origin main
          git push origin HEAD:main
