name: Patch stale news UI test

on:
  push:
    branches:
      - feat/theme-dex-fossil

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/theme-dex-fossil
      - name: Update stale news asset expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/collector-ui-contract.test.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'news[.]js[?]v=20260813-1'
          new = 'news[.]js[?]v=20260915-4'
          if old not in text:
              raise SystemExit('stale expectation not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/patch-stale-news-test.yml
          git add tests/collector-ui-contract.test.mjs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Update stale news asset test"
          git push origin HEAD:feat/theme-dex-fossil
