name: Verify Korean Classic official GET response after source HEAD block
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-classic-official-get.yml'
      - 'scripts/audit-classic-official-get-fallback.py'
permissions:
  contents: write
concurrency:
  group: classic-korean-official-get
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Test four official Korean Classic original GET images after blocked HEAD
        run: python scripts/audit-classic-official-get-fallback.py
      - name: Commit only origin check record and unverified source evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-classic-official-get-fallback-20261013.json
          git add data/audits/classic-korean-candidate-*.b64 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Checkpoint official Korean Classic image GET reachability and optional candidate bytes"
          git pull --rebase origin main
          git push origin HEAD:main
