name: Probe Korean 191 unresolved image sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-korean-191-official-images.yml'
      - 'scripts/probe-korean-191-official-images.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: korean-191-official-image-probe-20261017
  cancel-in-progress: false
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'Pillow>=10,<13'
      - name: Probe precisely 191 inherited holds (no production changes)
        run: python scripts/probe-korean-191-official-images.py
      - name: Commit read-only source probe
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/korean-recovery-official-191-source-probe-20261017.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: record official Korean image source reachability for 191 held slots"
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 4
          done
          exit 1
