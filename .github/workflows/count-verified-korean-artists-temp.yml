name: Count verified Korean artists temp
on:
  push:
    branches:
      - tmp/count-korean-illustrators-20260826
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count artists with Pokemon Korea card matches
        run: |
          python - <<'PY'
          import os,re,subprocess,tempfile
          from collections import defaultdict
          from scripts.build_popular_artist_data import build_local_index, normalized_image, TCGDEX_REPO, TCGDEX_REF
          local=build_local_index()
          era_order={'DP':0,'BW':1,'XY':2,'SM':3,'S':4,'SV':5,'M':6}
          with tempfile.TemporaryDirectory() as td:
            subprocess.run(['git','clone','--filter=blob:none','-q',TCGDEX_REPO,td+'/tcgdex'],check=True)
            subprocess.run(['git','-C',td+'/tcgdex','checkout','-q',TCGDEX_REF],check=True)
            base=td+'/tcgdex/data-asia'
            seen=defaultdict(set); eras=defaultdict(set); sets=defaultdict(set)
            for root,_,files in os.walk(base):
              for fn in files:
                if not fn.endswith('.ts') or not re.fullmatch(r'0*\d+\.ts',fn): continue
                rel=os.path.relpath(os.path.join(root,fn),base).split(os.sep)
                if len(rel)<3: continue
                era,setname=rel[0],rel[1]; num=int(fn[:-3])
                text=open(os.path.join(root,fn),encoding='utf-8',errors='ignore').read()
                m=re.search(r"illustrator:\s*['\"]([^'\"]+)['\"]",text)
                if not m: continue
                artist=m.group(1).strip()
                rows=local.get((setname.casefold(),num),[])
                for row in rows:
                  img=str(row.get('image') or '')
                  if img:
                    seen[artist].add(normalized_image(img)); eras[artist].add(era); sets[artist].add(setname)
            print('VERIFIED_ARTIST_COUNT='+str(len(seen)))
            for artist in sorted(seen,key=lambda a:(-len(seen[a]),a.casefold())):
              old=min((era_order.get(e,99) for e in eras[artist]),default=99)
              print(f'ARTIST\t{artist}\t{len(seen[artist])}\t{",".join(sorted(eras[artist],key=lambda e:era_order.get(e,99)))}\t{len(sets[artist])}\t{old}')
          PY
