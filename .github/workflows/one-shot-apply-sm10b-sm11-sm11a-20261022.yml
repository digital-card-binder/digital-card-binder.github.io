name: One-shot apply Korean SM10b SM11 SM11a artwork theme review
on:
  push:
    branches:
      - audit/theme-sm10b-sm11-sm11a-20261022
    paths:
      - .github/workflows/one-shot-apply-sm10b-sm11-sm11a-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-apply-sm10b-sm11-sm11a-20261022
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install image check and site test dependencies
        run: |
          python -m pip install requests pillow
          npm ci
      - name: Revalidate 241 first-party Korean artwork SHA256 and color proof
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-sm10b-sm11-sm11a-palette-20261022.py
          node --check scripts/apply-sm10b-sm11-sm11a-art-themes-20261022.mjs
          python scripts/build-sm10b-sm11-sm11a-palette-20261022.py
      - name: Apply inspected card themes with strict append-only protections
        run: node scripts/apply-sm10b-sm11-sm11a-art-themes-20261022.mjs
      - name: Rebuild theme coverage and run full site regression suite
        run: |
          npm run site:prepare
          npm test
      - name: Save regression-tested audit only; do not deploy
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/theme-sm10b-sm11-sm11a-20261022"
          git add -u
          git add data/audits/theme-sm10b-sm11-sm11a-color-palette-20261022.json
          git add data/audits/theme-sm10b-sm11-sm11a-artwork-review-20261022.json
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(radar-service/|radar-server/|api/radar/|data/radar-master/|data/card-radar-|data/series.json|data/series-legacy.json|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Unexpected master data or Radar edit'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): append 241 Korean visual art color slots and curated scene memberships'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
