name: Apply verified SVM artwork review
on:
  push:
    branches: [main]
    paths:
      - 'data/audits/theme-svm-111-120-art-review.json'

permissions:
  contents: write

concurrency:
  group: apply-theme-svm-review-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java 21 for Firebase emulator tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Apply only verified Korean art records and checkpoint
        run: node scripts/apply-theme-svm-111-120-review.mjs
      - name: Synchronize site audit and derived indices
        run: npm run site:prepare
      - name: Validate generated consistency
        run: npm run site:check
      - name: Run project verification
        run: npm test
      - name: Commit data only after all validations pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-series-coverage.json
          git add -u
          if git diff --cached --quiet; then
            echo "No differences to apply."
            exit 0
          fi
          git diff --cached --name-only
          git commit -m "Apply SVM 111-120 Korean artwork theme review and validated checkpoint"
          git push origin HEAD:main
