name: Apply XY CP3 verified theme batch and full 37-set inventory
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-xy-cp3-20261026.yml'
      - 'scripts/apply-theme-xy-cp3-verified-20261026.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-theme-xy-cp3-20261026
  cancel-in-progress: false
jobs:
  apply-reviewed-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Apply only four Korean-image-reviewed CP3 cards and checkpoint all XY cards
        run: node scripts/apply-theme-xy-cp3-verified-20261026.mjs
      - name: Rebuild all dependent datasets and run regression suite
        run: |
          npm run site:prepare
          npm test
      - name: Commit verified theme dataset and audit without modifying radar
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          if printf '%s\n' "$changed" | grep -Ei '^(radar-service/|api/radar/|data/radar-master/|data/card-radar-|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Refusing to write Card Radar changes in this batch'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(xy): register verified CP3 artwork and checkpoint 37 XY sets'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
