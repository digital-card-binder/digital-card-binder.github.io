name: Apply remaining Korean SM images
on:
  push:
    branches: [main]
    paths: [".github/workflows/apply-sm-panda-korean.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and apply Korean K-TCG PANDA images
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin,quote
          import requests
          from bs4 import BeautifulSoup

          targets=[
            ("sm1S","sm1s_067/060","라프라스 GX",67),
            ("sm1S","sm1s_068/060","에브이 GX",68),
            ("sm1S","sm1s_069/060","솔가레오 GX",69),
            ("sm1M","sm1m_068/060","루나아라 GX",68),
            ("sm1M","sm1m_070/060","켄타로스 GX",70),
            ("sm1M","sm1m_072/060","포켓몬 교체",72),
            ("sm2K","sm2k_056/050","폭거북스 GX",56),
            ("sm2K","sm2k_060/050","필드 블로어",60),
            ("sm2K","sm2k_061/050","풀회복약",61),
            ("sm2L","sm2l_056/050","약어리 GX",56),
            ("sm2L","sm2l_057/050","카푸나비나 GX",57),
            ("sm2L","sm2l_059/050","메타그로스 GX",59),
            ("sm2L","sm2l_060/050","아쿠아패치",60),
            ("sm7a","sm7a_073/060","카운터게인",73),
            ("sm9","sm9_118/095","잔잔한물가언덕",118),
            ("sm12","sm12_109/095","불카모스 GX",109),
          ]
          H={"User-Agent":"Mozilla/5.0 (compatible; DigitalCardBinder/1.0)","Accept-Language":"ko-KR,ko;q=0.9,en;q=0.5"}
          s=requests.Session(); s.headers.update(H)
          resolved={}
          cache={}
          for setcode,code,name,num in targets:
            dset=setcode
            base=f"https://k-tcgpanda.com/cardimg/SM/{dset}/"
            if base not in cache:
              try:
                r=s.get(base,timeout=20)
                print("DIR",dset,r.status_code,len(r.content),flush=True)
                cache[base]=r.text if r.status_code==200 else ""
              except Exception as e:
                print("DIR_FAIL",dset,repr(e),flush=True); cache[base]=""
            html=cache[base]
            suffix=f"_{dset}_{num:03d}_KOR"
            candidates=[]
            if html:
              soup=BeautifulSoup(html,"html.parser")
              for a in soup.find_all("a",href=True):
                href=a["href"]
                decoded=requests.utils.unquote(href)
                if suffix.casefold() in decoded.casefold() and re.search(r"\.(?:png|jpe?g|webp)$",decoded,re.I):
                  candidates.append(urljoin(base,href))
            # Fallback to predictable exact Korean filename variants if directory listing is blocked.
            if not candidates:
              variants={name,name.replace(" ",""),name.replace("GX"," GX").strip()}
              for nm in variants:
                for ext in ("jpg","png"):
                  candidates.append(base+quote(f"{nm}_{dset}_{num:03d}_KOR.{ext}"))
            found=None
            for url in candidates:
              try:
                rr=s.get(url,timeout=15,stream=True)
                ct=(rr.headers.get("content-type") or "").lower()
                size=int(rr.headers.get("content-length") or 0)
                ok=rr.status_code==200 and ("image" in ct or size>3000)
                if ok and size==0:
                  chunk=next(rr.iter_content(4096),b""); ok=len(chunk)>1000
                rr.close()
                if ok:
                  found=url; break
              except Exception:
                pass
            if found:
              key=(setcode,code)
              resolved[key]={
                "image":found,
                "source":f"https://k-tcgpanda.com/cardpage.php?cardblock={quote(dset)}&cardname={quote(name)}&cardnum={num:03d}"
              }
              print("PANDA_HIT",json.dumps({"set":setcode,"code":code,"name":name,"image":found},ensure_ascii=False),flush=True)
            else:
              print("PANDA_MISS",json.dumps({"set":setcode,"code":code,"name":name},ensure_ascii=False),flush=True)

          path=Path("data/series.json")
          data=json.loads(path.read_text(encoding="utf-8"))
          changed=0
          for g in data:
            if str(g.get("era") or "").upper()!="SM": continue
            for c in g.get("cards",[]):
              row=resolved.get((str(g.get("code")),str(c.get("code"))))
              if not row or "static.tcgexchange.kr" not in str(c.get("image") or ""): continue
              c["image"]=row["image"]
              c["source"]=row["source"]
              c["imageReferenceNote"]="한글판 실물 참고 이미지 (K-TCG PANDA)"
              c["referenceSet"]=g.get("code")
              changed+=1
          for g in data:
            if str(g.get("era") or "").upper()!="SM": continue
            cards=g.get("cards",[])
            official=sum(str(c.get("image") or "").startswith("https://cards.image.pokemonkorea.co.kr/") for c in cards)
            krref=sum(("tcgbox.co.kr/" in str(c.get("image") or "") or "k-tcgpanda.com/" in str(c.get("image") or "")) for c in cards)
            dogam=sum("static.tcgexchange.kr" in str(c.get("image") or "") for c in cards)
            g["referenceImageRegion"]="KR"
            g["referenceNote"]=f"한글판 {len(cards)}장 기준 · 포켓몬코리아 공식 이미지 {official}장" + (f" · 한글판 실물 참고 {krref}장" if krref else "") + (f" · Dogam 보완 {dogam}장" if dogam else "")
          path.write_text(json.dumps(data,ensure_ascii=False,separators=(",",":")),encoding="utf-8")
          print("PANDA_SUMMARY",json.dumps({"targets":len(targets),"resolved":len(resolved),"changed":changed},ensure_ascii=False),flush=True)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Replace final Japanese SM scans with Korean images"
            git push
          fi
