name: Reconcile MEGA M6a official Korean image proofs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconcile-mega-m6a-official-owned-images.yml'
      - 'scripts/probe-mega-official-images.mjs'
      - 'tests/master-card-db-audit.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mega-official-korean-image-proof-reconcile
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify M6a 104-135 official Korean provenance and owned binary hashes
        run: node scripts/probe-mega-official-images.mjs
      - name: Recompute Korean master membership evidence without changing cards
        run: node scripts/audit-mega-korean-membership.mjs
      - name: Reject any unexpected count or evidence-tier promotion
        run: |
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const p=JSON.parse(readFileSync("data/audits/mega-official-image-probe.json"));
            const m=JSON.parse(readFileSync("data/audits/mega-korean-membership-audit.json"));
            const old=JSON.parse(readFileSync("data/audits/m6a-korean-image-sync.json"));
            const official=new Set(old.imported.map(i=>String(i.number)));
            if(official.size!==32||m.summary.pendingOfficialEvidenceCount!==15||
               m.summary.firstPartyVerifiedGapCount!==149||
               m.summary.koreanSecondaryVerifiedGapCount!==15||
               m.summary.expectedSlotCount!==2133) throw Error("Unexpected global totals");
            for(const n of official){
              const key="m6a::m6a::"+n, a=m.slots[key], b=p.slots[key];
              if(!a?.officialConfirmed||!b?.verified||!String(b.url||"").startsWith("https://cards.image.pokemonkorea.co.kr/"))
                throw Error("Missing official SHA-proof "+key);
            }
            const updated=JSON.parse(readFileSync("data/audits/m6a-136-165-korean-image-sync.json"));
            if(updated.imported?.length!==29||updated.stillHeld?.[0]?.number!==157)
              throw Error("Second M6a images or 157 hold drifted");
            for(const item of updated.imported){
              const key="m6a::m6a::"+item.number;
              if(!m.slots[key]?.officialConfirmed||!p.slots[key]?.verified||
                 !String(p.slots[key]?.url||"").startsWith("https://cards.image.pokemonkorea.co.kr/"))
                throw Error("Missing newly archived official proof "+key);
            }
            if(!m.sets.some(s=>s.code==="M6a"&&s.pendingOfficialEvidenceCount===4)
               ||!m.sets.some(s=>s.code==="MC"&&s.pendingOfficialEvidenceCount===1)
               ||!m.sets.some(s=>s.code==="M-P"&&s.pendingOfficialEvidenceCount===10))
              throw Error("Expected unresolved MEGA print slots changed");
            console.log("PASS: 61 official M6a locally hashed assets; 15 official gaps remain");
          '
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:architecture
      - name: Save only audited membership summaries after regressions pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/mega-official-image-probe.json data/audits/mega-korean-membership-audit.json data/master-card-db-audit.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(mega): reconcile 61 Korean self-hosted first-party M6a image proofs"
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/probe-mega-official-images.mjs
            node scripts/audit-mega-korean-membership.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:architecture
          done
