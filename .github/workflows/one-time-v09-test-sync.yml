name: One-time v0.9 test sync

on:
  push:
    branches:
      - feature/android-v0.9
    paths:
      - '.github/workflows/one-time-v09-test-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/android-v0.9

      - name: Update stale v0.8/news expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/collector-ui-contract.test.mjs')
          text = path.read_text(encoding='utf-8')
          old_news = 'assert.equal(newsData.items[0].id, "ar-dual-catalog");'
          new_news = 'assert.equal(newsData.items[0].id, "trainer-pokemon-dex-launch");'
          old_version = 'assert.match(androidGradle, /versionCode 11/);'
          new_version = 'assert.match(androidGradle, /versionCode 12/);'
          if old_news not in text:
              raise SystemExit('old latest-news expectation not found')
          if old_version not in text:
              raise SystemExit('old Android version expectation not found')
          text = text.replace(old_news, new_news, 1)
          text = text.replace(old_version, new_version, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit test contract update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/collector-ui-contract.test.mjs
          git commit -m "Align tests with trainer news and Android v0.9"
          git push
