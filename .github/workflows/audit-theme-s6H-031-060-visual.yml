name: Preflight Korean S6H 031-060 without modifying unresolved S6K
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-s6H-031-060-visual.yml'
      - 'scripts/audit-theme-s6H-031-060-visual.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6h-031-060-read-only-image-proof
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Check Korean S6H print identities and self-hosted images 031-060
        run: python scripts/audit-theme-s6H-031-060-visual.py
      - name: Save preflight only; do not mark artwork or S6K complete
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s6H/031-060
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6H): archive 031-060 canonical number and self-hosted images"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-s6H-031-060-visual.py
          done
