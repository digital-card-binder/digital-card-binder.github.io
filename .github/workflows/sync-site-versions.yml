name: Sync catalog metrics and site versions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-site-versions.yml'
      - '*.html'
      - '*.js'
      - '*.css'
      - 'manifest.webmanifest'
      - 'assets/brand/**'
      - 'core/catalog/**'
      - 'data/**'
      - 'scripts/sync-catalog-metrics.mjs'
      - 'scripts/build-related-dex-index.mjs'
      - 'scripts/sync-site-shell.mjs'
      - 'scripts/sync-site-versions.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site-versions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync and publish generated catalog metrics and asset versions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm run related-dex:sync
            npm run search-index:sync
            npm run catalog-metrics:sync
            npm run shell:sync
            npm run versions:sync

            if git diff --quiet; then
              echo "Catalog metrics and site versions already synchronized"
              exit 0
            fi

            git add data/card-related-dex-index.json data/pokemon-search-index.json core/catalog/catalog-service.js collector-nav.js custom-loader.js print.js pwa.js manifest.webmanifest site-version.json ./*.html
            git commit -m "Sync catalog metrics and site asset versions"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another commit; recalculating from latest main (attempt $attempt)."
          done

          echo "::error::Could not publish synchronized catalog metrics and site versions after 3 attempts."
          exit 1
