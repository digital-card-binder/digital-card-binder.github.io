name: Sync catalog metrics and site versions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-site-versions.yml'
      - 'index.html'
      - 'dashboard.js'
      - 'dashboard.css'
      - 'news.js'
      - 'news.css'
      - 'styles.css'
      - 'collector-nav.js'
      - 'pokemon-search.html'
      - 'core/catalog/catalog-service.js'
      - 'collector-collection-registry.js'
      - 'scripts/sync-catalog-metrics.mjs'
      - 'package.json'
      - 'packs.js'
      - 'data/pokedex.json'
      - 'data/artists.json'
      - 'data/series.json'
      - 'data/series-legacy.json'
      - 'data/pokemon-collections.json'
      - 'data/pokemon-collections-21-40.json'
      - 'data/ar.json'
      - 'data/ar-supplement.json'
      - 'data/people.json'
      - 'data/trainer-pokemon.json'
      - 'data/fossil.json'
      - 'data/world-exploration.json'
      - 'data/promo-packs.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site-versions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync and publish generated catalog metrics and asset versions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            npm run catalog-metrics:sync
            npm run versions:sync

            if git diff --quiet; then
              echo "Catalog metrics and site versions already synchronized"
              exit 0
            fi

            git add core/catalog/catalog-service.js collector-nav.js pwa.js site-version.json ./*.html
            git commit -m "Sync catalog metrics and site asset versions"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push raced with another commit; recalculating from latest main (attempt $attempt)."
          done

          echo "::error::Could not publish synchronized catalog metrics and site versions after 3 attempts."
          exit 1
