name: Sync site versions

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-site-versions.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-site-versions
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync generated asset versions
        run: npm run versions:sync

      - name: Commit synchronized versions
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Site versions already synchronized"
            exit 0
          fi
          git add collector-nav.js pwa.js site-version.json ./*.html
          git commit -m "Sync site asset versions"
          git push
