name: Apply SI Korean Start Deck 100 canonical 001-030 themes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-si-001-030.yml'
      - 'scripts/apply-theme-si-001-030-korean.mjs'
permissions:
  contents: write
concurrency:
  group: si-first-30-korean-themes
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply 30 Korean SI cards and self-hosted themed art
        run: node scripts/apply-theme-si-001-030-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit only after validation with safe concurrent writer retry
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-si-001-030-progress-20261014.json
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Review SI Start Deck 100 first 30 Korean cards and self-hosted art"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-theme-si-001-030-korean.mjs
            npm run site:prepare
            npm run site:check
            npm test
          done
