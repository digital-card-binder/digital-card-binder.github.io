name: Build Android APK v0.8

on:
  push:
    branches:
      - feature/android-apk-test
      - fix/android-sheets-native-auth
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android signing fingerprints
        run: |
          keytool -list -v \
            -keystore android-app/test-signing.keystore \
            -storepass digital-card-binder-test \
            -alias digitalcardbinder-test \
            | grep -E 'SHA1:|SHA256:'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --project-dir android-app :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk DigitalCardBinder_v0.8.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCardBinder-v0.8-apk
          path: DigitalCardBinder_v0.8.apk
          if-no-files-found: error

      - name: Publish v0.8 APK to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DigitalCardBinder_v0.8.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build DigitalCardBinder v0.8 APK"
            git push
          fi
