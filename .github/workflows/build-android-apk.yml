name: Build Android APK v0.9

on:
  push:
    branches:
      - feature/android-v0.9
    paths:
      - 'android-app/**'
      - 'app-version.json'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Configure Firebase credentials
        env:
          FIREBASE_TOKEN_SECRET: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_POKEMON_DEX_40E92: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEMON_DEX_40E92 }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT_POKEMON_DEX_40E92:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_POKEMON_DEX_40E92" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          elif [ -n "${FIREBASE_TOKEN_SECRET:-}" ]; then
            echo "FIREBASE_TOKEN_RUNTIME=$FIREBASE_TOKEN_SECRET" >> "$GITHUB_ENV"
          else
            echo "::error::Firebase credential is required to configure FCM for the Android app."
            exit 1
          fi

      - name: Register Firebase Android app and generate google-services.json
        run: |
          set -euo pipefail
          AUTH_ARGS=()
          if [ -n "${FIREBASE_TOKEN_RUNTIME:-}" ]; then
            AUTH_ARGS=(--token "$FIREBASE_TOKEN_RUNTIME")
          fi

          npx firebase-tools apps:list ANDROID --project pokemon-dex-40e92 --json "${AUTH_ARGS[@]}" > "$RUNNER_TEMP/firebase-android-apps.json"
          APP_ID=$(node - "$RUNNER_TEMP/firebase-android-apps.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const apps = Array.isArray(payload) ? payload : (Array.isArray(payload.result) ? payload.result : []);
          const app = apps.find((candidate) =>
            candidate.packageName === 'io.github.digitalcardbinder.app.test' ||
            candidate.namespace === 'io.github.digitalcardbinder.app.test' ||
            candidate.displayName === 'Digital Card Binder Android'
          );
          process.stdout.write(app && app.appId ? app.appId : '');
          NODE
          )

          if [ -z "$APP_ID" ]; then
            npx firebase-tools apps:create -a io.github.digitalcardbinder.app.test ANDROID "Digital Card Binder Android" --project pokemon-dex-40e92 --non-interactive "${AUTH_ARGS[@]}"
            npx firebase-tools apps:list ANDROID --project pokemon-dex-40e92 --json "${AUTH_ARGS[@]}" > "$RUNNER_TEMP/firebase-android-apps.json"
            APP_ID=$(node - "$RUNNER_TEMP/firebase-android-apps.json" <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const apps = Array.isArray(payload) ? payload : (Array.isArray(payload.result) ? payload.result : []);
          const app = apps.find((candidate) =>
            candidate.packageName === 'io.github.digitalcardbinder.app.test' ||
            candidate.namespace === 'io.github.digitalcardbinder.app.test' ||
            candidate.displayName === 'Digital Card Binder Android'
          );
          process.stdout.write(app && app.appId ? app.appId : '');
          NODE
          )
          fi

          if [ -z "$APP_ID" ]; then
            echo "::error::Firebase Android app ID could not be resolved."
            exit 1
          fi

          npx firebase-tools apps:sdkconfig ANDROID "$APP_ID" --project pokemon-dex-40e92 "${AUTH_ARGS[@]}" > android-app/app/google-services.json
          node -e "const c=require('./android-app/app/google-services.json'); if(!c.client?.some(x=>x.client_info?.android_client_info?.package_name==='io.github.digitalcardbinder.app.test')) process.exit(1)"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.9 debug APK
        run: gradle --project-dir android-app :app:assembleDebug --no-daemon

      - name: Prepare website download and APK
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/apk/debug/app-debug.apk DigitalCardBinder_v0.9.apk
          rm -f DigitalCardBinder_v0.8.apk
          python - <<'PY'
          from pathlib import Path
          for name in ('index.html', 'news.js'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('DigitalCardBinder_v0.8.apk', 'DigitalCardBinder_v0.9.apk')
              text = text.replace('앱 다운로드 v0.8', '앱 다운로드 v0.9')
              text = text.replace('안드로이드 앱 v0.8 파일을 준비 중입니다.', '안드로이드 앱 v0.9 파일을 준비 중입니다.')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCardBinder-v0.9-apk
          path: DigitalCardBinder_v0.9.apk
          if-no-files-found: error

      - name: Publish v0.9 APK and download links to branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html news.js DigitalCardBinder_v0.8.apk DigitalCardBinder_v0.9.apk
          if git diff --cached --quiet; then
            echo "APK and download links unchanged"
          else
            git commit -m "Build DigitalCardBinder v0.9 APK"
            git push
          fi
