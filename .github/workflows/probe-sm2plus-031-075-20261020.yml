name: Inspect Korean SM2+ 031–075 sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-sm2plus-031-075-20261020.yml'
      - 'scripts/probe-sm2plus-031-075-korean-20261020.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: probe-sm2plus-031-075
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install requests pillow
      - name: Verify source and download images for independent visual screening
        run: |
          python -m py_compile scripts/probe-sm2plus-031-075-korean-20261020.py
          python scripts/probe-sm2plus-031-075-korean-20261020.py
      - name: Save evidence only, never mutate already reviewed themes
        run: |
          set -euo pipefail
          git add data/audits/theme-sm2plus-031-075-korean-image-preflight-20261020.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(sm2plus): preserve Korean 031–075 image HTTP and hash evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
