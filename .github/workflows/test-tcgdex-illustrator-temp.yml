name: Test TCGdex illustrator temp
on:
  push:
    branches:
      - tmp/count-korean-illustrators-20260826
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Test illustrator endpoints
        run: |
          python - <<'PY'
          import urllib.request, urllib.parse
          name='Ken Sugimori'
          urls=[
            'https://api.tcgdex.net/v2/ko/illustrators/'+urllib.parse.quote(name, safe=''),
            'https://api.tcgdex.net/v2/ko/cards?illustrator='+urllib.parse.quote(name, safe=''),
          ]
          for url in urls:
            try:
              with urllib.request.urlopen(url, timeout=30) as r:
                body=r.read().decode('utf-8')
                print('URL',url,'STATUS',r.status,'LEN',len(body),'HEAD',body[:500])
            except Exception as e:
              print('URL',url,'ERR',repr(e))
          PY
