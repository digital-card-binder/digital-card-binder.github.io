name: Complete Korean SA-F 25 Fighting starter cards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-sa-f-25.yml'
      - 'scripts/apply-theme-sa-f-25-korean.mjs'
permissions:
  contents: write
concurrency:
  group: sal-25-Korean-themed-card-checks
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply Korean fighting starter 25 cards 12 themes and own CDN
        run: node scripts/apply-theme-sa-f-25-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit only after entire site and collector-state regression passes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sa-f-set-progress-20261014.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete Korean SA-F 25 fighting starter prints and own CDN images"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          node scripts/apply-theme-sa-f-25-korean.mjs
          npm run site:prepare
          npm run site:check
          npm test
          git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sa-f-set-progress-20261014.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete Korean SA-F 25 fighting starter on latest main"
          git push origin HEAD:main
