name: XY resume 37-set color-only evidence safely
on:
  push:
    branches:
      - audit/xy-color-resume-20261026
    paths:
      - scripts/continue-xy-color-audit-20261026.py
      - .github/workflows/xy-color-resume-20261026.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xy-color-resume-20261026
  cancel-in-progress: false
jobs:
  reconcile-color-with-existing-CP3:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/xy-color-resume-20261026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and verify existing 37-set evidence without rescanning
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin audit/xy-37-set-consolidated-20261026:refs/remotes/origin/audit/xy-37-set-consolidated-20261026
          BLOB=$(git rev-parse 'origin/audit/xy-37-set-consolidated-20261026:data/audits/theme-xy-all37-image-color-proof-20261026.json')
          test "$BLOB" = "273b4137f543a8bbe64a3b642c8e0069652dcf17"
          git show 'origin/audit/xy-37-set-consolidated-20261026:data/audits/theme-xy-all37-image-color-proof-20261026.json' > data/audits/theme-xy-all37-image-color-proof-20261026.json
      - name: Reconcile only color evidence, retaining four fully visually checked CP3 cards
        run: python scripts/continue-xy-color-audit-20261026.py
      - name: Install tests
        run: npm ci --no-fund
      - name: Rebuild derived data and audit website
        run: |
          npm run site:prepare
          npm test
      - name: Confirm no protected data was changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(data/series\.json|data/series-legacy\.json|data/series-image-overrides\.json|firestore\.rules|radar-server/|api/radar/|data/radar-|data/card-radar-|tests/card-radar-|scripts/.*radar|\.github/)'; then
            echo 'Refusing protected master / Firestore / card radar / workflow mutations'
            exit 1
          fi
      - name: Commit validated results on audit branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add data/audits/theme-xy-all37-image-color-proof-20261026.json data/audits/theme-xy-color-resume-20261026.json
          git diff --cached --name-only
          git commit -m "audit(xy): reconcile 2,117 archived color proofs without claiming 12-theme completion"
          git push origin HEAD:audit/xy-color-resume-20261026
