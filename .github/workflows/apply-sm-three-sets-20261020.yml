name: Apply three Korean SM series art reviews as one safe batch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sm-three-sets-20261020.yml'
      - 'scripts/apply-sm-three-sets-art-themes-20261020.mjs'
      - 'scripts/build-sm-three-sets-art-palette-20261020.py'
      - 'data/audits/theme-sm-three-sets-visual-scene-decisions-20261020.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-korean-sm-three-sets-audit-20261020
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Korean photo verification tools
        run: python -m pip install requests pillow
      - name: Install site dependencies
        run: npm ci
      - name: Verify 274 Korean-source image hashes and artwork colors
        run: |
          python -m py_compile scripts/build-sm-three-sets-art-palette-20261020.py
          python scripts/build-sm-three-sets-art-palette-20261020.py
      - name: Apply 3 separate-set art-theme memberships and 7 image/print holds
        run: node scripts/apply-sm-three-sets-art-themes-20261020.mjs
      - name: Synchronize generated site and run all regression tests
        run: |
          npm run site:prepare
          npm test
      - name: Commit 3 audited series atomically without Card Radar edits
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          if printf '%s\n' "$changed" | grep -E '^(radar-server/|api/radar/|data/radar-master/|data/card-radar-|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Theme audit must never alter Card Radar'
            exit 1
          fi
          echo "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): save Korean SM4+/SM5S/SM5M screens and seven held prints'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
