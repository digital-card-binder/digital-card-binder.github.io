name: Probe official all-card search

on:
  push:
    branches:
      - feature/series-print-variant-audit-modern-20260928
    paths:
      - .github/workflows/tmp-probe-official-all-cards.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Analyze existing image manifest paths
        run: |
          node scripts/build-card-image-manifest.mjs --output=/tmp/card-image-manifest.json
          python3 - <<'PY'
          import json
          import re

          manifest = json.load(open("/tmp/card-image-manifest.json", encoding="utf-8"))
          variants = []
          roots = {}
          for asset in manifest["assets"]:
              if asset["project"] != "modern":
                  continue
              root = asset.get("root", "")
              roots[root] = roots.get(root, 0) + 1
              joined = " ".join(asset.get("sourceUrls", []))
              if re.search(r"(?:_m(?:\.|_)|mirror|reverse|foil|holo|master.?ball|poke.?ball)", joined, re.I):
                  variants.append({
                      "root": root,
                      "path": asset["relativePath"],
                      "sources": asset["sourceUrls"],
                  })
          print("MODERN_ROOT_COUNTS", roots)
          print("VARIANT_NAMED_COUNT", len(variants))
          for item in variants[:200]:
              print("VARIANT", item)
          PY
