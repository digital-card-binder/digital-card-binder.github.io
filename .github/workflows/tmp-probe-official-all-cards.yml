name: Probe official all-card search

on:
  push:
    branches:
      - feature/series-print-variant-audit-modern-20260928
    paths:
      - .github/workflows/tmp-probe-official-all-cards.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List modern official products
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import build_legacy_series_data as legacy

          values = legacy.official_product_values()
          products = sorted(set(values.values()))
          modern = [
              value for value in products
              if (
                  "스칼렛" in value
                  or "바이올렛" in value
                  or "MEGA" in value.upper()
                  or "메가" in value
              )
          ]
          print("ALL_PRODUCTS", len(products))
          print("MODERN_PRODUCTS", len(modern))
          for value in modern:
              print("PRODUCT", repr(value))
          PY
