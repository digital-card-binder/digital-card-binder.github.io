name: Probe official all-card search

on:
  push:
    branches:
      - feature/series-print-variant-audit-modern-20260928
    paths:
      - .github/workflows/tmp-probe-official-all-cards.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe unfiltered card stream
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          from urllib.parse import urlencode
          sys.path.insert(0, str(Path("scripts").resolve()))
          import build_legacy_series_data as legacy

          form = {
              "action": "get_more_cards",
              "limit": "0",
              "GoodsName": "all",
              "CardType": "all",
              "order": "ASC",
              "orderby": "CardNum",
          }
          body = urlencode(form).encode("utf-8")
          payload = legacy.request_bytes(
              f"{legacy.OFFICIAL_BASE}/v2/ajax2_dev2",
              data=body,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Referer": f"{legacy.OFFICIAL_BASE}/cards",
                  "X-Requested-With": "XMLHttpRequest",
              },
              attempts=6,
          )
          response = legacy.parse_json_response(payload)
          rows = response.get("result") or []
          rows = list(rows.values()) if isinstance(rows, dict) else list(rows)
          print("COUNT", len(rows))
          print("MSG", response.get("msg"))
          for row in rows[:12]:
              print("ROW", row.get("CardNum"), row.get("feature_image"))
          PY
