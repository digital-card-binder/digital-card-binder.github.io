name: Probe official all-card search

on:
  push:
    branches:
      - feature/series-print-variant-audit-modern-20260928
    paths:
      - .github/workflows/tmp-probe-official-all-cards.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Locate modern-card page range
        run: |
          python3 - <<'PY'
          import sys
          import time
          from pathlib import Path
          sys.path.insert(0, str(Path("scripts").resolve()))
          import build_legacy_series_data as legacy

          for page in (60, 100, 140, 180, 220):
              rows = legacy.ajax_page("all", 1, page)
              first = rows[0] if rows else {}
              last = rows[-1] if rows else {}
              print(
                  "PAGE", page,
                  "COUNT", len(rows),
                  "FIRST", first.get("CardNum"), first.get("feature_image"),
                  "LAST", last.get("CardNum"), last.get("feature_image"),
              )
              if len(rows) < 30:
                  break
              time.sleep(1.5)
          PY
