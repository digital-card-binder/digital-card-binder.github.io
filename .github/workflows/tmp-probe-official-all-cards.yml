name: Probe official all-card search

on:
  push:
    branches:
      - feature/series-print-variant-audit-modern-20260928
    paths:
      - .github/workflows/tmp-probe-official-all-cards.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect all-card response metadata
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          from urllib.parse import urlencode
          sys.path.insert(0, str(Path("scripts").resolve()))
          import build_legacy_series_data as legacy

          form = {
              "action": "get_more_cards",
              "limit": "0",
              "GoodsName": "all",
              "CardTypeNum": "1",
              "CardType": "all",
              "order": "ASC",
              "orderby": "CardNum",
              "CardMonType": "all",
              "Weakness": "all",
              "Resistance": "all",
              "TechErg": "all",
              "ability_label1": "all",
              "hp": "0,380",
              "retreat": "0,5",
          }
          body = urlencode(form).encode("utf-8")
          payload = legacy.request_bytes(
              f"{legacy.OFFICIAL_BASE}/v2/ajax2_dev2",
              data=body,
              headers={
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Referer": f"{legacy.OFFICIAL_BASE}/cards",
                  "X-Requested-With": "XMLHttpRequest",
              },
              attempts=6,
          )
          response = legacy.parse_json_response(payload)
          print("TOP_KEYS", sorted(response.keys()))
          for key, value in response.items():
              if key == "result":
                  rows = list(value.values()) if isinstance(value, dict) else list(value or [])
                  print("RESULT_COUNT", len(rows))
                  print("FIRST", rows[0] if rows else None)
                  print("LAST", rows[-1] if rows else None)
              else:
                  preview = value if isinstance(value, (str, int, float, bool, type(None))) else str(value)[:500]
                  print("META", key, preview)
          PY
