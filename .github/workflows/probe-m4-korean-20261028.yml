name: Probe official M4 titles (temporary staging)
on:
  push:
    branches: [fix/m4-96-korean-official-names-20261028]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/probe-m4-official-html-20261028.mjs
