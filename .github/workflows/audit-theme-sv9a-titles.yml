name: Render SV9a Korean title evidence
on:
  push:
    branches: [main]
    paths: ['scripts/audit-theme-sv9a-printed-titles.py']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - run: python scripts/audit-theme-sv9a-printed-titles.py
      - name: Save read-only evidence sheets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/sv9a/sv9a-title-*.webp.b64
          git commit -m "Add zoomed Korean SV9a printed-card title proof sheets"
          git push origin HEAD:main
