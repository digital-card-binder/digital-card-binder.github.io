name: Rescue Korean s7D 080 source photo for manual review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rescue-s7d-080-korean.yml'
      - 'scripts/rescue-s7d-080-korean.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Collect Korean-print photo with source and crop contact evidence
        run: python scripts/rescue-s7d-080-korean.py
      - name: Archive photo candidate without changing the existing card catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/s7d-korean-rare/080-korean-candidate.webp
          git add data/audits/theme-visual-evidence/s7d/korean-rescued-sources
          if ! git diff --cached --quiet; then
            git commit -m "audit(s7d): archive source-verified Korean S7D 080 photo candidate"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
