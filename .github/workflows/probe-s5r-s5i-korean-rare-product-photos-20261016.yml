name: Probe twenty S5R/S5I Korean rare photos from retailer and official archives
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-s5r-s5i-korean-rare-product-photos-20261016.yml'
      - 'scripts/probe-s5r-s5i-korean-rare-product-photos-20261016.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s5r-s5i-rare-korean-candidate-probe
  cancel-in-progress: false
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0 beautifulsoup4==4.14.2
      - name: Search 20 Korean retailer product photos and official source without changing master
        run: python scripts/probe-s5r-s5i-korean-rare-product-photos-20261016.py
      - name: Archive unapproved photo-source evidence and candidate contact sheet
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s5r-s5i-korean-rare-candidates-20261016
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s5r,s5i): preserve 20 rare candidate photos and source checks; retain JP holds"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/probe-s5r-s5i-korean-rare-product-photos-20261016.py
          done
