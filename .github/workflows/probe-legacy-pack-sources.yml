name: Probe legacy pack sources
on:
  push:
    paths:
      - "scripts/probe_legacy_pack_sources.py"
      - ".github/workflows/probe-legacy-pack-sources.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_legacy_pack_sources.py
