name: Crop seven verified Korean s6a seller card photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crop-s6a-seven-korean-rare.yml'
      - 'scripts/crop-s6a-seven-korean-rare.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crop-s6a-seven-korean-rare
  cancel-in-progress: false
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Generate aligned Korean card crops and contact sheet
        run: python scripts/crop-s6a-seven-korean-rare.py
      - name: Archive images awaiting final direct visual verification
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 5); do
            git add assets/cards/s6a-korean-rare data/audits/theme-visual-evidence/s6a/korean-candidates
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6a): archive seven Korean card crops and visual proof"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/crop-s6a-seven-korean-rare.py
          done
