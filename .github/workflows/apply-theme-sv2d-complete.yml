name: Complete 99 Korean Clay Burst printed artwork and 12-theme review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-sv2d-complete.yml'
      - 'data/audits/theme-sv2D-001-099-art-review.json'
permissions:
  contents: write
concurrency:
  group: sv2d-Korean-complete
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply guarded 99 Korean printed artwork reviews and retain eight prior themes
        run: node scripts/apply-theme-sv2d-complete-review.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Push full set only after passing all regression checks
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sv2D-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete 99 Korean Clay Burst artworks, 12-theme audit and card names"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          node scripts/apply-theme-sv2d-complete-review.mjs
          npm run site:prepare
          npm run site:check
          npm test
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sv2D-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete 99 Korean Clay Burst artworks on latest main"
          git push origin HEAD:main
