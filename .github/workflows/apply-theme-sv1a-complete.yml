name: Complete 103 Korean Triplet Beat artwork reviews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-sv1a-complete.yml'
      - 'data/audits/theme-sv1a-001-103-art-review.json'
      - 'scripts/apply-theme-sv1a-complete-review.mjs'
permissions:
  contents: write
concurrency:
  group: sv1a-Korean-complete
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply guarded Korean printed 103-card artwork review
        run: node scripts/apply-theme-sv1a-complete-review.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit only a fully tested Korean Triplet Beat complete set
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sv1a-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete Korean Triplet Beat 103 artworks and 12-theme audit"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          node scripts/apply-theme-sv1a-complete-review.mjs
          npm run site:prepare
          npm run site:check
          npm test
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sv1a-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete Korean Triplet Beat 103 artworks on latest main"
          git push origin HEAD:main
