name: Probe S6K 084-095 real Korean print photos without DB mutations
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-s6k-korean-rare.yml'
      - 'scripts/probe-s6k-korean-rare.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-korean-seller-photo-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Gather public seller photo candidates for visual review only
        run: python scripts/probe-s6k-korean-rare.py
      - name: Archive candidate source proof, but do not replace Japanese images automatically
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s6K/korean-candidates
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): archive twelve pending Korean seller image candidates"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/probe-s6k-korean-rare.py
          done
