name: Audit Korean SP2 eight VMAX Special Set images from own CDN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-sp2-visual.yml'
      - 'scripts/audit-theme-sp2-visual.py'
permissions:
  contents: write
concurrency:
  group: sp2-korean-own-cdn-art-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Decode eight Korean SP2 images only through DCB-owned CDN
        run: python scripts/audit-theme-sp2-visual.py
      - name: Record contact sheets and card-by-card image proofs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/SP2
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Korean SP2 8 original card image proofs"
          git pull --rebase origin main
          git push origin HEAD:main
