name: Temporary deploy Firestore rules

on:
  push:
    branches:
      - fix/firestore-trainer-permission

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Select Firebase authentication
        id: auth
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_PROJECT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_POKEMON_DEX_40E92 }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "method=token" >> "$GITHUB_OUTPUT"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT_PROJECT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_PROJECT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "method=service-account" >> "$GITHUB_OUTPUT"
          elif [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "method=service-account" >> "$GITHUB_OUTPUT"
          elif [ -n "$GOOGLE_CREDENTIALS" ]; then
            printf '%s' "$GOOGLE_CREDENTIALS" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "method=service-account" >> "$GITHUB_OUTPUT"
          elif [ -n "$GCP_SA_KEY" ]; then
            printf '%s' "$GCP_SA_KEY" > "$RUNNER_TEMP/firebase-service-account.json"
            echo "method=service-account" >> "$GITHUB_OUTPUT"
          else
            echo "No Firebase deployment credential is configured in GitHub Actions." >&2
            exit 42
          fi
      - name: Deploy Firestore rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          AUTH_METHOD: ${{ steps.auth.outputs.method }}
        run: |
          set -euo pipefail
          if [ "$AUTH_METHOD" = "token" ]; then
            npx firebase-tools deploy --only firestore:rules --project pokemon-dex-40e92 --token "$FIREBASE_TOKEN" --non-interactive
          else
            GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json" npx firebase-tools deploy --only firestore:rules --project pokemon-dex-40e92 --non-interactive
          fi
