name: Stage verified S6K 084 085 087 photo crops for footer review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crop-s6k-084-085-087.yml'
      - 'scripts/crop-s6k-084-085-087.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-084-085-087-crop-visual-proof
  cancel-in-progress: false
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Prepare card crops and enlarged footer visual evidence
        run: python scripts/crop-s6k-084-085-087.py
      - name: Stage archive and photos only without changing live master cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add assets/cards/s6k-korean-rare/084-korean.webp assets/cards/s6k-korean-rare/085-korean.webp assets/cards/s6k-korean-rare/087-korean.webp
            git add data/audits/theme-visual-evidence/s6K/korean-candidates/approved-batch2
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): stage 084 085 087 Korean photos and enlarged footer evidence"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/crop-s6k-084-085-087.py
          done
