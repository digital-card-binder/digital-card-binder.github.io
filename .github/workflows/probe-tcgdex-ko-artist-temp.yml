name: Probe TCGdex KO artist temp

on:
  push:
    branches:
      - feat/add-ranked-artists-top10-ko-20260826
    paths:
      - .github/workflows/probe-tcgdex-ko-artist-temp.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Korean illustrator API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          artists=['nagimiso','Ken Sugimori','Kouki Saitou','Akira Komayama','Masakazu Fukuda','Megumi Mizutani','Anesaki Dynamic','Hideki Ishikawa','Shin Nagasawa','takuyoa']
          for a in artists:
              url='https://api.tcgdex.net/v2/ko/illustrators/'+urllib.parse.quote(a,safe='')
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:
                      raw=r.read().decode('utf-8')
                  data=json.loads(raw)
                  print('\nARTIST',a,'TYPE',type(data).__name__,'LEN',len(data) if hasattr(data,'__len__') else None)
                  if isinstance(data,list):
                      print('FIRST',json.dumps(data[:3],ensure_ascii=False)[:4000])
                      eras={}
                      for x in data:
                          sid=str((x or {}).get('id') or '')
                          prefix=sid.split('-')[0] if '-' in sid else sid[:4]
                          eras[prefix]=eras.get(prefix,0)+1
                      print('PREFIXES',json.dumps(eras,ensure_ascii=False,sort_keys=True))
                  else:
                      print('DATA',json.dumps(data,ensure_ascii=False)[:4000])
              except Exception as e:
                  print('\nARTIST',a,'ERROR',repr(e))
          PY
