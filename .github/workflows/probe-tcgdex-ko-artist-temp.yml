name: Probe TCGdex KO artist temp

on:
  push:
    branches:
      - feat/add-ranked-artists-top10-ko-20260826
    paths:
      - .github/workflows/probe-tcgdex-ko-artist-temp.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe TCGdex card image API
        run: |
          python - <<'PY'
          import json, urllib.request
          for cid in ['dp1-103','dp1-49','bw1-101','xy12-55']:
              url='https://api.tcgdex.net/v2/en/cards/'+cid
              try:
                  with urllib.request.urlopen(url,timeout=30) as r:
                      data=json.loads(r.read().decode('utf-8'))
                  print('\nCARD',cid,json.dumps({k:data.get(k) for k in ['id','localId','name','image','illustrator']},ensure_ascii=False))
              except Exception as e:
                  print('\nCARD',cid,'ERROR',repr(e))
          PY
