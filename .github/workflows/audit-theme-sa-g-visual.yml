name: Audit 24 Korean SA-G grass starter images from own CDN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-sa-g-visual.yml'
      - 'scripts/audit-theme-sa-g-visual.py'
permissions:
  contents: write
concurrency:
  group: sa-g-korean-owned-24-art-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Inspect 24 own Korean SA-G images without requesting original sources
        run: python scripts/audit-theme-sa-g-visual.py
      - name: Commit only read-only Korean artwork evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/SA-G
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Checkpoint Korean SA-G grass starter 24 owned images"
          git pull --rebase origin main
          git push origin HEAD:main
