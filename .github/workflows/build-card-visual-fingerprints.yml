name: Build card visual fingerprints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-card-visual-fingerprints.yml"
      - "scripts/build_card_visual_fingerprints.py"
      - "data/pokemon-search-index.json"
      - "card-image-cdn.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-visual-fingerprints
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet "Pillow==12.3.0"

      - run: python scripts/probe-fp.py
