name: Build card visual fingerprints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-card-visual-fingerprints.yml"
      - "scripts/build_card_visual_fingerprints.py"
      - "data/pokemon-search-index.json"
      - "card-image-cdn.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-visual-fingerprints
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet "Pillow==12.3.0"

      - name: Restore modern image archive
        uses: actions/cache/restore@v4
        with:
          path: tmp/card-images/build/modern
          key: visual-fingerprint-modern-${{ github.run_id }}
          restore-keys: |
            card-images-v2-${{ runner.os }}-modern-
            card-images-v1-${{ runner.os }}-modern-

      - name: Restore legacy image archive
        uses: actions/cache/restore@v4
        with:
          path: tmp/card-images/build/legacy
          key: visual-fingerprint-legacy-${{ github.run_id }}
          restore-keys: |
            card-images-v2-${{ runner.os }}-legacy-
            card-images-v1-${{ runner.os }}-legacy-

      - name: Build visual fingerprint index
        run: |
          python scripts/build_card_visual_fingerprints.py --workers 24

      - name: Show failures
        run: |
          python - <<'PY'
          import json,collections
          f=json.load(open("data/card-visual-fingerprints-failures.json"))
          c=collections.Counter(x["setCode"] for x in f)
          print("FPSETS",dict(c))
          seen=set()
          for x in f:
              if x["setCode"] in seen: continue
              seen.add(x["setCode"]); print("FPERR",x["setCode"],x["rawCode"],x["error"][:240])
          PY
