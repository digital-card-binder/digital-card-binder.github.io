name: Build card visual fingerprints

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-card-visual-fingerprints.yml"
      - "scripts/build_card_visual_fingerprints.py"
      - "data/pokemon-search-index.json"
      - "card-image-cdn.js"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: card-visual-fingerprints
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --quiet "Pillow==12.3.0"

      - name: Restore modern image archive
        uses: actions/cache/restore@v4
        with:
          path: tmp/card-images/build/modern
          key: visual-fingerprint-modern-${{ github.run_id }}
          restore-keys: |
            card-images-v2-${{ runner.os }}-modern-
            card-images-v1-${{ runner.os }}-modern-

      - name: Restore legacy image archive
        uses: actions/cache/restore@v4
        with:
          path: tmp/card-images/build/legacy
          key: visual-fingerprint-legacy-${{ github.run_id }}
          restore-keys: |
            card-images-v2-${{ runner.os }}-legacy-
            card-images-v1-${{ runner.os }}-legacy-

      - name: Build visual fingerprint index
        run: |
          python scripts/build_card_visual_fingerprints.py --workers 24

      - name: Validate generated index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/card-visual-fingerprints.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          assert data["count"] > 10000, data
          assert data["count"] >= int(data["catalogCount"] * 0.90), data
          print(data["catalogCount"], data["count"], data["failed"])
          PY

      - name: Commit generated fingerprints
        run: |
          set -euo pipefail
          if git diff --quiet -- data/card-visual-fingerprints.json data/card-visual-fingerprints-failures.json; then
            echo "Fingerprint index is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/card-visual-fingerprints.json data/card-visual-fingerprints-failures.json
          git commit -m "Generate card visual fingerprint index"
          git pull --rebase origin main
          git push origin HEAD:main
