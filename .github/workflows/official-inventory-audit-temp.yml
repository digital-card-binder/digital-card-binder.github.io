name: Temporary official inventory audit

on:
  push:
    branches:
      - audit-official-inventory-20260926
    paths:
      - ".github/workflows/official-inventory-audit-temp.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe official pagination bounds
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://pokemoncard.co.kr";
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function probe(cardType,page){
            const form=new URLSearchParams({action:"get_more_cards",limit:String(page),GoodsName:"",CardTypeNum:String(cardType),CardType:"all",order:"ASC",orderby:"CardNum"});
            if(cardType===1) for(const [k,v] of Object.entries({CardMonType:"all",Weakness:"all",Resistance:"all",TechErg:"all",ability_label1:"all",hp:"0,380",retreat:"0,5"})) form.set(k,v);
            let text="";
            for(let attempt=0;attempt<3;attempt++){
              try{
                const res=await fetch(`${BASE}/v2/ajax2_dev2`,{
                  method:"POST",headers:{
                    "User-Agent":"digital-card-binder-official-inventory-audit/1.0 (+https://digital-card-binder.github.io/)",
                    "Content-Type":"application/x-www-form-urlencoded","Referer":`${BASE}/cards`,"X-Requested-With":"XMLHttpRequest"
                  },body:form.toString(),signal:AbortSignal.timeout(45000)
                });
                text=await res.text(); break;
              }catch(e){if(attempt===2) throw e;await sleep(1200*(attempt+1));}
            }
            let start=text.indexOf('{"status"'); if(start<0) start=text.indexOf("{");
            if(start<0){console.log("BOUND="+JSON.stringify({cardType,page,count:0,noJson:true,textLength:text.length,snippet:text.slice(0,80)}));return;}
            const obj=JSON.parse(text.slice(start));
            const rows=Array.isArray(obj.result)?obj.result:Object.values(obj.result||{});
            const ids=rows.map(r=>String(r.CardNum||""));
            console.log("BOUND="+JSON.stringify({cardType,page,count:rows.length,first:ids[0]||"",last:ids.at(-1)||"",limitMeta:obj.limit}));
          }
          const tests=[[1,299],[1,300],[2,0],[2,25],[2,50],[2,75],[2,100],[2,150],[3,0],[3,25],[3,50],[3,75],[3,100]];
          for(const [t,p] of tests){await probe(t,p);await sleep(1200);}
          NODE
