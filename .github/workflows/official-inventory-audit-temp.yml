name: Temporary official inventory audit

on:
  push:
    branches:
      - audit-official-inventory-20260926
    paths:
      - ".github/workflows/official-inventory-audit-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Diagnose Pokemon Korea card pagination
        shell: bash
        run: |
          node <<'NODE'
          const crypto = await import("node:crypto");
          const BASE = "https://pokemoncard.co.kr";
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          async function get(url, options={}) {
            const res = await fetch(url, {
              ...options,
              headers: {
                "User-Agent":"digital-card-binder-official-inventory-audit/1.0 (+https://digital-card-binder.github.io/)",
                "Accept-Language":"ko-KR,ko;q=0.9,en;q=0.5",
                ...(options.headers||{})
              },
              signal: AbortSignal.timeout(45000),
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.text();
          }

          function parseJson(text) {
            let start=text.indexOf('{"status"');
            if(start<0) start=text.indexOf("{");
            return JSON.parse(text.slice(start));
          }

          async function page(limit) {
            const form=new URLSearchParams({
              action:"get_more_cards",
              limit:String(limit),
              GoodsName:"",
              CardTypeNum:"1",
              CardType:"all",
              order:"ASC",
              orderby:"CardNum",
              CardMonType:"all",
              Weakness:"all",
              Resistance:"all",
              TechErg:"all",
              ability_label1:"all",
              hp:"0,380",
              retreat:"0,5",
            });
            const text=await get(`${BASE}/v2/ajax2_dev2`,{
              method:"POST",
              headers:{
                "Content-Type":"application/x-www-form-urlencoded",
                "Referer":`${BASE}/cards`,
                "X-Requested-With":"XMLHttpRequest"
              },
              body:form.toString()
            });
            const obj=parseJson(text);
            const rows=Array.isArray(obj.result)?obj.result:Object.values(obj.result||{});
            const ids=rows.map(r=>String(r.CardNum||r.card_num||r.idx||""));
            return {
              limit,
              count:rows.length,
              first:ids[0]||"",
              last:ids.at(-1)||"",
              unique:new Set(ids).size,
              hash:crypto.createHash("sha256").update(JSON.stringify(rows)).digest("hex").slice(0,16),
              sample:rows.slice(0,2).map(r=>({CardNum:r.CardNum,feature_image:r.feature_image,GoodsName:r.GoodsName}))
            };
          }

          const html=await get(`${BASE}/cards`);
          const scripts=[...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]);
          console.log("SCRIPT_SRCS="+JSON.stringify(scripts));
          for(const lim of [0,1,2,30,60]) {
            const result=await page(lim);
            console.log("PAGE_DIAG="+JSON.stringify(result));
            await sleep(1500);
          }
          NODE
