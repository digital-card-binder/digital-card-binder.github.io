name: Temporary official inventory audit

on:
  push:
    branches:
      - audit-official-inventory-20260926
    paths:
      - ".github/workflows/official-inventory-audit-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Collect Pokemon Korea official card search inventory
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("fs");
          const BASE = "https://pokemoncard.co.kr";
          const OUT = "official-inventory.json";
          const SUMMARY = "official-inventory-summary.json";
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const clean = (v) => String(v ?? "").trim();

          async function request(url, options = {}, attempts = 4) {
            let last;
            for (let i = 0; i < attempts; i += 1) {
              try {
                const res = await fetch(url, {
                  ...options,
                  headers: {
                    "User-Agent": "digital-card-binder-official-inventory-audit/1.1 (+https://digital-card-binder.github.io/)",
                    "Accept-Language": "ko-KR,ko;q=0.9,en;q=0.5",
                    ...(options.headers || {}),
                  },
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return await res.text();
              } catch (error) {
                last = error;
                if (i + 1 < attempts) await sleep(1800 * (i + 1));
              }
            }
            throw last;
          }

          function decodeHtml(value) {
            return String(value || "")
              .replace(/&quot;/gi, '"').replace(/&#39;/gi, "'")
              .replace(/&amp;/gi, "&").replace(/&lt;/gi, "<").replace(/&gt;/gi, ">");
          }

          function parseProducts(html) {
            const select = html.match(/<select[^>]*name=["']GoodsName["'][^>]*>([\s\S]*?)<\/select>/i)?.[1] || "";
            const products = [];
            for (const match of select.matchAll(/<option[^>]*value=["']([^"']+)["'][^>]*>/gi)) {
              const value = decodeHtml(match[1]).trim();
              if (value && !products.includes(value)) products.push(value);
            }
            return products;
          }

          function parseJson(text) {
            let start = text.indexOf('{"status"');
            if (start < 0) start = text.indexOf("{");
            if (start < 0) throw new Error("No JSON object in response");
            return JSON.parse(text.slice(start));
          }

          async function ajaxPage(product, cardType, page) {
            const form = new URLSearchParams({
              action: "get_more_cards",
              limit: String(page),
              GoodsName: product,
              CardTypeNum: String(cardType),
              CardType: "all",
              order: "ASC",
              orderby: "CardNum",
            });
            if (cardType === 1) {
              form.set("CardMonType", "all");
              form.set("Weakness", "all");
              form.set("Resistance", "all");
              form.set("TechErg", "all");
              form.set("ability_label1", "all");
              form.set("hp", "0,380");
              form.set("retreat", "0,5");
            }
            const text = await request(`${BASE}/v2/ajax2_dev2`, {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded",
                "Referer": `${BASE}/cards`,
                "X-Requested-With": "XMLHttpRequest",
              },
              body: form.toString(),
            });
            const payload = parseJson(text);
            const result = payload.result || [];
            return Array.isArray(result) ? result : Object.values(result);
          }

          function rowId(row) {
            return clean(row.CardNum || row.card_num || row.idx || row.no || "");
          }

          function rowSignature(rows) {
            return rows.map((r) => rowId(r) || clean(r.feature_image || r.image || "")).join("|");
          }

          function imageUrl(v) {
            const path = clean(v).split("?", 1)[0].replace(/^\/+/, "");
            return path ? `https://cards.image.pokemonkorea.co.kr/data/${path}` : "";
          }

          function save(products, productStats, allRows, requestCount, errors) {
            const uniqueByCardNum = new Map();
            const noId = [];
            for (const item of allRows) {
              const id = rowId(item.row);
              if (!id) {
                noId.push(item);
                continue;
              }
              const existing = uniqueByCardNum.get(id);
              if (!existing) uniqueByCardNum.set(id, {...item, products:[item.product]});
              else if (!existing.products.includes(item.product)) existing.products.push(item.product);
            }
            const unique = [...uniqueByCardNum.values()];
            const imageEraCounts = {}, imageSetCounts = {}, fieldPresence = {};
            for (const item of unique) {
              const row = item.row;
              for (const key of Object.keys(row)) fieldPresence[key] = (fieldPresence[key] || 0) + 1;
              const feature = clean(row.feature_image || row.image || "");
              const m = feature.match(/wmimages\/([^/]+)\/([^/]+)\//i);
              if (m) {
                imageEraCounts[m[1]] = (imageEraCounts[m[1]] || 0) + 1;
                imageSetCounts[m[2]] = (imageSetCounts[m[2]] || 0) + 1;
              }
            }
            const summary = {
              collectedAt: new Date().toISOString(),
              officialUrl: `${BASE}/cards`,
              complete: productStats.length === products.length && errors.length === 0,
              productOptionCount: products.length,
              processedProductCount: productStats.length,
              requestCount,
              rawAssociationCount: allRows.length,
              uniqueCardNumCount: unique.length,
              duplicateAssociations: allRows.length - unique.length - noId.length,
              missingCardNumRows: noId.length,
              imageEraCounts,
              imageSetCounts,
              fieldPresence: Object.fromEntries(Object.entries(fieldPresence).sort((a,b)=>b[1]-a[1])),
              productStats,
              errors,
            };
            const cards = unique.map((item) => {
              const row=item.row;
              return {
                cardNum: rowId(row),
                products: item.products,
                cardTypeNum: item.cardType,
                name: clean(row.CardName || row.card_name || row.name || row.title || ""),
                cardNumber: clean(row.CardNo || row.card_no || row.number || ""),
                rarity: clean(row.Rarity || row.rarity || ""),
                featureImage: clean(row.feature_image || row.image || ""),
                imageUrl: imageUrl(row.feature_image || row.image || ""),
                raw: row,
              };
            });
            fs.writeFileSync(OUT, JSON.stringify({summary,cards,noId}, null, 2));
            fs.writeFileSync(SUMMARY, JSON.stringify(summary, null, 2));
            return summary;
          }

          async function main() {
            const html = await request(`${BASE}/cards`);
            const products = parseProducts(html);
            if (!products.length) throw new Error("No GoodsName product options found");
            console.log(`Official product options: ${products.length}`);

            const allRows = [], productStats = [], errors = [];
            let requestCount = 1;

            for (let pi = 0; pi < products.length; pi += 1) {
              const product = products[pi];
              const perType = {};
              let productRows = 0;
              try {
                for (const cardType of [1,2,3]) {
                  let rows = 0;
                  let previousSignature = "";
                  for (let page = 0; page < 60; page += 1) {
                    const batch = await ajaxPage(product, cardType, page);
                    requestCount += 1;
                    const signature = rowSignature(batch);
                    if (page > 0 && batch.length && signature === previousSignature) {
                      console.log(`repeat-stop: product ${pi+1}/${products.length} type ${cardType} page ${page}`);
                      break;
                    }
                    previousSignature = signature;
                    for (const row of batch) allRows.push({product,cardType,row});
                    rows += batch.length;
                    productRows += batch.length;
                    if (batch.length < 30) break;
                    await sleep(850);
                    if (page === 59) throw new Error("pagination safety limit");
                  }
                  perType[String(cardType)] = rows;
                  await sleep(850);
                }
                productStats.push({product,rawRows:productRows,perType});
                console.log(`product ${pi+1}/${products.length}: ${productRows} rows · ${product}`);
              } catch (error) {
                errors.push({product,error:String(error)});
                productStats.push({product,rawRows:productRows,perType,error:String(error)});
                console.error(`product error ${product}: ${error}`);
              }
              save(products,productStats,allRows,requestCount,errors);
              await sleep(1000);
            }

            const summary=save(products,productStats,allRows,requestCount,errors);
            console.log("FINAL_SUMMARY=" + JSON.stringify({
              complete:summary.complete,
              productOptionCount:summary.productOptionCount,
              processedProductCount:summary.processedProductCount,
              requestCount:summary.requestCount,
              rawAssociationCount:summary.rawAssociationCount,
              uniqueCardNumCount:summary.uniqueCardNumCount,
              duplicateAssociations:summary.duplicateAssociations,
              missingCardNumRows:summary.missingCardNumRows,
              imageEraCounts:summary.imageEraCounts,
              imageSetCount:Object.keys(summary.imageSetCounts).length,
              errors:summary.errors.length,
            }));
            if (!summary.complete) process.exitCode=2;
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-inventory-audit
          path: |
            official-inventory.json
            official-inventory-summary.json
          if-no-files-found: error
