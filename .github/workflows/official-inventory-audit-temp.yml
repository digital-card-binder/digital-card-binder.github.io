name: Temporary official inventory audit

on:
  push:
    branches:
      - audit-official-inventory-20260926
    paths:
      - ".github/workflows/official-inventory-audit-temp.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect official search response metadata
        shell: bash
        run: |
          node <<'NODE'
          const BASE="https://pokemoncard.co.kr";
          const form=new URLSearchParams({
            action:"get_more_cards",limit:"0",GoodsName:"",CardTypeNum:"1",CardType:"all",
            order:"ASC",orderby:"CardNum",CardMonType:"all",Weakness:"all",Resistance:"all",
            TechErg:"all",ability_label1:"all",hp:"0,380",retreat:"0,5"
          });
          const res=await fetch(`${BASE}/v2/ajax2_dev2`,{
            method:"POST",
            headers:{
              "User-Agent":"digital-card-binder-official-inventory-audit/1.0 (+https://digital-card-binder.github.io/)",
              "Accept-Language":"ko-KR,ko;q=0.9,en;q=0.5",
              "Content-Type":"application/x-www-form-urlencoded",
              "Referer":`${BASE}/cards`,
              "X-Requested-With":"XMLHttpRequest"
            },
            body:form.toString(),
            signal:AbortSignal.timeout(45000)
          });
          const text=await res.text();
          let start=text.indexOf('{"status"'); if(start<0) start=text.indexOf("{");
          const obj=JSON.parse(text.slice(start));
          const meta={};
          for(const [k,v] of Object.entries(obj)){
            if(k==="result") continue;
            meta[k]=v;
          }
          console.log("RESPONSE_META="+JSON.stringify(meta));
          console.log("RESULT_COUNT="+(Array.isArray(obj.result)?obj.result.length:Object.keys(obj.result||{}).length));
          NODE
