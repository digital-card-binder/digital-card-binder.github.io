name: One-shot audit all 19 pending Korean SM series original images
on:
  push:
    branches:
      - audit/theme-sm-remaining19-20261022
    paths:
      - .github/workflows/one-shot-sm-remaining19-source-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-sm-remaining19-source-20261022
  cancel-in-progress: false
jobs:
  audit-all-19:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/series.json
            data/series-legacy.json
            data/art-themes.json
            data/audits/theme-series-coverage.json
            data/audits/theme-sm-remaining19-resume-checkpoint-20261022.json
            scripts/preflight-sm-remaining19-20261022.mjs
            scripts/audit-sm-remaining19-source-20261022.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install requests pillow
      - name: Preflight 19 series and retrieve all 1320 source images exactly once
        run: |
          set -euo pipefail
          node --check scripts/preflight-sm-remaining19-20261022.mjs
          python -m py_compile scripts/audit-sm-remaining19-source-20261022.py
          node scripts/preflight-sm-remaining19-20261022.mjs
          python scripts/audit-sm-remaining19-source-20261022.py
      - name: Preserve contact sheets for manual art review
        uses: actions/upload-artifact@v4
        with:
          name: remaining-19-sm-series-1320-contact-sheets
          path: data/audits/theme-sm-remaining19-contact-sheets-20261022/*.jpg
          retention-days: 7
          if-no-files-found: error
      - name: Commit one evidence batch only, never modify master or main
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/theme-sm-remaining19-20261022"
          git add --sparse -- data/audits/theme-sm-remaining19-master-preflight-20261022.json data/audits/theme-sm-remaining19-source-evidence-20261022.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): evidence and images for all 19 previously pending SM series'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
