name: Rescue Korean s7D 081 and 082 source photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rescue-s7d-081-082-korean.yml'
      - 'scripts/rescue-s7d-081-082-korean.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Download Korean-print eBay sources for 081 and 082 with provenance
        run: python scripts/rescue-s7d-081-082-korean.py
      - name: Save candidate photographs, not catalog replacements
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/s7d-korean-rare data/audits/theme-visual-evidence/s7d/korean-rescued-sources
          if ! git diff --cached --quiet; then
            git commit -m "audit(s7d): archive Korean 081-082 seller image evidence for print review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
