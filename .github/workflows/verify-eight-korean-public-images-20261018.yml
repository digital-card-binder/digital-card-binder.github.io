name: Verify eight deployed Korean card scans
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-eight-korean-public-images-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check eight real WebP CDN assets
        run: node scripts/verify-eight-korean-public-images-20261018.mjs
