name: Close strict SM2L Korean 62/62 and fix printed name 062
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-theme-sm2l-printed-alias-20261019.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: close-theme-sm2l-printed-alias-20261019
  cancel-in-progress: false
jobs:
  strict-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Final guarded Korean SM2L visual and 12-theme set closure
        run: node scripts/close-theme-sm2l-printed-alias-20261019.mjs
      - name: Synchronize generated series coverage, search and UI cache contracts
        run: npm run site:prepare
      - name: Check entire site and rules suite
        run: npm test
      - name: Regression for historical Korean prints and new strict closure
        run: node --test tests/theme-sm2l-final-korean-print-audit.test.mjs tests/theme-sm2l-strict-closure-20261019.test.mjs
      - name: Publish closed review only after everything passes
        run: |
          set -euo pipefail
          git add -u
          git add data/audits/theme-sm2l-strict-closure-20261019.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(sm2l): close all 62 Korean printed cards in twelve themes with alias-safe original identities'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
