name: Complete Korean s6a Eevee Heroes 101 print and theme review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-theme-s6a-korean-rare.yml'
      - 'scripts/complete-theme-s6a-korean-rare.mjs'
      - 'data/audits/theme-visual-evidence/s6a/korean-candidates/approved-crops.json'
      - 'tests/collector-registry.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6a-complete-101-korean-themes
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Replace seven verified Korean Eevee Heroes rare photo prints
        run: node scripts/complete-theme-s6a-korean-rare.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:architecture
      - run: node --test tests/theme-navigation.test.mjs tests/audit-regressions.test.mjs tests/related-dex-links.test.mjs
      - name: Commit verified 101 Korean print images and themes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 8); do
            git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json
            git add data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json
            git add data/audits/theme-s6a-001-101-progress-20261015.json
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Review Korean s6a 101/101 prints and self-hosted Eevee Heroes themes"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 8 ]]; then exit 1; fi
            sleep 4
            git fetch origin main
            git reset --hard origin/main
            node scripts/complete-theme-s6a-korean-rare.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:architecture
            node --test tests/theme-navigation.test.mjs tests/audit-regressions.test.mjs tests/related-dex-links.test.mjs
          done
