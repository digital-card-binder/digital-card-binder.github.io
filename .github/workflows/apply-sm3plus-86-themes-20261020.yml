name: Apply SM3+ 86 Korean artworks; hold five energy copies
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sm3plus-86-themes-20261020.yml'
      - 'scripts/apply-theme-sm3plus-001-086-hold-last-five-20261020.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sm3plus-korean-86-audit
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Apply only image-verified Korean SM3+ reviews
        run: node scripts/apply-theme-sm3plus-001-086-hold-last-five-20261020.mjs
      - name: Build all derived data and run full test suite
        run: |
          npm run site:prepare
          npm test
      - name: Commit tested audit results as one batch
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          if printf '%s\n' "$changed" | grep -E '^(radar-server/|api/radar/|data/radar-master/|data/card-radar-|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Refusing to change Card Radar files in theme-only audit'
            exit 1
          fi
          echo "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): save SM3+ 86 Korean artworks, hold five suspect energy copies'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
