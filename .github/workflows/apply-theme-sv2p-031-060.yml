name: Apply Snow Hazard canonical 031-060 guarded artwork review
on:
  push:
    branches: [main]
    paths:
      - 'data/audits/theme-sv2P-set-progress-20261013.json'
      - 'data/audits/theme-sv2P-031-060-art-review.json'
      - '.github/workflows/apply-theme-sv2p-031-060.yml'
permissions:
  contents: write
concurrency:
  group: theme-sv2p-guarded-batches
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply guarded Korean Snow Hazard 031-060 with correct printed numbers
        run: node scripts/apply-theme-sv2p-031-060-review.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit only successfully tested data and latest safe checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sv2P-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply 30 more Korean Snow Hazard artwork names and themes"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          node scripts/apply-theme-sv2p-031-060-review.mjs
          npm run site:prepare
          npm run site:check
          npm test
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sv2P-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply 30 more Korean Snow Hazard names and themes on latest main"
          git push origin HEAD:main
