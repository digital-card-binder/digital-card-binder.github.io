name: Visual UI Audit for Dex Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-dex-visual.yml'

permissions:
  contents: write

concurrency:
  group: dex-visual-check
  cancel-in-progress: false

jobs:
  visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium for real desktop/mobile screenshots
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Render production GitHub Pages and measure layout
        run: node scripts/check-visual-layout.mjs
      - name: Commit visual evidence and viewport measurements
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/audits/ui-visual-20261014/ || true
          if ! git diff --cached --quiet; then
            git commit -m 'audit(ui): actual Chromium screenshots and responsive measurements'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
