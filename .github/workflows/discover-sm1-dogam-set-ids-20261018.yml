name: Discover KR app sets for last SM image holds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-sm1-dogam-set-ids-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/discover-sm1-dogam-set-ids-20261018.mjs
