name: Final v29-v32 QA and verified static asset sync
on:
  push:
    branches: [stabilization/v29-v32-final-quality-20261028]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stabilization-v29-v32-20261028
  cancel-in-progress: false
jobs:
  verify-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stabilization/v29-v32-final-quality-20261028
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Prepare static references, catalog metrics and integrity checks
        run: npm run site:prepare
      - name: Full UI, performance, collection account and Firestore security regression
        run: npm test
      - name: Stop on protected data or security changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(data/|db/|firestore\.rules$|radar-service/|android-app/|firebase-config\.js$|DigitalCardBinder_.*\.apk$|\.github/)'; then
            echo 'Unexpected protected catalog/permission change'; exit 1
          fi
      - name: Commit cache-busted references only after successful QA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add -u
            git commit -m 'build: synchronize verified v29-v32 static versions'
            git push origin HEAD:stabilization/v29-v32-final-quality-20261028
          fi
