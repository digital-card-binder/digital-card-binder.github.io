name: Audit M6a 136-165 Pokemon Korea official candidates
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-m6a-136-165-official-images.py'
      - '.github/workflows/audit-m6a-136-165-official-images.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m6a-136-165-official-evidence
  cancel-in-progress: false
jobs:
  official-candidate-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Only read original official image candidates, do not touch master or ownership
        run: python scripts/audit-m6a-136-165-official-images.py
      - name: Archive image proof without changing site data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/audits/mega-visual-evidence/m6a-136-165
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(m6a): archive official 136-165 image preflight without approvals"
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-m6a-136-165-official-images.py
          done
