name: Capture DP pack archive candidates
on:
  push:
    paths:
      - "scripts/capture_dp_pack_archive_candidates.py"
      - ".github/workflows/capture-dp-pack-archive-candidates.yml"
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: browser-actions/setup-chrome@v1
      - uses: nanasess/setup-chromedriver@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install selenium pillow requests
      - run: python scripts/capture_dp_pack_archive_candidates.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packs/candidates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add DP archive image candidates"
          git push origin HEAD:main
