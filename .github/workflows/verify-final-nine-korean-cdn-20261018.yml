name: Verify and close nine final Korean image holds
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-final-nine-korean-cdn-20261018.yml"
      - "scripts/verify-close-final-nine-korean-cdn-20261018.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: close-final-nine-korean-image-holds-20261018
  cancel-in-progress: false
jobs:
  validate-and-close:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Compare nine Korean app card photos to live own CDN and reconcile exactly 191 audit statuses
        run: python scripts/verify-close-final-nine-korean-cdn-20261018.py
      - name: Commit closure only if all nine genuinely verified
        run: |
          set -euo pipefail
          git add data/audits/korean-recovery-active-queue-20261018.json data/audits/final-nine-korean-cdn-closure-20261018.json
          if git diff --cached --quiet; then
            echo "No new verified closure"; exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "audit(images): close nine verified Korean images and preserve 24 nonclosed holds"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
