name: Preflight Korean s6K 001-030 print identities and self-hosted images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-s6K-001-030-visual.yml'
      - 'scripts/audit-theme-s6K-001-030-visual.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-001-030-readonly-image-evidence
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Validate 30 canonical Korean print numbers and read self-hosted card images
        run: python scripts/audit-theme-s6K-001-030-visual.py
      - name: Commit image and print-number evidence only (do not mark visual themes complete)
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s6K/001-030
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): archive Korean 001-030 image and print identity preflight"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-s6K-001-030-visual.py
          done
