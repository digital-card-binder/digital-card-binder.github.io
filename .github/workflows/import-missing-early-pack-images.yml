name: Import missing early pack images

on:
  push:
    paths:
      - ".github/workflows/import-missing-early-pack-images.yml"
      - "scripts/import_missing_early_pack_images.py"

permissions:
  contents: write

concurrency:
  group: import-missing-early-pack-images
  cancel-in-progress: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
      - uses: nanasess/setup-chromedriver@v2
      - run: pip install requests pillow selenium
      - name: Import and optimize missing Korean pack images
        run: python scripts/import_missing_early_pack_images.py
      - name: Commit self-hosted images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packs/legacy
          if git diff --cached --quiet; then
            echo "No image changes."
            exit 0
          fi
          git commit -m "Add self-hosted early Korean pack images"
          git push origin HEAD:main
