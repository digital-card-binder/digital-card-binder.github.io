name: Build 5ban Graphics artist data

on:
  workflow_dispatch:
  push:
    branches:
      - add/5ban-graphics-artist
    paths:
      - ".github/workflows/build-5ban-artist.yml"
      - "scripts/build_5ban_artist_data.py"
      - "scripts/finalize_5ban_artist.py"
      - "scripts/build_popular_artist_data.py"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build 5ban Graphics and M6 artist data
        run: python scripts/build_5ban_artist_data.py data/artists.json
      - name: Align catalog metadata and counts
        run: python scripts/finalize_5ban_artist.py
      - name: Refresh artist priority data
        run: python scripts/build_artist_priority.py
      - name: Validate artist catalog
        run: python scripts/validate_artist_data.py data/artists.json
      - name: Commit generated artist data
        run: |
          if git diff --quiet; then
            echo "5ban Graphics catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/artists.json \
            data/artist-priority.json \
            scripts/validate_artist_data.py \
            collector-collection-registry.js \
            collector-nav.js \
            artists.js
          git commit -m "Finalize 5ban Graphics artist catalog"
          git push origin HEAD:${{ github.ref_name }}
