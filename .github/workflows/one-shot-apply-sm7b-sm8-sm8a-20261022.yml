name: One-shot apply 217 visually screened Korean SM artworks
on:
  push:
    branches:
      - audit/theme-sm7b-sm8-sm8a-20261022
    paths:
      - .github/workflows/one-shot-apply-sm7b-sm8-sm8a-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-apply-sm7b-sm8-sm8a-20261022
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install evidence and test dependencies
        run: |
          python -m pip install requests pillow
          npm ci
      - name: Recheck 217 original picture SHA256 values and artwork color pixels
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-sm7b-sm8-sm8a-palette-20261022.py
          node --check scripts/apply-sm7b-sm8-sm8a-art-themes-20261022.mjs
          python scripts/build-sm7b-sm8-sm8a-palette-20261022.py
      - name: Apply only supported independent theme categories and preserve 22 holds
        run: node scripts/apply-sm7b-sm8-sm8a-art-themes-20261022.mjs
      - name: Rebuild production-compatible derived data and test once
        run: |
          npm run site:prepare
          npm test
      - name: Commit the fully tested evidence batch to audit branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/theme-sm7b-sm8-sm8a-20261022"
          git add -u
          git add data/audits/theme-sm7b-sm8-sm8a-color-palette-20261022.json
          git add data/audits/theme-sm7b-sm8-sm8a-artwork-review-20261022.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(radar-service/|radar-server/|api/radar/|data/radar-master/|data/card-radar-|data/series.json|data/series-legacy.json|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Forbidden master or Card Radar changes'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): add 304 independently tagged Korean SM art memberships (217 verified artwork sources; 22 held)'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
