name: Integrate M6 Catalog

on:
  push:
    branches:
      - feature/add-m6-final
    paths:
      - .github/workflows/integrate-m6-final.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Load latest MEGA supplement on series and artist pages
        run: |
          python - <<'PY'
          from pathlib import Path

          scripts = (
              '    <script src="./mega-latest.js?v=20260825-1" defer></script>\n'
              '    <script src="./series-mega-supplement.js?v=20260825-1" defer></script>\n'
          )

          replacements = {
              'series.html': (
                  '    <script src="./owner-sheets-sync.js?v=20260811-3" defer></script>\n'
                  '    <script src="./series-image-loader.js?v=20260822-1" defer></script>',
                  '    <script src="./owner-sheets-sync.js?v=20260811-3" defer></script>\n'
                  + scripts
                  + '    <script src="./series-image-loader.js?v=20260822-1" defer></script>',
              ),
              'artists.html': (
                  '    <script src="./owner-sheets-sync.js?v=20260811-3" defer></script>\n'
                  '    <script src="./artists.js?v=20260820-1" defer></script>',
                  '    <script src="./owner-sheets-sync.js?v=20260811-3" defer></script>\n'
                  + scripts
                  + '    <script src="./artists.js?v=20260820-1" defer></script>',
              ),
          }

          for filename, (needle, replacement) in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if 'mega-latest.js?v=20260825-1' in text:
                  print(f'{filename}: already integrated')
                  continue
              if needle not in text:
                  raise SystemExit(f'{filename}: insertion point not found')
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
              print(f'{filename}: integrated')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/integrate-m6-final.yml

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add series.html artists.html .github/workflows/integrate-m6-final.yml
          git commit -m 'Load M6 data in series and artist catalogs'
          git push origin HEAD:${{ github.ref_name }}
