name: Apply verified s8 Korean Fusion Arts 001-129 themes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-s8-001-129.yml'
      - 'scripts/apply-theme-s8-001-129-korean.mjs'
      - 'tests/collector-registry.test.mjs'
      - 'data/audits/theme-s8-001-045-Korean-art-review-20261015.json'
      - 'data/audits/theme-s8-046-090-Korean-art-review-20261015.json'
      - 'data/audits/theme-s8-091-129-Korean-art-review-20261015.json'
      - 'data/audits/theme-visual-evidence/s8/korean-candidate-117-124/candidates.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s8-001-129-Korean-themes
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply 129 visually verified Korean artworks, self-hosted links and strict Korean artwork records
        run: node scripts/apply-theme-s8-001-129-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:architecture
      - run: node --test tests/theme-navigation.test.mjs tests/audit-regressions.test.mjs tests/related-dex-links.test.mjs
      - name: Commit audited s8 001-129 changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in $(seq 1 10); do
            git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json
            git add data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json
            git add data/audits/theme-s8-001-129-progress-20261015.json
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Review Korean s8 001-129, review 129 Korean artworks with owned images"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 10 ]]; then exit 1; fi
            sleep 4
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-theme-s8-001-129-korean.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:architecture
            node --test tests/theme-navigation.test.mjs tests/audit-regressions.test.mjs tests/related-dex-links.test.mjs
          done
