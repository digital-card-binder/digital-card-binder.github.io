name: Add Basic Series Dex

on:
  push:
    branches:
      - feature/base-series-dex

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/base-series-dex

      - name: Implement basic series dex
        run: |
          python scripts/implement_base_series.py
          python scripts/update_base_series_contracts.py

      - name: Validate
        run: |
          node --check catalog.js
          node --check collector-nav.js
          npm run test:syntax
          npm run test:ui

      - name: Remove one-time helpers
        run: |
          rm .github/workflows/add-base-series-dex.yml
          rm scripts/implement_base_series.py
          rm scripts/update_base_series_contracts.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add basic series dex with shared ownership"
          git push origin feature/base-series-dex
