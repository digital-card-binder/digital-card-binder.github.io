name: Complete Korean S6K 088 091 095 image and hold five
on:
  push:
    branches: [main]
    paths:
      - 'scripts/complete-s6k-088-091-095.mjs'
      - '.github/workflows/complete-s6k-088-091-095.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-088-091-095-korean-printed-check
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply verified Korean 088 091 095 and keep five unverified prints
        run: node scripts/complete-s6k-088-091-095.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit only after all structural tests pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): rehost Korean 088 091 095 and hold five unconfirmed print scans"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/complete-s6k-088-091-095.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
