name: Source Korean s7D 080-082 rainbow rare card photographs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-s7d-korean-rare-images.yml'
      - 'scripts/probe-s7d-korean-rare-images.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Probe official and retailer Korean print image sources
        run: python scripts/probe-s7d-korean-rare-images.py
      - name: Save provenance and candidates without replacing foreign placeholder prints
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/s7d-korean-rare data/audits/theme-visual-evidence/s7d/korean-candidates
          if ! git diff --cached --quiet; then
            git commit -m "audit(s7d): archive sourced Korean 080-082 candidate photos with source provenance"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
