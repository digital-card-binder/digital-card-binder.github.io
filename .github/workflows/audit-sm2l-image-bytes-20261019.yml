name: Validate SM2L canonical image bytes and visualize Korean print holds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-sm2l-image-bytes-20261019.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audit-sm2l-image-bytes-20261019
  cancel-in-progress: false
jobs:
  source-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python photo tools
        run: python -m pip install pillow requests
      - name: Download and decode 62 existing canonical images, log ephemeral review crops
        run: python scripts/audit-sm2l-canonical-image-bytes-20261019.py
      - name: Install and regression-test original binder
        run: |
          npm ci
          npm test
      - name: Commit verification inventory only after success
        run: |
          set -euo pipefail
          git add data/audits/theme-sm2l-canonical-image-http-and-decoding-20261019.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(sm2l): preserve verified image HTTP/decode proofs for all 62 canonical sources'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
