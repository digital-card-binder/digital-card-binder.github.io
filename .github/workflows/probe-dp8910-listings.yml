name: Probe DP8 DP9 DP10 listings
on:
  push:
    paths:
      - "scripts/probe_dp8910_listings.py"
      - ".github/workflows/probe-dp8910-listings.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_dp8910_listings.py
