name: Probe DP8 DP9 DP10 listings
on:
  push:
    paths:
      - "scripts/probe_dp8910_listings.py"
      - ".github/workflows/probe-dp8910-listings.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/probe_dp8910_listings.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packs/candidates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add Fandom DP archive candidates"
          git push origin HEAD:main
