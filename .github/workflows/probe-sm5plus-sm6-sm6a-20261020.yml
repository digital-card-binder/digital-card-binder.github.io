name: Audit next Korean SM trio SM5+ SM6 SM6a source images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-sm5plus-sm6-sm6a-20261020.yml'
      - 'scripts/probe-sm5plus-sm6-sm6a-korean-images-20261020.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: next-korean-sm-three-series-evidence-20261020
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install card image verification tools
        run: python -m pip install requests pillow
      - name: Download and hash source images without changing reviewed themes
        run: |
          python -m py_compile scripts/probe-sm5plus-sm6-sm6a-korean-images-20261020.py
          python scripts/probe-sm5plus-sm6-sm6a-korean-images-20261020.py
      - name: Save next-three-series source evidence and run reference
        run: |
          set -euo pipefail
          git add data/audits/theme-sm5plus-sm6-sm6a-korean-image-preflight-20261020.json
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          if [ "$changed" != "data/audits/theme-sm5plus-sm6-sm6a-korean-image-preflight-20261020.json" ]; then
            echo "Only the source evidence file may be committed"
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "audit(theme): next SM trio preflight image evidence (run $GITHUB_RUN_ID)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
