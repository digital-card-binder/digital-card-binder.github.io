name: Update latest news test expectation

on:
  push:
    branches:
      - feature/news-series-base-filter-20260826

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/news-series-base-filter-20260826
      - name: Update expectation and remove helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/collector-ui-contract.test.mjs')
          text = p.read_text(encoding='utf-8')
          old = 'assert.equal(newsData.items[0].id, "series-s-sm-catalogs");'
          new = 'assert.equal(newsData.items[0].id, "series-base-filter");'
          if old not in text:
              raise SystemExit('expected old latest-news assertion not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/update-news-latest-test.yml').unlink()
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update latest news test expectation"
          git push origin HEAD:feature/news-series-base-filter-20260826
