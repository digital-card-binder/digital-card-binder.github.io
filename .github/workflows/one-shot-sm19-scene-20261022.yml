name: One-shot SM19 original artwork scene review and integrity tests
on:
  push:
    branches:
      - audit/theme-sm19-scene-review-20261022
    paths:
      - .github/workflows/one-shot-sm19-scene-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-sm19-scene-20261022
  cancel-in-progress: false
jobs:
  image-proof-and-scenes:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install image source audit client
        run: python -m pip install requests
      - name: Confirm the actual source SHA256 bytes for individually selected card scenes
        run: |
          set -euo pipefail
          python -m py_compile scripts/recheck-sm19-scene-art-sources-20261022.py
          node --check scripts/apply-sm19-scene-visual-themes-20261022.mjs
          python scripts/recheck-sm19-scene-art-sources-20261022.py
      - name: Add only proven independent scene theme memberships
        run: node scripts/apply-sm19-scene-visual-themes-20261022.mjs
      - name: Validate theme coverage, canonical card identities and UI navigation
        run: |
          node scripts/audit-theme-series-coverage.mjs
          node scripts/audit-theme-series-coverage.mjs --check
          node --test tests/theme-card-identity.test.mjs tests/sm-series-dex.test.mjs tests/structure-consistency.test.mjs tests/theme-navigation.test.mjs
      - name: Commit one safe append-only scene review, without changing live main
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/theme-sm19-scene-review-20261022"
          git add -u
          git add data/audits/theme-sm19-scene-source-recheck-20261022.json
          git add data/audits/theme-sm19-scene-artwork-review-20261022.json
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(radar-service/|radar-server/|api/radar/|data/radar-master/|data/card-radar-|data/series.json|data/series-legacy.json|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Protected source of truth or Card Radar unexpectedly changed'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): visually curated Korean SM card scenes in five thematic dexes'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
