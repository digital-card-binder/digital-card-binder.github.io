name: One-shot release verified Korean SM12 109/095 original artwork
on:
  push:
    branches:
      - release/sm12-109-korean-hr-image-recovery-20261022
    paths:
      - .github/workflows/one-shot-sm12-109-korean-art-repair-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-sm12-109-art-repair-20261022
  cancel-in-progress: false
jobs:
  verify-repair:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Import documented Korean 109/095 footer verification
        run: |
          set -euo pipefail
          git fetch --no-tags origin audit/sm19-13-hard-missing-source-probe-20261022
          git restore --source=FETCH_HEAD -- data/audits/theme-sm19-sm12-109-print-verified-20261022.json
          node --check scripts/restore-sm12-109-korean-hr-image-20261022.mjs
          node scripts/restore-sm12-109-korean-hr-image-20261022.mjs
          git diff --check
          changed="$(git diff --name-only -- data/series.json)"
          test "$changed" = "data/series.json"
          if ! git diff --quiet -- data/art-themes.json series-scope-filter.js tests/base-series-dex.test.mjs; then
            echo 'Protected RGB/theme configuration modified'; exit 1
          fi
      - name: Install dependency lockfile
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build generated site data and indices
        run: npm run site:prepare
      - name: Run entire project regression suite including Firestore and RGB
        run: npm test
      - name: Confirm 273 sets, 20243 cards, 22032 theme rows and new image URL
        run: |
          node - <<'JS'
          const fs=require('fs'); const load=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const sets=[...load('data/series.json'),...load('data/series-legacy.json')];
          const summary=load('data/audits/theme-series-coverage.json').summary;
          const repair=load('data/audits/theme-sm19-sm12-109-korean-image-repair-20261022.json');
          if(sets.length!==273||sets.reduce((n,x)=>n+x.cards.length,0)!==20243||summary.themeCardSlots!==22032
            ||repair.remainingBrokenFromPrior13!==12||repair.totalRemainingHolds!==790)throw Error('Card count or audit invariant violated');
          const match=sets.flatMap(x=>x.cards).filter(c=>c.code?.toLowerCase()==='sm12_109/095');
          if(match.length!==1||match[0].image!==repair.newSource)throw Error('Recovered image URL missing');
          console.log('SM12_109_RELEASE_REGRESSION_OK',JSON.stringify({fixed:repair.repairedCodes,cards:20243,themeSlots:22032,remainingHolds:790}));
          JS
      - name: Commit only vetted recovery and regenerated assets to release branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/sm12-109-korean-hr-image-recovery-20261022"
          git add -u
          git add data/audits/theme-sm19-sm12-109-print-verified-20261022.json
          git add data/audits/theme-sm19-sm12-109-korean-image-repair-20261022.json
          git diff --cached --check
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(data/art-themes.json|series-scope-filter.js|catalog.js|tests/base-series-dex.test.mjs|radar-service/|radar-server/|api/radar/|firestore.rules)'; then
            echo 'Protected master regression found'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sm): restore Korean printed Volcarona GX 109/095 HR from verified photo'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
