name: Stage Korean s6K 093 UR full card photo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-s6k-093-korean-ssg.yml'
      - 'scripts/stage-s6k-093-korean-ssg.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stage-s6k-093-korean
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Download and crop SSG Korean 093 listing source for visual card-number review
        run: python scripts/stage-s6k-093-korean-ssg.py
      - name: Save source and proof; do not change master until inspected
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add assets/cards/s6k-korean-rare/093-korean.webp
            git add data/audits/theme-visual-evidence/s6K/korean-candidates/ssg-093
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): archive Korean 093 UR clean photo for printed footer review"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/stage-s6k-093-korean-ssg.py
          done
