name: Probe Exact Korean CDN Images

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe-exact-korean-cdn.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact Korean image URLs for legacy fallbacks
        run: |
          python -m pip install --quiet requests pillow
          python - <<'PY'
          import io,json,re
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests
          from PIL import Image

          data=json.loads(Path("data/series-legacy.json").read_text(encoding="utf-8"))
          base="https://cards.image.pokemonkorea.co.kr/data/wmimages"

          # Current Japanese/unknown fallback scans are the only targets.
          targets=[]
          for g in data:
              official=[c.get("image","") for c in g.get("cards",[]) if "cards.image.pokemonkorea.co.kr" in (c.get("image") or "")]
              for c in g.get("cards",[]):
                  if "static.tcgexchange.kr" not in (c.get("image") or ""):
                      continue
                  targets.append((g,c,official))

          def card_num(code):
              tail=str(code or "").split("_",1)[-1]
              m=re.match(r"([0-9]{1,3})",tail)
              return int(m.group(1)) if m else None

          def candidates(g,c,official):
              era=str(g.get("era") or "").upper()
              setcode=str(g.get("code") or "")
              n=card_num(c.get("code"))
              if n is None:
                  return []
              nums=[str(n),f"{n:02d}",f"{n:03d}"]
              urls=[]

              # Infer the exact directory/prefix/extension from Korean official
              # neighbours in the same set.
              for sample in official[:8]:
                  clean=sample.split("?",1)[0]
                  m=re.match(r"(.*/)([^/]+?)_([0-9]{1,3})(\.(?:png|jpg|jpeg|webp))$",clean,re.I)
                  if m:
                      directory,prefix,_,ext=m.groups()
                      for num in nums:
                          urls.append(f"{directory}{prefix}_{num}{ext}")
                  else:
                      m=re.match(r"(.*/)([^/]*?)([0-9]{3})(\.(?:png|jpg|jpeg|webp))$",clean,re.I)
                      if m:
                          directory,prefix,_,ext=m.groups()
                          for num in nums:
                              urls.append(f"{directory}{prefix}{num}{ext}")

              # Standard Korean CDN layouts used by the historical database.
              dirs=[
                  f"{base}/{era}/{setcode}",
                  f"{base}/{era}/{setcode.upper()}",
                  f"{base}/{era}/{setcode.lower()}",
                  f"{base}/{era}/PROMO",
                  f"{base}/{era}/Promo",
                  f"{base}/{era}/promo",
                  f"{base}/{era}/temp",
              ]
              prefixes=[setcode,setcode.upper(),setcode.lower()]
              for d in dirs:
                  for p in prefixes:
                      for num in nums:
                          for ext in ("png","jpg","jpeg","webp"):
                              urls.append(f"{d}/{p}_{num}.{ext}")
                              urls.append(f"{d}/{p}{num}.{ext}")

              # Deduplicate without destroying priority.
              return list(dict.fromkeys(urls))

          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0","Referer":"https://pokemoncard.co.kr/cards"})

          def probe(item):
              g,c,official=item
              for url in candidates(g,c,official):
                  try:
                      r=session.get(url,timeout=7)
                      if r.status_code!=200 or len(r.content)<5000:
                          continue
                      ct=(r.headers.get("content-type") or "").lower()
                      if "image" not in ct:
                          continue
                      Image.open(io.BytesIO(r.content)).verify()
                      return {
                          "era":g.get("era"),"set":g.get("code"),
                          "code":c.get("code"),"name":c.get("name"),
                          "old":c.get("image"),"found":url,
                      }
                  except Exception:
                      pass
              return None

          found=[]
          with ThreadPoolExecutor(max_workers=28) as pool:
              fs=[pool.submit(probe,t) for t in targets]
              for i,f in enumerate(as_completed(fs),1):
                  x=f.result()
                  if x:
                      found.append(x)
                  if i%40==0:
                      print(f"PROGRESS {i}/{len(fs)} FOUND {len(found)}",flush=True)

          print("EXACT_SUMMARY",json.dumps({"targets":len(targets),"found":len(found)},ensure_ascii=False))
          for x in sorted(found,key=lambda z:(str(z["era"]),str(z["set"]),str(z["code"]))):
              print("EXACT_FOUND",json.dumps(x,ensure_ascii=False))
          PY
