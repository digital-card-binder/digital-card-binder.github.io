name: Register S6H Korean image preflight and twelve foreign language holds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-s6h-image-audit.yml'
      - 'scripts/register-s6h-image-audit.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6h-image-preflight-review-register
  cancel-in-progress: false
jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Register S6H image-only audit without clearing S6K pending four
        run: node scripts/register-s6h-image-audit.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit partial image-only review after checks succeed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6H): record 83 verified Korean prints and 12 Japanese holds"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/register-s6h-image-audit.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
