name: Korean SM6b SM7 SM7a source evidence in one batch
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/audit-sm6b-sm7-sm7a-source-20261021.yml
      - scripts/audit-sm6b-sm7-sm7a-source-20261021.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: korean-sm6b-sm7-sm7a-source-20261021
  cancel-in-progress: false
jobs:
  evidence:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install requests pillow
      - name: Verify all source pictures and create contact sheets without changing user or theme data
        run: |
          python -m py_compile scripts/audit-sm6b-sm7-sm7a-source-20261021.py
          python scripts/audit-sm6b-sm7-sm7a-source-20261021.py
      - uses: actions/upload-artifact@v4
        with:
          name: korean-sm6b-sm7-sm7a-contact-sheets-20261021
          path: data/audits/theme-sm6b-sm7-sm7a-contact-sheets-20261021/*.jpg
          retention-days: 14
      - name: Save only evidence JSON on the existing audit branch
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ "$GITHUB_HEAD_REF" != "audit/theme-sm6b-sm7-sm7a-20261021" ]; then
            echo "Unexpected audit branch"; exit 1
          fi
          git add data/audits/theme-sm6b-sm7-sm7a-image-evidence-20261021.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "audit(theme): record 271 Korean SM source HTTP SHA256 results, no visual approval"
          git fetch origin "$GITHUB_HEAD_REF"
          git rebase "origin/$GITHUB_HEAD_REF"
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
