name: Build early Korean pack images

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-early-pack-images.yml"
      - "scripts/build_early_pack_images.py"

permissions:
  contents: write

concurrency:
  group: early-pack-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: pip install requests pillow
      - name: Build verified early Korean pack images
        run: python scripts/build_early_pack_images.py
      - name: Publish generated early pack images
        run: |
          if git diff --quiet -- assets/packs/legacy && [ -z "$(git status --porcelain -- assets/packs/legacy)" ]; then
            echo "Early pack images are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/packs/legacy
          git commit -m "Add verified early Korean pack images"
          git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
