name: Apply S1W 061-068 Korean artwork; hold seven Japanese print sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-s1w-061-068-held7.yml'
      - 'scripts/apply-theme-s1w-061-075-korean-held7.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s1w-korean-061-068-held7-theme-apply
  cancel-in-progress: false
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply 8 Korean art cards while holding all seven Japanese print sources
        run: node scripts/apply-theme-s1w-061-075-korean-held7.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit partial verified results only after all checks pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/art-themes.json data/audits/theme-series-review-status.json
            git add data/audits/theme-s1w-061-075-approved18-held7-progress-20261017.json
            git add data/audits/theme-series-coverage.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(theme s1w): add 8 Korean themes for 061-068; hold JP 069-075"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-theme-s1w-061-075-korean-held7.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
