name: Validate artist dex data

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-artist-data.yml"
      - "data/artists.json"
      - "scripts/validate_artist_data.py"
  pull_request:
    paths:
      - ".github/workflows/build-artist-data.yml"
      - "data/artists.json"
      - "scripts/validate_artist_data.py"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed Pokemon Korea artist data
        run: python scripts/validate_artist_data.py data/artists.json
