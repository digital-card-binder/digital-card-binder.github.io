name: Rescue verified Korean s8 prints 117 119 120 123
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-s8-korean-rescue.yml'
      - 'scripts/probe-s8-korean-rescue.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s8-korean-rare-rescue
  cancel-in-progress: false
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - run: python scripts/probe-s8-korean-rescue.py
      - name: Save sourced candidate evidence without altering live catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/cards/s8-korean-rare data/audits/theme-visual-evidence/s8/korean-rescued-sources
          if ! git diff --cached --quiet; then
            git commit -m "audit(s8): archive candidate Korean rare-card photographs with provenance"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
