name: Audit 32 Korean SJ Zacian Zamazenta Eternatus cards from own CDN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-sj-visual.yml'
      - 'scripts/audit-theme-sj-visual.py'
permissions:
  contents: write
concurrency:
  group: sj-korean-32-card-owned-image-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Check all 32 Korean SJ images only through DCB self-hosted CDN
        run: python scripts/audit-theme-sj-visual.py
      - name: Save card-by-card verification proof to main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/SJ
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Checkpoint 32 Korean SJ own-CDN card image proofs"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-sj-visual.py
          done
