name: Sync M6a downstream branch

on:
  push:
    branches:
      - feature/m6a-downstream-dex-update-20260928

permissions:
  contents: write

concurrency:
  group: sync-m6a-downstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/m6a-downstream-dex-update-20260928
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Synchronize generated site versions
        run: npm run versions:sync
      - name: Verify repository
        run: npm test
      - name: Commit synchronized files and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/m6a-downstream-sync.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Synchronize M6a downstream dex updates"
          git push origin HEAD:feature/m6a-downstream-dex-update-20260928
