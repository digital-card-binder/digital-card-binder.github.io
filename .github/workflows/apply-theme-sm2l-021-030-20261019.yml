name: Continue SM2L 021-030 Korean catalogue artwork themes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-sm2l-021-030-20261019.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-theme-sm2l-021-030-20261019
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Apply guarded 021-030 new-only themed card batch
        run: node scripts/apply-theme-sm2l-021-030-screen-20261019.mjs
      - name: Regenerate coverage and site indexes
        run: npm run site:prepare
      - name: Run full regression tests including Firestore emulator
        run: npm test
      - name: Publish only after complete test success
        run: |
          set -euo pipefail
          git add -u
          git add data/audits/theme-sm2l-021-030-artwork-screen-20261019.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(sm2l): add 18 screened theme slots from 021-030 with Korean-print holds'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
