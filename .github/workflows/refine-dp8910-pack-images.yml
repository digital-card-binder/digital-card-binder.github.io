name: Refine DP8 DP9 DP10 pack images
on:
  push:
    paths:
      - "scripts/refine_dp8910_pack_images.py"
      - ".github/workflows/refine-dp8910-pack-images.yml"
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/refine_dp8910_pack_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packs/legacy
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refine BS8 BS9 BS10 pack images"
          git push origin HEAD:main
