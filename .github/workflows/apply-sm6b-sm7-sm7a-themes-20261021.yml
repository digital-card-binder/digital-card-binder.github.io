name: Apply visually reviewed SM6b SM7 SM7a source-safe themes
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-sm6b-sm7-sm7a-themes-20261021
  cancel-in-progress: false
jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install requests pillow
      - run: npm ci
      - name: Validate 247 image hashes and read actual color pixels
        run: |
          python -m py_compile scripts/build-sm6b-sm7-sm7a-palette-20261021.py
          python scripts/build-sm6b-sm7-sm7a-palette-20261021.py
      - name: Append only visually supported categories into separate thematic collections
        run: node scripts/apply-sm6b-sm7-sm7a-art-themes-20261021.mjs
      - name: Rebuild site data and run all regression tests before committing
        run: |
          npm run site:prepare
          npm test
      - name: Commit single tested batch back to the audit branch, never main
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          if [ "$GITHUB_HEAD_REF" != "audit/theme-sm6b-sm7-sm7a-20261021" ]; then exit 1; fi
          git add -u
          git add data/audits/theme-sm6b-sm7-sm7a-color-palette-20261021.json
          git add data/audits/theme-sm6b-sm7-sm7a-artwork-review-20261021.json
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(radar-server/|api/radar/|data/radar-master/|data/card-radar-|data/series.json|data/series-legacy.json|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Protected catalog or Card Radar modified'; exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "audit(theme): add only 247 SHA-verified Korean SM6b SM7 SM7a art memberships (24 held)"
          git fetch origin "$GITHUB_HEAD_REF"
          git rebase "origin/$GITHUB_HEAD_REF"
          git push origin "HEAD:refs/heads/$GITHUB_HEAD_REF"
