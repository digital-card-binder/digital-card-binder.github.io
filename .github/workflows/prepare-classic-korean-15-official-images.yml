name: Prepare 15 official Korean Classic self-hosted interim images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-classic-korean-15-official-images.yml'
      - 'scripts/prepare-classic-korean-15-official-static-assets.py'
permissions:
  contents: write
concurrency:
  group: korean-classic-15-original-asset-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Prepare fifteen exact Korean printed static artwork candidates
        run: python scripts/prepare-classic-korean-15-official-static-assets.py
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit only Korean imagery and quality audit, not master or theme state
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/cards/classic-korean-official-2023 data/audits/theme-classic-15-interim-official-asset-preparation-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save fifteen genuine Korean Classic low-res card art images from official product preview"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          python scripts/prepare-classic-korean-15-official-static-assets.py
          npm run site:prepare
          npm run site:check
          npm test
          git add assets/cards/classic-korean-official-2023 data/audits/theme-classic-15-interim-official-asset-preparation-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save Korean Classic firstparty static art on latest main"
          git push origin HEAD:main
