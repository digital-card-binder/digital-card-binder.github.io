name: Probe SM2+ Korean 011-030 sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-sm2plus-011-030-20261020.yml'
      - 'scripts/probe-sm2plus-011-030-korean-images-20261020.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sm2plus-011-030-source-probe
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Image decoder dependencies
        run: python -m pip install pillow requests
      - name: Check audit source syntax
        run: python -m py_compile scripts/probe-sm2plus-011-030-korean-images-20261020.py
      - name: Request images and prepare review sheets without approval
        run: python scripts/probe-sm2plus-011-030-korean-images-20261020.py
      - name: Save isolated read-only audit record
        run: |
          set -euo pipefail
          git add data/audits/theme-sm2plus-011-030-image-preflight-20261020.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(sm2plus): record 011-030 Korean image source decodes'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
