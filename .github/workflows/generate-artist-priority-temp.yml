name: Generate artist priority temp
on:
  push:
    branches:
      - tmp/count-korean-illustrators-20260826
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ranking
        run: python scripts/build_artist_priority.py
      - name: Commit generated priority data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artist-priority.json
          git commit -m "Generate Korean-only artist priority ranking" || exit 0
          git push
