name: Audit Korean S-P 204 owned-CDN promo images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-sp-visual.yml'
      - 'scripts/audit-theme-sp-visual.py'
permissions:
  contents: write
concurrency:
  group: sp-Korean-evidence-main
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Verify 204 Korean promo artworks from owned Cloudflare only
        run: python scripts/audit-theme-sp-visual.py
      - name: Commit read-only evidence and next set checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/S-P
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture 204 Korean S-P promo owned-CDN card evidence"
          git pull --rebase origin main
          git push origin HEAD:main
