name: Audit 108 Korean Scarlet ex self-hosted printed artworks
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-theme-sv1s-visual.py'
      - '.github/workflows/audit-theme-sv1s-visual.yml'
permissions:
  contents: write
concurrency:
  group: sv1S-evidence-main
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Download only 108 owned Cloudflare Korean card images for inspection
        run: python scripts/audit-theme-sv1s-visual.py
      - name: Commit read-only Korean printed visual image evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/sv1S
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture 108 Korean Scarlet ex own-CDN card contact sheets"
          git pull --rebase origin main
          git push origin HEAD:main
