name: Korean SM4+ SM5S SM5M three-series card source audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-sm-three-sets-20261020.yml'
      - 'scripts/probe-sm4plus-sm5s-sm5m-korean-images-20261020.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sm-three-sets-korean-image-proof
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install requests pillow
      - name: Probe all three Korean series in a single audit batch
        run: |
          python -m py_compile scripts/probe-sm4plus-sm5s-sm5m-korean-images-20261020.py
          python scripts/probe-sm4plus-sm5s-sm5m-korean-images-20261020.py
      - name: Commit source evidence only, no theme or ownership modification
        run: |
          set -euo pipefail
          git add data/audits/theme-sm4plus-sm5s-sm5m-korean-image-preflight-20261020.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): preserve 3-set Korean image source evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
