name: Inspect eight Korean SV-P printed energy number crops
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-svp-energy-printed-number.yml'
      - 'scripts/audit-theme-svp-energy-printed-number.py'
permissions:
  contents: write
concurrency:
  group: svp-8-energy-printed-id
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Audit numbered energy card pixels from own Cloudflare only
        run: python scripts/audit-theme-svp-energy-printed-number.py
      - name: Commit source-preserving print number pixels
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-svp-energy-print-identity-20261013
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture eight SV-P Korean owned image printed energy ID crops"
          git pull --rebase origin main
          git push origin HEAD:main
