name: Apply verified Korean sv4a first 60 card reviews
on:
  push:
    branches: [main]
    paths:
      - 'data/audits/theme-sv4a-001-060-art-review.json'
permissions:
  contents: write
concurrency:
  group: theme-sv4a-guarded-applier
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies
        run: npm ci
      - name: Apply first 60 guarded Korean-print reviews
        run: node scripts/apply-theme-sv4a-batch-reviewed.mjs
      - name: Rebuild site indexes
        run: npm run site:prepare
      - name: Verify generated indexes
        run: npm run site:check
      - name: Run regression tests
        run: npm test
      - name: Commit only tested data and derived indexes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-sv4a-set-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then echo "Already applied."; exit 0; fi
          git commit -m "Apply SV4a Korean cards 001-060 and preserve existing theme ownership"
          git pull --rebase origin main
          git push origin HEAD:main
