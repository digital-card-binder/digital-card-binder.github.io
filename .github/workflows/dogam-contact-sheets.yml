name: Build Dogam Contact Sheets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/dogam-contact-sheets.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --quiet pillow requests
      - name: Build contact sheets
        run: |
          python - <<'PY'
          import io, json, math, os
          from pathlib import Path
          import requests
          from PIL import Image, ImageDraw, ImageFont

          data=json.loads(Path("data/series-legacy.json").read_text(encoding="utf-8"))
          refs=[]
          for g in data:
              for c in g.get("cards",[]):
                  url=c.get("image","")
                  if "static.tcgexchange.kr" in url:
                      refs.append((g.get("era",""),g.get("code",""),c.get("code",""),c.get("name",""),url))
          seen=set(); unique=[]
          for x in refs:
              if x[4] in seen: continue
              seen.add(x[4]); unique.append(x)
          refs=unique
          out=Path("watermark-audit"); out.mkdir(exist_ok=True)
          from concurrent.futures import ThreadPoolExecutor, as_completed

          def fetch(ref):
              era,setcode,code,name,url=ref
              try:
                  rr=requests.get(url,headers={"User-Agent":"Mozilla/5.0"},timeout=12)
                  rr.raise_for_status()
                  im=Image.open(io.BytesIO(rr.content)).convert("RGB")
                  return url,im,None
              except Exception as e:
                  return url,None,str(e)

          downloaded={}
          with ThreadPoolExecutor(max_workers=32) as pool:
              futures=[pool.submit(fetch,ref) for ref in refs]
              for n,f in enumerate(as_completed(futures),1):
                  url,im,err=f.result()
                  downloaded[url]=(im,err)
                  if n%50==0:
                      print(f"DOWNLOAD_PROGRESS {n}/{len(refs)}",flush=True)

          thumb_w,thumb_h=260,364
          label_h=54
          cols,rows=5,4
          per=cols*rows
          for si in range(math.ceil(len(refs)/per)):
              chunk=refs[si*per:(si+1)*per]
              sheet=Image.new("RGB",(cols*thumb_w,rows*(thumb_h+label_h)),"white")
              d=ImageDraw.Draw(sheet)
              for i,(era,setcode,code,name,url) in enumerate(chunk):
                  x=(i%cols)*thumb_w; y=(i//cols)*(thumb_h+label_h)
                  im,err=downloaded.get(url,(None,"missing"))
                  if im is not None:
                      im=im.copy()
                      im.thumbnail((thumb_w-8,thumb_h-8))
                      px=x+(thumb_w-im.width)//2; py=y+(thumb_h-im.height)//2
                      sheet.paste(im,(px,py))
                  else:
                      d.rectangle((x+4,y+4,x+thumb_w-4,y+thumb_h-4),outline="red",width=3)
                      d.text((x+10,y+20),"DOWNLOAD FAIL",fill="red")
                  label=f"{si*per+i+1:03d} {era} {setcode}\n{code}"
                  d.text((x+4,y+thumb_h+4),label,fill="black")
              sheet.save(out/f"dogam_sheet_{si+1:02d}.jpg",quality=90)
          Path(out/"summary.txt").write_text(
              f"unique fallback images: {len(refs)}\n",encoding="utf-8"
          )
          print(f"CONTACT_SHEETS {len(refs)} images / {math.ceil(len(refs)/per)} sheets")
          PY
      - name: Upload sheets
        uses: actions/upload-artifact@v4
        with:
          name: dogam-watermark-contact-sheets
          path: watermark-audit/
          retention-days: 1
