name: One-shot archive twelve verified KR SM missing pictures and regression
on:
  push:
    branches:
      - release/sm12-genuine-korean-card-image-fixes-20261022
    paths:
      - .github/workflows/one-shot-sm12-korean-art-archive-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-sm12-kr-art-archive-20261022
  cancel-in-progress: false
jobs:
  archive-and-test:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Restore validated Korean-print evidence from independent visual audit
        run: |
          set -euo pipefail
          git fetch --no-tags origin audit/sm122-variant-completion-20261022
          git restore --source=FETCH_HEAD -- data/audits/theme-sm14-twelve-genuine-korean-prints-verified-20261022.json
          node --check scripts/archive-sm12-korean-verified-art-20261022.mjs
          node scripts/archive-sm12-korean-verified-art-20261022.mjs
          git diff --check
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Regenerate all website datasets and search index
        run: npm run site:prepare
      - name: Run full website and Firestore emulator test suites including RGB base-dex
        run: npm test
      - name: Assert exact verified locally archived original, 12 files, 20,243 slots, and 22,032 themes
        run: |
          node - <<'JS'
          const fs=require('fs'),crypto=require('crypto');
          const load=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const s=[...load('data/series.json'),...load('data/series-legacy.json')];
          const p=load('data/audits/theme-sm14-twelve-genuine-korean-prints-verified-20261022.json');
          const r=load('data/audits/theme-sm14-twelve-korean-images-repaired-and-archived-20261022.json');
          const t=load('data/audits/theme-series-coverage.json').summary;
          if(s.length!==273||s.reduce((n,v)=>n+v.cards.length,0)!==20243||
             t.themeCardSlots!==22032||r.fullyVerifiedKoreanPhotoRestorations!==12||
             r.rejectedJpSources!==2||r.repairedCards.length!==12)throw Error('Count invariants');
          for(const a of r.repairedCards){
            const row=s.flatMap(v=>v.cards).filter(c=>c.code.toLowerCase()===a.code);
            if(row.length!==1||row[0].image!==a.archivedImageUrl||row[0].source!==a.verifiedSourcePage)
              throw Error('Wrong verified Korean card identity '+a.code);
            const b=fs.readFileSync(a.archivedPath);
            const h=crypto.createHash('sha256').update(b).digest('hex');
            if(h!==a.originalSourceSha256)throw Error('Local image diverged '+a.code);
          }
          if(p.approved.length!==12||p.stillPendingJapaneseMislinks.length!==2)throw Error('Approval drift');
          console.log('TWELVE_KOREAN_ART_APPROVED_AND_ARCHIVED',JSON.stringify({fixed:12,stillHeld:2,sets:273,cards:20243,themeSlots:22032}));
          JS
      - name: Commit verified original photos, card references and audit only to release branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "release/sm12-genuine-korean-card-image-fixes-20261022"
          git add -u
          git add data/audits/theme-sm14-twelve-genuine-korean-prints-verified-20261022.json
          git add data/audits/theme-sm14-twelve-korean-images-repaired-and-archived-20261022.json
          git add assets/cards/korean-sm-restored/*.webp
          git diff --cached --check
          files="$(git diff --cached --name-only)"
          echo "$files"
          if printf '%s\n' "$files" | grep -E '^(data/art-themes.json|series-scope-filter.js|tests/base-series-dex.test.mjs|radar-service/|radar-server/|api/radar/|firestore.rules)'; then
            echo 'Protected theme/RGB/radar/user-data source touched'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(sm): archive twelve inspected Korean rare-card originals and repair master links'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
