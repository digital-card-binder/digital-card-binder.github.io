name: SM2+ Korean artwork first-ten preflight
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-sm2plus-first-ten-20261020.yml'
      - 'scripts/probe-sm2plus-001-010-korean-images-20261020.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sm2plus-first-ten-preflight
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install evidence image decoders
        run: python -m pip install pillow requests
      - name: Check Python syntax before any source requests
        run: python -m py_compile scripts/probe-sm2plus-001-010-korean-images-20261020.py
      - name: Preflight ten Korean master images, preserve all completed sets
        run: python scripts/probe-sm2plus-001-010-korean-images-20261020.py
      - name: Store read-only evidence checkpoint
        run: |
          set -euo pipefail
          git add data/audits/theme-sm2plus-001-010-readonly-preflight-20261020.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(sm2plus): save first ten image decode and catalog evidence only'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
