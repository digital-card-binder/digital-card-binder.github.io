name: Audit SI second 30 of 430 Korean Start Deck 100 cards from own CDN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-si-031-060-visual.yml'
      - 'scripts/audit-theme-si-031-060-visual.py'
permissions:
  contents: write
concurrency:
  group: si-own-cdn-30-korean-image-proofs
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Audit 26 Korean Pikachu V & Eevee V images against self-host only
        run: python scripts/audit-theme-si-031-060-visual.py
      - name: Save proof index and image sheets while preserving latest branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/SI
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Checkpoint Korean SI 16 Golden Box own-CDN images"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-si-031-060-visual.py
          done
