name: Audit 36 complete-set self-hosted image assets
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-completed-36-card-images.mjs'
permissions:
  contents: write
concurrency:
  group: selfhost-completed36-audit
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test 36 completed sets against only owned image CDNs
        run: node scripts/audit-completed-36-card-images.mjs
      - name: Commit evidence only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/completed-36-sets-image-selfhost-20261013.json
          if git diff --cached --quiet; then
            echo "Same results; nothing to commit."
            exit 0
          fi
          git commit -m "Record 36 completed sets self-host image routing and CDN health audit"
          git push origin HEAD:main
