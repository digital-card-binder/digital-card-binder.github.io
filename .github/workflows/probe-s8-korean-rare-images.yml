name: Find Korean Fusion Arts high rarity source images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-s8-korean-rare-images.yml'
      - 'scripts/probe-s8-korean-rare-images.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s8-Korean-rare-image-source-candidates
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - run: python scripts/probe-s8-korean-rare-images.py
      - name: Save source candidates without modifying card database
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/cards/s8-korean-rare data/audits/theme-visual-evidence/s8/korean-candidate-117-124
          if ! git diff --cached --quiet; then
            git commit -m "audit(s8): archive Korean print scan candidates for high rarity 117-124"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
