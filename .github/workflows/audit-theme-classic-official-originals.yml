name: Find Korean Classic CLL CLK CLF official artwork paths
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-classic-official-originals.yml'
      - 'scripts/audit-theme-classic-official-originals.py'
permissions:
  contents: write
concurrency:
  group: classic-korean-official-probe
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: One low-rate HEAD per representative Korean Classic source image
        run: python scripts/audit-theme-classic-official-originals.py
      - name: Save official origin metadata evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-classic-official-image-discovery-20261013.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Checkpoint Korean Classic official first-party card image path tests"
          git pull --rebase origin main
          git push origin HEAD:main
