name: Correct S3a 042 printed Korean name and verify catalog
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-s3a-042-printed-name.yml'
      - 'scripts/correct-s3a-042-printed-name.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s3a-042-printed-name-correction
  cancel-in-progress: false
jobs:
  verify-and-correct:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Cross-check S3a 042 original source identity and correct Korean printed display name only
        run: node scripts/correct-s3a-042-printed-name.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit exactly approved card-name correction and synchronized generated files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/series.json data/audits/theme-s3a-042-printed-name-correction-20261017.json
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "fix(s3a): correct Korean card 042 to 석탄산 V with canonical identity unchanged"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/correct-s3a-042-printed-name.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
