name: Verify fourteen live Korean MEGA image sources
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify-mega-14-self-hosted-20261018.py'
      - '.github/workflows/verify-mega-14-self-hosted-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - name: Match archived image pixels to current Korean catalog images
        run: python scripts/verify-mega-14-self-hosted-20261018.py
