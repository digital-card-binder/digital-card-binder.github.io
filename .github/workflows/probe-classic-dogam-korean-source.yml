name: Inspect only public Korean Classic dogam card image source samples
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-classic-dogam-korean-source.yml'
      - 'scripts/probe-classic-dogam-public-korean-source.py'
permissions:
  contents: write
concurrency:
  group: dogam-korean-classic-limited-metadata-research
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet beautifulsoup4==4.14.2
      - name: Inspect robots, one list page, and one Classic public set metadata page
        run: python scripts/probe-classic-dogam-public-korean-source.py
      - name: Commit only metadata, never external image contents
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-classic-dogam-public-source-check-20261013.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record bounded Korean Classic dogam.app public image-source test without copying assets"
          git pull --rebase origin main
          git push origin HEAD:main
