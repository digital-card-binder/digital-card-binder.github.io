name: Finalize people Pokemon dex rework

on:
  push:
    branches:
      - feature/trainer-pokemon-dex
    paths:
      - .github/workflows/rework-people-pokemon-dex-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trainer-pokemon-dex
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply reviewed Pokemon-group rework
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/rework-people-pokemon-dex-v2.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          script = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), '<people-pokemon-rework>', 'exec'))

          test_path = Path('tests/collector-ui-contract.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          text = text.replace('owner-sheets-sync[.]js[?]v=20260828-1', 'owner-sheets-sync[.]js[?]v=20260902-2')
          text = text.replace('owner-sheets-sync[.]js\\?v=20260828-1', 'owner-sheets-sync[.]js\\?v=20260902-2')
          test_path.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm test
      - name: Commit feature changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trainer-pokemon.json trainer-pokemon.html trainer-pokemon.js collector-collection-registry.js collector-nav.js owner-sheets-sync.js tests/trainer-pokemon-data.test.mjs tests/collector-registry.test.mjs tests/collector-ui-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "feat: group people Pokemon dex by Pokemon"
            git pull --rebase origin feature/trainer-pokemon-dex
            git push origin HEAD:feature/trainer-pokemon-dex
          fi
