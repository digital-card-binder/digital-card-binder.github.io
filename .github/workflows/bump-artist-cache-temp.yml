name: Bump artist cache temporary

on:
  push:
    branches:
      - feat/add-next-five-artists-20260826
    paths:
      - ".github/workflows/bump-artist-cache-temp.yml"

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-next-five-artists-20260826
          fetch-depth: 0
      - name: Update cache version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artists.js')
          text=p.read_text(encoding='utf-8')
          old='const DATA_URL="./data/artists.json?v=20260819-1";'
          new='const DATA_URL="./data/artists.json?v=20260826-2";'
          if old not in text:
              raise SystemExit('Expected old cache version not found')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artists.js
          git commit -m "Refresh artist data cache version"
          git push origin HEAD:feat/add-next-five-artists-20260826
