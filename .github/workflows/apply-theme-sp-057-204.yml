name: Continue S-P Korean promo 057 through 204 without resetting 55 prior cards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-sp-057-204.yml'
      - 'scripts/apply-theme-sp-057-204-korean.mjs'
permissions:
  contents: write
concurrency:
  group: sp-final-147-korean-scenes-and-2-original-holds
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply final 147 verified Korean S-P artwork classifications and preserve two proof holds
        run: node scripts/apply-theme-sp-057-204-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit and move next safe checkpoint to SA-W only after regression
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sp-series-progress-20261013.json data/audits/theme-sp-202-korean-artwork-closure-two-holds-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review S-P 202 Korean artworks, retain two holds and continue to SA-W"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          node scripts/apply-theme-sp-057-204-korean.mjs
          npm run site:prepare
          npm run site:check
          npm test
          git add data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sp-series-progress-20261013.json data/audits/theme-sp-202-korean-artwork-closure-two-holds-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review S-P Korean 202 on latest main"
          git push origin HEAD:main
