name: Inspect final Korean S6K 094 physical print
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-final-s6k094-korean-20261018.yml"
      - "scripts/inspect-s6k094-official-and-korean-print-20261018.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Compare official S6K 094 availability to actual Korean physical print footer
        run: python scripts/inspect-s6k094-official-and-korean-print-20261018.py
