name: Production Community & Backup Readiness (read-only)

on:
  schedule:
    # 09:30 Asia/Seoul: public site and anonymous published collections only
    - cron: '30 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-service-live-smoke.yml'
      - 'scripts/public-service-live-smoke.mjs'
      - 'operations.html'
      - 'operations.js'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/public-service-live-smoke.yml'
      - 'scripts/public-service-live-smoke.mjs'
      - 'operations.html'
      - 'operations.js'
      - 'tests/public-service-live-smoke.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-service-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-public-service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test monitor is read-only and backup stays manual
        run: node --test tests/public-service-live-smoke.test.mjs
      - name: Query published site and anonymous public collections only
        run: node scripts/public-service-live-smoke.mjs
      - name: Store sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-service-smoke-${{ github.run_id }}
          path: reports/public-service-smoke.json
          if-no-files-found: ignore
          retention-days: 14
