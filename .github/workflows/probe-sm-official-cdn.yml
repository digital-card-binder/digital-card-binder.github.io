name: Probe SM Official CDN
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-sm-official-cdn.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe predictable Pokemon Korea CDN URLs
        run: |
          python -m pip install --quiet requests
          python - <<'PY'
          import json,re,requests
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          data=json.loads(Path("data/series.json").read_text(encoding="utf-8"))
          H={"User-Agent":"Mozilla/5.0"}
          tasks=[]; skipped=0
          for g in data:
            if str(g.get("era") or "").upper()!="SM": continue
            cards=g.get("cards",[])
            official=[c for c in cards if str(c.get("image") or "").startswith("https://cards.image.pokemonkorea.co.kr/")]
            fallback=[c for c in cards if "static.tcgexchange.kr" in str(c.get("image") or "")]
            if not fallback: continue
            if not official:
              skipped+=len(fallback); print("NO_PATTERN",g.get("code"),len(fallback),flush=True); continue
            sample=str(official[0]["image"])
            m=re.match(r"^(https://cards\.image\.pokemonkorea\.co\.kr/.*/)([^/]+?)(\d{3})(\.[A-Za-z0-9]+)$",sample)
            if not m:
              skipped+=len(fallback); print("BAD_PATTERN",g.get("code"),sample,flush=True); continue
            base,prefix,_,ext=m.groups()
            for c in fallback:
              cm=re.search(r"_0*([0-9]+)(?:/|$)",str(c.get("code") or ""))
              if not cm: skipped+=1; continue
              num=int(cm.group(1))
              urls=[f"{base}{prefix}{num:03d}{e}" for e in dict.fromkeys([ext,".png",".jpg",".jpeg"])]
              tasks.append((g.get("code"),c.get("code"),c.get("name"),urls))
          def probe(t):
            setc,code,name,urls=t
            s=requests.Session(); s.headers.update(H)
            checked=0
            for url in urls:
              checked+=1
              try:
                r=s.get(url,timeout=6,stream=True)
                ct=(r.headers.get("content-type") or "").lower()
                ok=r.status_code==200 and ("image" in ct or int(r.headers.get("content-length") or 0)>3000)
                r.close()
                if ok: return checked,{"set":setc,"code":code,"name":name,"url":url}
              except Exception: pass
            return checked,None
          hits=[]; checked=0
          with ThreadPoolExecutor(max_workers=48) as ex:
            fs=[ex.submit(probe,t) for t in tasks]
            for f in as_completed(fs):
              n,row=f.result(); checked+=n
              if row:
                hits.append(row); print("CDN_HIT",json.dumps(row,ensure_ascii=False),flush=True)
          hits.sort(key=lambda x:(str(x["set"]),str(x["code"])))
          Path("sm-cdn-hits.json").write_text(json.dumps(hits,ensure_ascii=False,indent=2),encoding="utf-8")
          print("PROBE_SUMMARY",json.dumps({"hits":len(hits),"checked":checked,"skipped_no_pattern":skipped},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sm-cdn-hits
          path: sm-cdn-hits.json
          retention-days: 2
