name: Audit SH 59 Korean Family Pokemon Card Game images via own Cloudflare CDN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-sh-visual.yml'
      - 'scripts/audit-theme-sh-visual.py'
permissions:
  contents: write
concurrency:
  group: sh-korean-59-card-own-cdn-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Inspect 59 Korean original card images from own CDN only
        run: python scripts/audit-theme-sh-visual.py
      - name: Save each contact sheet and safe image checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/SH
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Checkpoint Korean SH 59 own-CDN image originals"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-sh-visual.py
          done
