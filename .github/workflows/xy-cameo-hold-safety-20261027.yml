      - scripts/xy-verified-cameo-hold-safety-20261027.py
      - .github/workflows/xy-cameo-hold-safety-20261027.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
