name: Align current registry baseline

on:
  push:
    branches:
      - feature/series-base-filter

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/series-base-filter
      - name: Update stale artist expectations
        run: |
          sed -i 's/artist: 2451,/artist: 2872,/' tests/collector-registry.test.mjs
          sed -i 's/artist: 29,/artist: 34,/' tests/collector-registry.test.mjs
          grep -q 'artist: 2872,' tests/collector-registry.test.mjs
          grep -q 'artist: 34,' tests/collector-registry.test.mjs
          rm .github/workflows/fix-current-registry-baseline.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update artist registry baseline"
          git push origin HEAD:feature/series-base-filter
