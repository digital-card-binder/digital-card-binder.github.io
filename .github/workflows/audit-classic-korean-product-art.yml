name: Capture official Korean Classic product print imagery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-classic-korean-product-art.yml'
      - 'scripts/audit-classic-korean-firstparty-product-art.py'
permissions:
  contents: write
concurrency:
  group: korean-classic-product-originals
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Archive official Korean product art evidence only
        run: python scripts/audit-classic-korean-firstparty-product-art.py
      - name: Commit proof without replacing any production card image
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-classic-official-product-20261013
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Archive first-party Korean Classic product artwork evidence for three decks"
          git pull --rebase origin main
          git push origin HEAD:main
