name: Triage S5a Korean rare 071-096 candidate sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-s5a-071-096-rare-sources.yml'
      - 'scripts/audit-theme-s5a-071-096-rare-sources.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s5a-korean-071-096-rare-source-triage
  cancel-in-progress: false
jobs:
  source-triage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Inventory 26 rare card images without assuming Korean source
        run: python scripts/audit-theme-s5a-071-096-rare-sources.py
      - name: Commit candidate evidence while preserving all card and collection data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s5a/071-096
            if git diff --cached --quiet; then
              echo "Evidence already current"
              exit 0
            fi
            git commit -m "audit(s5a): archive rare 071-096 candidate provenance; retain 26 Korean holds"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-s5a-071-096-rare-sources.py
          done
