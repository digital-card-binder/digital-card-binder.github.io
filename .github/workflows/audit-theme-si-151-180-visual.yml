name: Audit SI 151-180 Korean Start Deck 100 images from owned CDN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-si-151-180-visual.yml'
      - 'scripts/audit-theme-si-151-180-visual.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: si-151-180-owned-cdn-visual-evidence
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Decode 30 Korean SI images from owned Cloudflare archive only
        run: python scripts/audit-theme-si-151-180-visual.py
      - name: Store images and proof ledger with retry
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/SI/151-180
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Capture SI 151-180 Korean card own-CDN image proofs"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-si-151-180-visual.py
          done
