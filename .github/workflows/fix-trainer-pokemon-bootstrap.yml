name: Fix trainer Pokemon bootstrap

on:
  push:
    branches:
      - feature/trainer-pokemon-dex
    paths:
      - .github/workflows/fix-trainer-pokemon-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trainer-pokemon-dex
          fetch-depth: 0
      - name: Add dependency install step
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/bootstrap-trainer-pokemon.yml')
          text = path.read_text(encoding='utf-8')
          old = '      - name: Run verification suite\n        run: npm test\n'
          new = '      - name: Install dependencies\n        run: npm ci\n      - name: Run verification suite\n        run: npm test\n'
          if new not in text:
              if old not in text:
                  raise RuntimeError('verification step anchor missing')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit bootstrap fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/bootstrap-trainer-pokemon.yml
          if ! git diff --cached --quiet; then
            git commit -m "ci: install dependencies before trainer verification"
            git pull --rebase origin feature/trainer-pokemon-dex
            git push origin HEAD:feature/trainer-pokemon-dex
          fi
