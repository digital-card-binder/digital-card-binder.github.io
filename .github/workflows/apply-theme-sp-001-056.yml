name: Apply Korean S-P first 56 art checks and own CDN display
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-sp-001-056.yml'
      - 'scripts/apply-theme-sp-001-056-korean.mjs'
      - 'tests/collector-registry.test.mjs'
permissions:
  contents: write
concurrency:
  group: sp-first-56-checked-Korean-cards
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply guarded Korean S-P 55 artworks and archive 204 local-image references
        run: node scripts/apply-theme-sp-001-056-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit only if all checks pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sp-series-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review S-P first 55 Korean promos and self-host all 204 display images"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          node scripts/apply-theme-sp-001-056-korean.mjs
          npm run site:prepare
          npm run site:check
          npm test
          git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sp-series-progress-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Review S-P Korean first 55 on latest main"
          git push origin HEAD:main
