name: Emart24 first-party stock POC
on:
  pull_request:
    paths:
      - 'scripts/radar-emart24-direct-probe.mjs'
      - '.github/workflows/radar-emart24-direct-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/radar-emart24-direct-probe.mjs
