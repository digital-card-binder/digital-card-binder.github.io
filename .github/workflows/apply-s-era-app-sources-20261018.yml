name: Apply Korean S-era app card images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-s-era-app-sources-20261018.yml'
      - 'scripts/apply-s-era-app-sources-20261018.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: app-s-era-restore-20261018
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Restore S-era Korean card image fields from app pages
        run: python scripts/apply-s-era-app-sources-20261018.py
      - name: Commit approved Korean-app image replacements
        run: |
          set -euo pipefail
          git add data/series.json data/audits/s-era-69-app-source-image-recovery-20261018.json
          if git diff --cached --quiet; then
            echo "No newly source-confirmed S-era card photo."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "fix(images): restore Korean S-era images from card-specific app sources"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
