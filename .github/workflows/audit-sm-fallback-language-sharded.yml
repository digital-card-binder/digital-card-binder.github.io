name: Audit SM Fallback Language Sharded
on:
  push:
    branches: [main]
    paths: [".github/workflows/audit-sm-fallback-language-sharded.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-kor tesseract-ocr-jpn
          python -m pip install --quiet pillow pytesseract requests
      - name: Classify SM fallback images
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "8"
        run: |
          python - <<'PY'
          import io,json,os,re,requests,pytesseract
          from pathlib import Path
          from PIL import Image,ImageOps,ImageEnhance
          from concurrent.futures import ThreadPoolExecutor,as_completed
          from collections import Counter
          data=json.loads(Path("data/series.json").read_text(encoding="utf-8"))
          allrows=[]
          for g in data:
            if str(g.get("era") or "").upper()!="SM": continue
            for c in g.get("cards",[]):
              if "static.tcgexchange.kr" in str(c.get("image") or ""):
                allrows.append({"set":g.get("code"),"code":c.get("code"),"name":c.get("name"),"image":c.get("image")})
          shard=int(os.environ["SHARD"]); shards=int(os.environ["SHARDS"])
          rows=[r for i,r in enumerate(allrows) if i%shards==shard]
          print("FALLBACK_SHARD",shard,len(rows),flush=True)
          H={"User-Agent":"Mozilla/5.0"}
          def work(row):
            try:
              r=requests.get(row["image"],headers=H,timeout=20); r.raise_for_status()
              img=Image.open(io.BytesIO(r.content)).convert("RGB")
              gray=ImageOps.grayscale(img)
              gray=ImageEnhance.Contrast(gray).enhance(1.5)
              if gray.width<600:
                sc=max(2,600//max(1,gray.width)); gray=gray.resize((gray.width*sc,gray.height*sc))
              txt=pytesseract.image_to_string(gray,lang="kor+jpn+eng",config="--psm 11")
              ko=len(re.findall(r"[가-힣]",txt)); jp=len(re.findall(r"[ぁ-ゖァ-ヺ]",txt))
              if ko>=2 and ko>=jp: cls="KR"
              elif jp>=2 and jp>ko: cls="JP"
              elif ko>0 and jp==0: cls="KR?"
              elif jp>0 and ko==0: cls="JP?"
              else: cls="UNKNOWN"
              return {**row,"class":cls,"ko":ko,"jp":jp,"ocr":re.sub(r"\s+"," ",txt)[:180]}
            except Exception as e:
              return {**row,"class":"FAIL","ko":0,"jp":0,"error":str(e)}
          out=[]
          with ThreadPoolExecutor(max_workers=8) as ex:
            fs=[ex.submit(work,r) for r in rows]
            for n,f in enumerate(as_completed(fs),1):
              out.append(f.result())
              if n%20==0: print("OCR_PROGRESS",shard,n,flush=True)
          counts=Counter(r["class"] for r in out)
          print("LANG_SUMMARY_SHARD",shard,json.dumps(dict(counts),ensure_ascii=False),flush=True)
          for r in sorted(out,key=lambda x:(str(x["set"]),str(x["code"]))):
            if r["class"] in {"JP","JP?","UNKNOWN","FAIL"}:
              print("LANG_CANDIDATE",json.dumps(r,ensure_ascii=False),flush=True)
          PY
