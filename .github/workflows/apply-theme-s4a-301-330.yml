name: Apply eleventh 30 visually reviewed Korean S4a artwork themes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-s4a-301-330.yml'
      - 'scripts/apply-theme-s4a-301-330-korean.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s4a-korean-artwork-301-330-apply
  cancel-in-progress: false
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply only independently reviewed Korean artworks with card ownership key guards
        run: node scripts/apply-theme-s4a-301-330-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit approved S4a theme/status/coverage only after all checks pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/art-themes.json data/audits/theme-series-review-status.json
            git add data/audits/theme-s4a-301-330-progress-20261016.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s4a): add 30 Korean shiny artwork theme memberships 301-330 and preserve original IDs"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-theme-s4a-301-330-korean.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
