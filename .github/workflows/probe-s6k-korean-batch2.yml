name: Archive Korean S6K rare full card photo candidates 084 085 087 089
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-s6k-korean-batch2.yml'
      - 'scripts/probe-s6k-korean-batch2.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-korean-batch2-candidate-preflight
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Download high resolution Korean card photos for identity inspection only
        run: python scripts/probe-s6k-korean-batch2.py
      - name: Commit proof files without changing the live catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s6K/korean-candidates/batch2
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): archive additional Korean photo candidates without automatic approval"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/probe-s6k-korean-batch2.py
          done
