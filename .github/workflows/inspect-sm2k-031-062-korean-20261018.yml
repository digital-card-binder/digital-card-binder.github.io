name: Inspect remaining 32 Korean SM2K card illustrations
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-sm2k-031-062-korean-20261018.yml"
      - "scripts/inspect-sm2k-031-062-korean-20261018.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow beautifulsoup4
      - name: Verify 32 remaining Korean cards and identify prior thematic memberships
        run: python scripts/inspect-sm2k-031-062-korean-20261018.py
