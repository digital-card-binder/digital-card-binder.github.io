name: Patch sheets header consistency

on:
  push:
    branches:
      - fix/unify-sheets-header
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unify-sheets-header
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch category pages
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after(path, anchor, addition):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if addition.strip() in text:
                  return
              if anchor not in text:
                  raise RuntimeError(f'{path}: anchor not found: {anchor}')
              p.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8')

          insert_after(
              'people.html',
              '    <script src="./firebase-people-manager.js?v=20260813-1" defer></script>\n',
              '    <script src="./owner-sheets-sync.js?v=20260902-1" defer></script>\n',
          )
          insert_after(
              'world.html',
              '    <script src="./collector-nav.js?v=20260901-1" defer></script>\n',
              '    <script src="./owner-header-fallback.js?v=20260902-1" defer></script>\n    <script src="./owner-sheets-sync.js?v=20260902-1" defer></script>\n',
          )
          insert_after(
              'custom.html',
              '    <link rel="stylesheet" href="./catalog.css?v=20260813-2">\n',
              '    <link rel="stylesheet" href="./collection-manager.css?v=20260813-2">\n',
          )
          insert_after(
              'custom.html',
              '    <script src="./collector-nav.js?v=20260826-1" defer></script>\n',
              '    <script src="./owner-header-fallback.js?v=20260902-1" defer></script>\n    <script src="./owner-sheets-sync.js?v=20260902-1" defer></script>\n',
          )

          pages = [
              'national.html', 'packs.html', 'artists.html', 'series.html',
              'pokemon-collections.html', 'ar.html', 'people.html', 'world.html', 'custom.html',
          ]
          for page in pages:
              text = Path(page).read_text(encoding='utf-8')
              if 'owner-sheets-sync.js' not in text:
                  raise RuntimeError(f'{page}: owner-sheets-sync.js missing')
          for page in ('world.html', 'custom.html'):
              text = Path(page).read_text(encoding='utf-8')
              if 'owner-header-fallback.js' not in text:
                  raise RuntimeError(f'{page}: owner header fallback missing')
          print('Sheets header consistency OK for 9 collection pages')
          PY
      - name: Commit patched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add people.html world.html custom.html
          if ! git diff --cached --quiet; then
            git commit -m "fix: show Sheets controls on all collection pages"
            git push
          fi
