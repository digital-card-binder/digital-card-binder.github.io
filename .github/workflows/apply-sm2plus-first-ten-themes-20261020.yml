name: Apply SM2+ Korean 001-010 theme review safely
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sm2plus-first-ten-themes-20261020.yml'
      - 'scripts/apply-theme-sm2plus-001-010-korean-20261020.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-sm2plus-first-ten-themes
  cancel-in-progress: false
jobs:
  theme-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Apply ten explicitly reviewed Korean artworks only
        run: node scripts/apply-theme-sm2plus-001-010-korean-20261020.mjs
      - name: Synchronize all derived site data and assert complete regression
        run: |
          npm run site:prepare
          npm test
      - name: Save validated theme changes in one commit
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          if printf '%s\n' "$changed" | grep -E '^(radar-server/|api/radar/|data/radar-master/|data/card-radar-|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Refusing to write any Card Radar file in theme-only batch'
            exit 1
          fi
          echo "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): save SM2+ 001-010 Korean visuals and 16 independent theme rows'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
