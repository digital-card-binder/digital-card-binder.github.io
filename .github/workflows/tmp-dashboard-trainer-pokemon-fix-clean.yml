name: Temporary dashboard trainer Pokemon fix clean

on:
  push:
    branches:
      - fix/dashboard-trainer-pokemon-load
    paths:
      - .github/workflows/tmp-dashboard-trainer-pokemon-fix-clean.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-trainer-pokemon-load
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch dashboard catalog loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('dashboard.js')
          text=path.read_text(encoding='utf-8')
          text=text.replace('''    packData,\n    peopleData,\n  ) {''','''    packData,\n    peopleData,\n    trainerPokemonData,\n  ) {''',1)
          marker='''    const peopleGroups = [...new Set(\n      (peopleData.people || []).map((person) => person.generation),\n    )].map((generation) => ({\n      key: `generation-${generation}`,\n      name: `${generation}세대 인물도감`,\n      itemKeys: peopleItems\n        .filter((item) => item.group === `${generation}세대`)\n        .map((item) => item.key),\n    }));\n\n    return {'''
          insert='''    const peopleGroups = [...new Set(\n      (peopleData.people || []).map((person) => person.generation),\n    )].map((generation) => ({\n      key: `generation-${generation}`,\n      name: `${generation}세대 인물도감`,\n      itemKeys: peopleItems\n        .filter((item) => item.group === `${generation}세대`)\n        .map((item) => item.key),\n    }));\n\n    const trainerPokemonItems = [];\n    const trainerPokemonGroups = (trainerPokemonData.groups || []).map((group, groupIndex) => {\n      const itemKeys = (group.cards || []).map((card, cardIndex) => {\n        const key = pageCardIdentity("trainerPokemon", group, card, groupIndex, cardIndex);\n        trainerPokemonItems.push({\n          key,\n          name: card.name || card.pokemonName || group.name || "이름 미상 카드",\n          group: group.name,\n          baselineOwned: Boolean(card.owned),\n        });\n        return key;\n      });\n      return {\n        key: groupIdentity(group, groupIndex),\n        name: group.name,\n        itemKeys,\n      };\n    });\n\n    return {'''
          if marker not in text: raise RuntimeError('peopleGroups marker missing')
          text=text.replace(marker,insert,1)
          text=text.replace('''      people: createCategory("people", peopleItems, peopleGroups),\n      custom: createCategory("custom", [], []),''','''      people: createCategory("people", peopleItems, peopleGroups),\n      trainerPokemon: createCategory(\n        "trainerPokemon",\n        trainerPokemonItems,\n        trainerPokemonGroups,\n      ),\n      custom: createCategory("custom", [], []),''',1)
          old='''    const [pokedex, artists, series, pokemon, ar, packs, people] = await Promise.all([\n      fetchJson("./data/pokedex.json"),\n      fetchJson("./data/artists.json"),\n      fetchJson("./data/series.json"),\n      fetchJson("./data/pokemon-collections.json"),\n      fetchJson("./data/ar.json"),\n      fetchPacks(),\n      fetchJson("./data/people.json"),\n    ]);\n    return buildCatalogs(pokedex, artists, series, pokemon, ar, packs, people);'''
          new='''    const [pokedex, artists, series, pokemon, ar, packs, people, trainerPokemon] = await Promise.all([\n      fetchJson("./data/pokedex.json"),\n      fetchJson("./data/artists.json"),\n      fetchJson("./data/series.json"),\n      fetchJson("./data/pokemon-collections.json"),\n      fetchJson("./data/ar.json"),\n      fetchPacks(),\n      fetchJson("./data/people.json"),\n      fetchJson("./data/trainer-pokemon.json"),\n    ]);\n    return buildCatalogs(\n      pokedex, artists, series, pokemon, ar, packs, people, trainerPokemon,\n    );'''
          if old not in text: raise RuntimeError('loadCatalogs marker missing')
          text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')

          test=Path('tests/collector-ui-contract.test.mjs')
          t=test.read_text(encoding='utf-8')
          anchor='''test("dashboard includes custom dex in cards, totals, activity, and settings order", async () => {'''
          newtest='''test("dashboard loads the trainer and Pokemon catalog registered in collection order", async () => {\n  const dashboard = await source("dashboard.js");\n  assert.match(dashboard, /fetchJson\\(\"[.]\\/data\\/trainer-pokemon[.]json\"\\)/);\n  assert.match(dashboard, /trainerPokemon:\\s*createCategory\\(/);\n  assert.match(dashboard, /pageCardIdentity\\(\"trainerPokemon\"/);\n});\n\n'''
          if newtest not in t:
            if anchor not in t: raise RuntimeError('test anchor missing')
            t=t.replace(anchor,newtest+anchor,1)
          test.write_text(t,encoding='utf-8')

          idx=Path('index.html')
          ix=idx.read_text(encoding='utf-8')
          ix=ix.replace('dashboard.js?v=20260814-1','dashboard.js?v=20260902-1')
          idx.write_text(ix,encoding='utf-8')
          PY
      - name: Run full tests
        run: |
          npm ci
          npm test
      - name: Commit clean fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-dashboard-trainer-pokemon-fix-clean.yml
          git add dashboard.js index.html tests/collector-ui-contract.test.mjs
          git commit -m "fix: load trainer Pokemon catalog on dashboard"
          git pull --rebase origin fix/dashboard-trainer-pokemon-load
          git push origin HEAD:fix/dashboard-trainer-pokemon-load
