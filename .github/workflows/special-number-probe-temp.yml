name: Temporary special-number probe

on:
  push:
    branches:
      - audit-official-inventory-20260926
    paths:
      - ".github/workflows/special-number-probe-temp.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Inspect M6a and promo number formats
        run: |
          node --input-type=module <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const clean=v=>String(v??"").replace(/&amp;/g,"&").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
          async function get(url){const r=await fetch(url,{headers:{"User-Agent":"digital-card-binder-number-probe/1.0","Accept-Language":"ko-KR,ko;q=0.9"}});if(!r.ok)throw new Error("HTTP "+r.status);return await r.text()}
          const index=await get("https://www.dogam.app/sets");
          const anchors=[...index.matchAll(/<a[^>]+href=["'](\/sets\/[A-Za-z0-9_-]+)["'][^>]*>([\s\S]*?)<\/a>/gi)].map(m=>({href:m[1],text:clean(m[2])}));
          const targets=[["M6a","M6a"],["M-P","MP"],["SV-P","SVP"],["S-P","SP"]];
          const out=[];
          for(const [label,lookup] of targets){
            const a=anchors.find(x=>new RegExp("(^|\\s)"+lookup+"(?:\\s|·|$)","i").test(x.text));
            if(!a){out.push({label,lookup,missing:true});continue}
            const html=await get("https://www.dogam.app"+a.href);
            const rows=[];
            for(const m of html.matchAll(/<a[^>]+href=["'](\/sets\/[A-Za-z0-9_-]+\/cards\/([A-Za-z0-9_-]+))["'][^>]*>([\s\S]*?)<\/a>/gi)){
              const inner=m[3],text=clean(inner);
              const img=inner.match(/<img[^>]+data-full=["']([^"']+)["']/i)?.[1]||"";
              rows.push({itemId:m[2],text,image:img});
            }
            const uniq=[...new Map(rows.map(x=>[x.itemId,x])).values()];
            out.push({label,lookup,setUrl:"https://www.dogam.app"+a.href,anchorText:a.text,count:uniq.length,head:uniq.slice(0,8),tail:uniq.slice(-12)});
            await sleep(800);
          }
          console.log("SPECIAL_NUMBER_PROBE="+JSON.stringify(out));
          NODE
