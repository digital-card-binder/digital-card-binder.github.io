name: Audit Korean legacy image folders
on:
  push:
    branches: [feat/add-ranked-artists-top10-ko-20260826]
    paths:
      - scripts/audit_korean_legacy_image_folders.py
      - .github/workflows/audit-legacy-folders.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-ranked-artists-top10-ko-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/audit_korean_legacy_image_folders.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/korean-legacy-image-folders.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Audit Korean legacy image folders"
          git pull --rebase origin feat/add-ranked-artists-top10-ko-20260826
          git push origin HEAD:feat/add-ranked-artists-top10-ko-20260826
