name: Refresh derived series inventory for S4a audit PR
on:
  push:
    branches: [audit/s4a-241-270-korean-art-20261016]
    paths:
      - '.github/workflows/refresh-s4a-series-inventory.yml'
permissions:
  contents: write
jobs:
  sync-derived-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/s4a-241-270-korean-art-20261016
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run series-inventory:sync && npm run series-inventory:check
      - name: Commit only derived inventory snapshot (never original card data)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series-inventory-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: resync derived series inventory against current canonical catalog"
          git push origin HEAD:audit/s4a-241-270-korean-art-20261016
