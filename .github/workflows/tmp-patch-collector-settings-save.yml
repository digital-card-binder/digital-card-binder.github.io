name: Temporary patch collector settings save

on:
  push:
    branches:
      - fix/collector-settings-save-permission
    paths:
      - .github/workflows/tmp-patch-collector-settings-save.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decouple directory update from settings batch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('collector-settings.js')
          text=p.read_text(encoding='utf-8')
          old='''      syncDirectoryInBatch(batch, collectionId, next);\n      await batch.commit();'''
          new='''      await batch.commit();'''
          if old not in text:
              raise SystemExit('settings batch marker not found')
          text=text.replace(old,new,1)
          old2='''    settings.set(collectionId, {\n      value: registry.normalizeSetting(collectionId, snapshot.data() || next),\n      exists: true,\n      createdAt: snapshot.data()?.createdAt || current.createdAt,\n    });'''
          new2='''    settings.set(collectionId, {\n      value: registry.normalizeSetting(collectionId, snapshot.data() || next),\n      exists: true,\n      createdAt: snapshot.data()?.createdAt || current.createdAt,\n    });\n    await reconcileDirectoryEntry();'''
          if old2 not in text:
              raise SystemExit('settings cache marker not found')
          text=text.replace(old2,new2,1)
          p.write_text(text,encoding='utf-8')

          # Force the fixed settings script to bypass stale mobile browser caches.
          h=Path('collector-settings.html')
          html=h.read_text(encoding='utf-8')
          html=html.replace('collector-settings.js?v=20260813-1','collector-settings.js?v=20260903-2')
          html=html.replace('collector-settings-legacy-share-migration.js?v=20260903-1','collector-settings-legacy-share-migration.js?v=20260903-2')
          h.write_text(html,encoding='utf-8')
          PY
      - name: Add regression test
        run: |
          cat > tests/collector-settings-save-permission.test.mjs <<'EOF'
          import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          const settings = await readFile(new URL("../collector-settings.js", import.meta.url), "utf8");
          const page = await readFile(new URL("../collector-settings.html", import.meta.url), "utf8");

          test("settings batch does not depend on public directory write permission", () => {
            const batchCommit = settings.indexOf("await batch.commit();");
            const directoryCall = settings.indexOf("await reconcileDirectoryEntry();", batchCommit);
            assert.ok(batchCommit >= 0);
            assert.ok(directoryCall > batchCommit);
            const between = settings.slice(Math.max(0, batchCommit - 500), batchCommit);
            assert.doesNotMatch(between, /syncDirectoryInBatch\(batch, collectionId, next\)/);
          });

          test("collector settings assets are cache busted after permission fix", () => {
            assert.match(page, /collector-settings\.js\?v=20260903-2/);
            assert.match(page, /collector-settings-legacy-share-migration\.js\?v=20260903-2/);
          });
          EOF
          node - <<'NODE'
          const fs = require('fs');
          const p='package.json';
          const data=JSON.parse(fs.readFileSync(p,'utf8'));
          if (!data.scripts['test:ui'].includes('collector-settings-save-permission.test.mjs')) {
            data.scripts['test:ui']=data.scripts['test:ui'].replace('node --test ', 'node --test tests/collector-settings-save-permission.test.mjs ');
          }
          fs.writeFileSync(p, JSON.stringify(data,null,2)+'\n');
          NODE
      - name: Commit patch
        run: |
          git config user.name "Youngdeukseo"
          git config user.email "128191608+Youngdeukseo@users.noreply.github.com"
          git add collector-settings.js collector-settings.html package.json tests/collector-settings-save-permission.test.mjs
          git commit -m "fix: decouple collector settings from directory permission"
          git push origin HEAD:fix/collector-settings-save-permission
