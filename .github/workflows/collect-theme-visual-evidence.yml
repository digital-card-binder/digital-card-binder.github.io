name: Collect self-hosted theme visual evidence
on:
  push:
    branches: [main]
    paths:
      - 'scripts/export-theme-review-contact-sheets.py'
permissions:
  contents: write
concurrency:
  group: theme-visual-evidence-export
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install --quiet Pillow==12.3.0
      - name: Render contact sheets from existing archived images
        run: python scripts/export-theme-review-contact-sheets.py
      - name: Commit raw visual audit artifacts and HTTP report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture user-owned card image evidence for SVM–SVOM review"
          git push origin HEAD:main
