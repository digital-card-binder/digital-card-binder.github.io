name: Close verified Korean SM2K 056 theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/close-sm2k-056-korean-theme-20261018.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: close-sm2k-056-korean-theme-20261018
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply only verified 056 Korean print and twelve-theme record
        run: node scripts/close-sm2k-056-korean-theme-20261018.mjs
      - name: Prepare generated theme indices and site data
        run: npm run site:prepare
      - name: Verify regression suite before committing
        run: npm test
      - name: Commit guarded result
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/art-themes.json data/audits/theme-sm2k-031-062-Korean-art-review-20261018.json data/audits/theme-sm2k-031-062-progress-20261018.json data/audits/sm2k-056-Korean-print-12theme-closure-20261018.json data/audits/theme-series-coverage.json data/card-related-dex-index.json data/pokemon-search-index.json data/series-inventory-audit.json data/master-card-db-audit.json core/catalog/catalog-service.js collector-nav.js custom-loader.js print.js pwa.js manifest.webmanifest site-version.json ./*.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
            exit 0
          fi
          git commit -m 'audit(sm2k): close Korean 056 HR footer and 12-theme color match'
          git push origin HEAD:main
