name: Probe Rare Korean Images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/probe-rare-korean-images.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe rare Korean card image sources
        run: |
          python - <<'PY'
          import re, html, requests
          urls=[
            ("xyp186","https://tcgbox.co.kr/product/%EC%B9%A0%EC%83%89%EC%A1%B0-break/4099/"),
            ("bwp056_pokumon","https://pokumon.com/card/victory-cup-056-bw-korean-promo/"),
            ("bwp003_pokumon","https://pokumon.com/card/victory-cup-003-bw-korean-promo/"),
          ]
          headers={"User-Agent":"Mozilla/5.0"}
          for key,url in urls:
            try:
              r=requests.get(url,headers=headers,timeout=30)
              print("PAGE",key,r.status_code,len(r.text),r.url)
              text=html.unescape(r.text)
              candidates=[]
              patterns=[
                r'<meta[^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\'][^>]+content=["\']([^"\']+)',
                r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:property|name)=["\'](?:og:image|twitter:image)["\']',
                r'https?://[^"\'<> ]+\.(?:jpg|jpeg|png|webp)(?:\?[^"\'<> ]*)?',
                r'//[^"\'<> ]+\.(?:jpg|jpeg|png|webp)(?:\?[^"\'<> ]*)?',
              ]
              for pat in patterns:
                for m in re.findall(pat,text,re.I):
                  u=m if isinstance(m,str) else m[0]
                  if u.startswith("//"): u="https:"+u
                  if u not in candidates: candidates.append(u)
              for u in candidates[:120]:
                if any(t in u.lower() for t in ["product","upload","web/product","wp-content","cdn","cafe24","echosting","pokumon"]):
                  print("IMG",key,u)
            except Exception as e:
              print("ERROR",key,repr(e))
          PY
