name: Temporary fix dashboard trainer Pokemon catalog v2

on:
  push:
    branches:
      - fix/dashboard-and-swordshield-trainer-pokemon
    paths:
      - .github/workflows/tmp-fix-dashboard-trainer-pokemon-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-and-swordshield-trainer-pokemon
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply dashboard patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/tmp-fix-dashboard-trainer-pokemon.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          script = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(script), '<dashboard-patch>', 'exec'))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.js tests/collector-ui-contract.test.mjs
          git commit -m "fix: load trainer Pokemon catalog on dashboard"
          git pull --rebase origin fix/dashboard-and-swordshield-trainer-pokemon
          git push origin HEAD:fix/dashboard-and-swordshield-trainer-pokemon
