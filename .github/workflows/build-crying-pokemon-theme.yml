name: Build Korean crying Pokémon theme
on:
  push:
    branches: ['feature/crying-illudex-54-print-verification-20261108']
    paths:
      - '.github/workflows/build-crying-pokemon-theme.yml'
      - 'scripts/build-crying-theme.mjs'
      - 'scripts/audit-crying-illustrators.mjs'
      - 'data/audits/crying-theme-korean-original-print-mappings-20261108.json'
      - 'data/audits/crying-theme-illudex-original-print-mappings-20261108.json'
      - 'scripts/audit-crying-theme-candidates-20261108.mjs'
      - 'scripts/compare-crying-reference-art.py'
      - 'data/audits/crying-theme-reference-pool-20261108.json'
      - 'art-themes.js'
      - 'dashboard.js'
      - 'tests/crying-theme-korean.test.mjs'
      - 'tests/archived-historical-workflows-20261028.test.mjs'
permissions:
  contents: write
concurrency:
  group: crying-pokemon-theme-builder
  cancel-in-progress: false
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/crying-illudex-54-print-verification-20261108
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Select only verified Korean cards from existing master database
        run: node scripts/build-crying-theme.mjs
      - name: Enumerate all overseas references against Korean master without automatic acceptance
        run: node scripts/audit-crying-theme-candidates-20261108.mjs
      - name: Cross-match Illudex artists against Korean artist catalog
        run: node scripts/audit-crying-illustrators.mjs
      - name: Require retained same-artwork evidence from passed second-pass audit
        run: test -s data/audits/crying-theme-image-similarity-20261108.json
      - name: Refresh catalog and asset cache versions
        run: npm run site:prepare
      - run: node --test tests/crying-theme-korean.test.mjs
      - run: npm test
      - name: Commit generated Korean theme after all checks pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art-themes-crying.json data/audits/crying-theme-korean-matches-20261108.json data/audits/crying-theme-all-candidate-index-20261108.json data/audits/crying-theme-image-similarity-20261108.json data/audits/crying-theme-illustrator-candidate-matches-20261108.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Build verified Korean crying Pokémon theme and sync site versions"
          if git push origin HEAD:feature/crying-illudex-54-print-verification-20261108; then exit 0; fi
          # A source audit may be committed while QA runs. Rebase the generated
          # artifacts over that change, never force-push or discard work.
          git pull --rebase origin feature/crying-illudex-54-print-verification-20261108
          git push origin HEAD:feature/crying-illudex-54-print-verification-20261108
