name: Preflight S4a Shiny Star V fourth 30 Korean candidate images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-s4a-091-120-preflight.yml'
      - 'scripts/audit-theme-s4a-091-120-preflight.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s4a-091-120-visual-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Inventory S4a Shiny Star V card numbers and only fetch DCB-owned image archives
        run: python scripts/audit-theme-s4a-091-120-preflight.py
      - name: Archive evidence sheets and binary metadata without modifying ownership or theme data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s4a/091-120
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s4a): archive fourth 30 owned image candidates per set"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-s4a-091-120-preflight.py
          done
