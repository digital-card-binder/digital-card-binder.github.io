name: Audit full Korean sv3a Raging Surf card images
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-theme-sv3a-visual.py'
permissions:
  contents: write
concurrency:
  group: sv3a-evidence-main
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Decode 92 original Korean card images from DCB-owned Cloudflare archive only
        run: python scripts/audit-theme-sv3a-visual.py
      - name: Commit evidence without editing user collection or master catalog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/sv3a
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture Korean sv3a Raging Surf 92-card self-hosted image evidence"
          git pull --rebase origin main
          git push origin HEAD:main
