name: Complete Korean M-P promo 68 card theme review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-mp-final-closure.yml'
      - 'data/audits/theme-mp-final-058-068-owned-art-review.json'
      - 'scripts/apply-theme-mp-final-closure.mjs'
permissions:
  contents: write
concurrency:
  group: mp-Korean-final-review
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply guarded Korean 68-card MEGA promotion 12-theme closure
        run: node scripts/apply-theme-mp-final-closure.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit all M-P Korean visual and archive fixes after passing regression
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-mp-strict-closure-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete 68 Korean M-P promo artworks and restore owned card image refs"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          node scripts/apply-theme-mp-final-closure.mjs
          npm run site:prepare
          npm run site:check
          npm test
          git add data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-mp-strict-closure-20261013.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete 68 M-P Korean artworks on latest main"
          git push origin HEAD:main
