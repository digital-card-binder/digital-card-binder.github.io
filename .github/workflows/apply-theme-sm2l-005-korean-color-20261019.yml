name: Apply reviewed Korean SM2L 005 theme

on:
  push:
    branches:
      - 'audit/sm2l-005-korean-color-theme-20261019'
    paths:
      - '.github/workflows/apply-theme-sm2l-005-korean-color-20261019.yml'

permissions:
  contents: write

concurrency:
  group: sm2l-005-theme-safe-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Append only verified Korean SM2L 005 to color theme
        run: node scripts/apply-theme-sm2l-005-korean-color-20261019.mjs
      - name: Sync generated site indices
        run: npm run site:prepare
      - name: Verify entire regression suite
        run: npm test
      - name: Commit derived catalog and checkpoint on isolated PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art-themes.json data/audits/theme-sm2l-005-korean-color-20261019.json tests/theme-card-identity.test.mjs
          git add -u
          if git diff --cached --quiet; then
            echo "Nothing to apply"
            exit 0
          fi
          git commit -m "audit(sm2l): add verified Korean Chandelure 005 color theme"
          git push origin HEAD:refs/heads/audit/sm2l-005-korean-color-theme-20261019
