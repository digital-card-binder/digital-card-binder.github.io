name: One-shot finalize 19 Korean SM series data audit without network installs
on:
  push:
    branches:
      - audit/theme-sm-remaining19-20261022
    paths:
      - .github/workflows/one-shot-sm-remaining19-finalize-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-sm-remaining19-apply-20261022
  cancel-in-progress: true
jobs:
  finalize-audit:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build 19-set holds and safely append independently themed colors
        run: |
          set -euo pipefail
          python -m py_compile scripts/prepare-sm-remaining19-decisions-20261022.py
          node --check scripts/apply-sm-remaining19-themes-20261022.mjs
          python scripts/prepare-sm-remaining19-decisions-20261022.py
          node scripts/apply-sm-remaining19-themes-20261022.mjs
      - name: Rebuild coverage and run dependency-free card ID regression suite
        run: |
          set -euo pipefail
          node scripts/audit-theme-series-coverage.mjs
          node scripts/audit-theme-series-coverage.mjs --check
          node --test tests/theme-card-identity.test.mjs tests/sm-series-dex.test.mjs tests/structure-consistency.test.mjs
      - name: Commit only the data-audited batch; no deployment
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/theme-sm-remaining19-20261022"
          git add -u
          git add data/audits/theme-sm-remaining19-visual-decisions-20261022.json data/audits/theme-sm-remaining19-artwork-review-20261022.json
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(radar-service/|radar-server/|api/radar/|data/radar-master/|data/card-radar-|data/series.json|data/series-legacy.json|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Protected master/card-radar file changed'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): classify source-verified colors in all 19 pending Korean SM sets'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
