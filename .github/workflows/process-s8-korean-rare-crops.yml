name: Process Korean s8 rare-card crop evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/process-s8-korean-rare-crops.yml'
      - 'scripts/process-s8-korean-rare-crops.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - run: python scripts/process-s8-korean-rare-crops.py
      - name: Archive reviewed crops without yet changing catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/cards/s8-korean-rare data/audits/theme-visual-evidence/s8/korean-rescued-sources
          if ! git diff --cached --quiet; then
            git commit -m "audit(s8): add resized Korean rare card crop evidence"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
