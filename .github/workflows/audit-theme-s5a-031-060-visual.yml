name: Preflight S5a Korean 031-060 owned card images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-s5a-031-060-visual.yml'
      - 'scripts/audit-theme-s5a-031-060-visual.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s5a-korean-031-060-preflight
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Check next thirty S5a canonical card numbers and DCB-hosted images
        run: python scripts/audit-theme-s5a-031-060-visual.py
      - name: Save visual evidence, without applying unreviewed artwork classifications
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s5a/031-060
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s5a): archive next 30 canonical numbers and owned image preflight"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-s5a-031-060-visual.py
          done
