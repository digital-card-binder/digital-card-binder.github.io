name: Stage verified Korean S6K 086 photo crop
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crop-s6k-086-korean.yml'
      - 'scripts/crop-s6k-086-korean.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-korean-086-crop
  cancel-in-progress: false
jobs:
  crop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Preserve card footer and crop real Korean S6K 086 physical print
        run: python scripts/crop-s6k-086-korean.py
      - name: Stage verified photo without altering user card database
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add assets/cards/s6k-korean-rare/086-korean.webp
            git add data/audits/theme-visual-evidence/s6K/korean-candidates/approved-crops.json
            git add data/audits/theme-visual-evidence/s6K/korean-candidates/086-crop-contact.webp.b64
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): stage documented Korean 086 physical card crop"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/crop-s6k-086-korean.py
          done
