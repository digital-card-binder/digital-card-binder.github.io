name: Probe Korean Fusion Arts official 111-129 print images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-s8-official-rare-images.yml'
      - 'scripts/probe-s8-official-rare-images.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s8-official-rare-image-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - run: python scripts/probe-s8-official-rare-images.py
      - name: Save only verified official sources and probe evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/cards/s8-korean-official data/audits/theme-visual-evidence/s8/official-111-129-probe
          if ! git diff --cached --quiet; then
            git commit -m "audit(s8): save official Korean rare-card image candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
