name: Apply verified Korean SV4a cards 121 to 180
on:
  push:
    branches: [main]
    paths:
      - 'data/audits/theme-sv4a-121-180-art-review.json'
permissions:
  contents: write
concurrency:
  group: theme-sv4a-guarded-applier
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply guarded Korean prints and preserve all earlier ownership
        run: node scripts/apply-theme-sv4a-121-180-review.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit verified data and site outputs only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-sv4a-set-progress-20261013.json data/audits/theme-image-selfhost-audit.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply SV4a Korean cards 121-180 with preserved prior 60 and verified CDN"
          git pull --rebase origin main
          git push origin HEAD:main
