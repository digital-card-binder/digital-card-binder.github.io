name: Preflight M6a 157 Korean image recovery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-m6a-157-korean-image-recovery.py'
      - '.github/workflows/audit-m6a-157-korean-recovery.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m6a-157-region-evidence
  cancel-in-progress: false
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - run: python scripts/audit-m6a-157-korean-image-recovery.py
      - name: Archive unapproved original-vs-secondary image comparison
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/audits/mega-visual-evidence/m6a-157
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(m6a): hold 157 pending Korean print identity review"
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-m6a-157-korean-image-recovery.py
          done
