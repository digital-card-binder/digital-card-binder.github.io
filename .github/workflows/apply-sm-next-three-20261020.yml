name: Apply next three Korean SM series artwork reviews
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sm-next-three-20261020.yml'
      - 'scripts/apply-sm-next-three-art-themes-20261020.mjs'
      - 'scripts/build-sm-next-three-art-palette-20261020.py'
      - 'data/audits/theme-sm5plus-sm6-sm6a-visual-scene-decisions-20261020.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-next-three-Korean-SM-themes-20261020
  cancel-in-progress: false
jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Korean picture check dependencies
        run: python -m pip install requests pillow
      - name: Install site dependencies
        run: npm ci
      - name: Reverify original source image hashes and objective pixels
        run: |
          python -m py_compile scripts/build-sm-next-three-art-palette-20261020.py
          python scripts/build-sm-next-three-art-palette-20261020.py
      - name: Apply only screened standalone thematic memberships and hold uncertain prints
        run: node scripts/apply-sm-next-three-art-themes-20261020.mjs
      - name: Rebuild full site and verify regressions before writing to main
        run: |
          npm run site:prepare
          npm test
      - name: Commit successful independent Korean three-series review atomically
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          if printf '%s\n' "$changed" | grep -E '^(radar-server/|api/radar/|data/radar-master/|data/card-radar-|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Must not change Card Radar from a theme audit'
            exit 1
          fi
          echo "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "audit(theme): save SM5+/SM6/SM6a 18-sheet source-screened review (run $GITHUB_RUN_ID)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
