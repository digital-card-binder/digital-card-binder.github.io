name: One-shot apply visually screened SM8b SM9 SM9a card themes
on:
  push:
    branches:
      - audit/theme-sm8b-sm9-sm9a-20261022
    paths:
      - .github/workflows/one-shot-apply-sm8b-sm9-sm9a-20261022.yml
permissions:
  contents: write
concurrency:
  group: one-shot-apply-sm8b-sm9-sm9a-20261022
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'digital-card-binder/digital-card-binder.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install evidence and test dependencies
        run: |
          python -m pip install requests pillow
          npm ci
      - name: Recheck 415 real source images by SHA256 and original artwork pixel palette
        run: |
          set -euo pipefail
          python -m py_compile scripts/build-sm8b-sm9-sm9a-palette-20261022.py
          node --check scripts/apply-sm8b-sm9-sm9a-art-themes-20261022.mjs
          python scripts/build-sm8b-sm9-sm9a-palette-20261022.py
      - name: Preserve previous 20,021 rows, register screened standalone themes, hold 23
        run: node scripts/apply-sm8b-sm9-sm9a-art-themes-20261022.mjs
      - name: Build derived data and run every regression test
        run: |
          npm run site:prepare
          npm test
      - name: Commit one tested batch only to audit branch, no deployment
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "audit/theme-sm8b-sm9-sm9a-20261022"
          git add -u
          git add data/audits/theme-sm8b-sm9-sm9a-color-palette-20261022.json
          git add data/audits/theme-sm8b-sm9-sm9a-artwork-review-20261022.json
          if git diff --cached --quiet; then echo 'No updates'; exit 0; fi
          changed="$(git diff --cached --name-only)"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -E '^(radar-service/|radar-server/|api/radar/|data/radar-master/|data/card-radar-|data/series.json|data/series-legacy.json|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Protected master or Radar unexpectedly changed'; exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): append 549 independent art memberships, 415 screened Korean sources, 23 print holds'
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
