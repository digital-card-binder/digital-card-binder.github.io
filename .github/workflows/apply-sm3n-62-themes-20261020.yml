name: Apply Korean SM3N 62 artworks and hold two bad sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sm3n-62-themes-20261020.yml'
      - 'scripts/apply-theme-sm3n-001-064-korean-20261020.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-sm3n-62-korean-artworks
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Add only decoded Korean images actually screened
        run: node scripts/apply-theme-sm3n-001-064-korean-20261020.mjs
      - name: Rebuild derived card data and verify entire application
        run: |
          npm run site:prepare
          npm test
      - name: Store reviewed theme batch only
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          if printf '%s\n' "$changed" | grep -E '^(radar-server/|api/radar/|data/radar-master/|data/card-radar-|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Refusing to change Card Radar files during theme audit'
            exit 1
          fi
          echo "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): save SM3N 62 Korean artwork classifications, hold 058 and 062'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
