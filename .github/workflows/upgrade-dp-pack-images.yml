name: Upgrade DP pack images
on:
  push:
    paths:
      - "scripts/apply_dp_pack_quality_upgrade.py"
      - ".github/workflows/upgrade-dp-pack-images.yml"
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/apply_dp_pack_quality_upgrade.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packs/legacy
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Upgrade BS4 and BS7 pack images"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "push retry $i"
            sleep $((i * 5))
          done
          exit 1
