name: Probe Pokemon Korea cards

on:
  push:
    branches:
      - agent/rebuild-artist-dex-official-20260819
    paths:
      - ".github/workflows/probe-pokemonkorea.yml"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe card search page
        run: |
          python - <<'PY'
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          base = 'https://pokemoncard.co.kr'
          headers = {'User-Agent':'Mozilla/5.0 (GitHub Actions artist-dex probe)','Accept-Language':'ko-KR,ko;q=0.9,en;q=0.8'}
          def get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.geturl(), r.read().decode('utf-8','replace')

          out=[]
          url, html = get(base+'/cards')
          out.append(f'URL {url}')
          out.append(f'HTML_BYTES {len(html.encode("utf-8"))}')
          out.append('FORMS')
          for m in re.finditer(r'<form\b[\s\S]*?</form>', html, re.I):
              form=m.group(0)
              action=re.search(r'action=["\']([^"\']*)', form, re.I)
              method=re.search(r'method=["\']([^"\']*)', form, re.I)
              names=re.findall(r'name=["\']([^"\']+)', form, re.I)
              out.append(f' action={action.group(1) if action else ""} method={method.group(1) if method else ""} names={names}')
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I):
              scripts.append(urllib.parse.urljoin(base, src))
          out.append('SCRIPTS')
          out.extend(scripts)
          out.append('INLINE_INTERESTING')
          for line in html.splitlines():
              low=line.lower()
              if any(k in low for k in ('ajax','axios','fetch(','/cards','loadmore','load-more','search')):
                  clean=re.sub(r'\s+',' ',line).strip()
                  if len(clean) < 1000:
                      out.append(clean)
          for jsurl in scripts:
              if not jsurl.startswith(base):
                  continue
              try:
                  _, js = get(jsurl)
              except Exception as e:
                  out.append(f'JSERR {jsurl} {e!r}')
                  continue
              hits=[]
              for line in js.splitlines():
                  low=line.lower()
                  if any(k in low for k in ('ajax','axios','fetch(','/cards','loadmore','load-more','cardlist','card-list')):
                      clean=re.sub(r'\s+',' ',line).strip()
                      if clean and len(clean) < 1500:
                          hits.append(clean)
              if hits:
                  out.append(f'JS {jsurl}')
                  out.extend(hits[:120])
          for key in ('OKACHEKE','Narumi Sato'):
              for param in ('s','keyword','q','search','searchWord','word'):
                  qurl=base+'/cards?'+urllib.parse.urlencode({param:key})
                  try:
                      final, body=get(qurl)
                      details=sorted(set(re.findall(r'/cards/detail/[A-Za-z0-9_-]+', body)))
                      out.append(f'QUERY {param}={key!r} final={final} detail_count={len(details)} sample={details[:5]}')
                  except Exception as e:
                      out.append(f'QUERYERR {param}={key!r} {e!r}')
          Path('tmp/pokemonkorea-probe.txt').parent.mkdir(exist_ok=True)
          Path('tmp/pokemonkorea-probe.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - name: Save probe result to branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/pokemonkorea-probe.txt
          git commit -m "Record Pokemon Korea search probe" || exit 0
          git push
