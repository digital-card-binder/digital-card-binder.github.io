name: Integrate M5 M6 AR Catalog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-ar-m5-m6.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch AR catalog page
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('ar.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace('const EXPECTED_GROUPS = 32;', 'const EXPECTED_GROUPS = 34;')
          text = text.replace('const EXPECTED_TOTAL = 498;', 'const EXPECTED_TOTAL = 522;')
          text = text.replace(
              'card.setCode.toLowerCase() === "m5"',
              '["m5", "m6"].includes(card.setCode.toLowerCase())',
          )
          js.write_text(text, encoding='utf-8')

          html = Path('ar.html')
          text = html.read_text(encoding='utf-8')
          marker = '    <script src="./ar-card-editor.js?v=20260813-1" defer></script>\n'
          insert = '    <script src="./ar-mega-supplement.js?v=20260825-1" defer></script>\n'
          if insert not in text:
              if marker not in text:
                  raise SystemExit('AR script marker not found')
              text = text.replace(marker, insert + marker)
          text = text.replace('AR 카드 498장', 'AR 카드 522장')
          text = text.replace('SV · M · 498 CARDS', 'SV · M · 522 CARDS')
          text = text.replace('<span>32세트</span>', '<span>34세트</span>')
          text = text.replace('<span>498장</span>', '<span>522장</span>')
          text = text.replace('>498</', '>522</')
          text = text.replace('>32</', '>34</')
          text = text.replace('· 498장', '· 522장')
          html.write_text(text, encoding='utf-8')
          PY

      - name: Validate AR integration
        run: |
          node --check ar.js
          node --check ar-mega-supplement.js
          python - <<'PY'
          from pathlib import Path
          js = Path('ar.js').read_text(encoding='utf-8')
          html = Path('ar.html').read_text(encoding='utf-8')
          supplement = Path('ar-mega-supplement.js').read_text(encoding='utf-8')
          assert 'const EXPECTED_GROUPS = 34;' in js
          assert 'const EXPECTED_TOTAL = 522;' in js
          assert 'ar-mega-supplement.js?v=20260825-1' in html
          assert '522장' in html
          assert '34세트' in html
          assert 'code: "m5"' in supplement
          assert 'code: "m6"' in supplement
          assert supplement.count('denominator: "081"') == 1
          assert supplement.count('denominator: "076"') == 1
          print('AR M5/M6 integration validation passed')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/fix-ar-m5-m6.yml

      - name: Commit AR catalog update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ar.html ar.js ar-mega-supplement.js .github/workflows/fix-ar-m5-m6.yml
          git commit -m 'Add M5 and M6 cards to AR catalog'
          git push origin main
