name: SM Fallback Contact Sheets
on:
  push:
    branches: [main]
    paths: [".github/workflows/sm-fallback-contact-sheets.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --quiet pillow requests
      - name: Build sheets
        run: |
          python - <<'PY'
          import io,json,os,requests
          from pathlib import Path
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          from concurrent.futures import ThreadPoolExecutor,as_completed
          data=json.loads(Path("data/series.json").read_text(encoding="utf-8"))
          rows=[]
          for g in data:
            if str(g.get("era") or "").upper()!="SM": continue
            for c in g.get("cards",[]):
              if "static.tcgexchange.kr" in str(c.get("image") or ""):
                rows.append({"set":g.get("code"),"code":c.get("code"),"name":c.get("name"),"image":c.get("image")})
          H={"User-Agent":"Mozilla/5.0"}
          def get(row):
            try:
              r=requests.get(row["image"],headers=H,timeout=20); r.raise_for_status()
              return row,Image.open(io.BytesIO(r.content)).convert("RGB")
            except Exception as e:
              return {**row,"error":str(e)},None
          got=[]
          with ThreadPoolExecutor(max_workers=32) as ex:
            fs=[ex.submit(get,r) for r in rows]
            for f in as_completed(fs): got.append(f.result())
          pos={(r["set"],r["code"]):img for r,img in got}
          os.makedirs("sm-fallback-sheets",exist_ok=True)
          Path("sm-fallback-sheets/mapping.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding="utf-8")
          W,Hh,L=220,308,50
          cols,rowsn=5,5
          per=cols*rowsn
          font=ImageFont.load_default()
          for start in range(0,len(rows),per):
            chunk=rows[start:start+per]
            sheet=Image.new("RGB",(cols*W,rowsn*(Hh+L)),"white")
            dr=ImageDraw.Draw(sheet)
            for i,row in enumerate(chunk):
              x=(i%cols)*W; y=(i//cols)*(Hh+L)
              img=pos.get((row["set"],row["code"]))
              if img:
                fit=ImageOps.contain(img,(W-8,Hh-8))
                sheet.paste(fit,(x+(W-fit.width)//2,y+4))
              label=f"{start+i+1:03d} {row['set']} {row['code']}"
              dr.text((x+3,y+Hh+2),label[:31],fill="black",font=font)
              dr.text((x+3,y+Hh+18),str(row["name"])[:22],fill="black",font=font)
            sheet.save(f"sm-fallback-sheets/sheet_{start//per+1:02d}.jpg",quality=91)
          print("SHEETS",len(rows),(len(rows)+per-1)//per)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sm-fallback-contact-sheets
          path: sm-fallback-sheets
          retention-days: 2
