name: Align current artist summary

on:
  push:
    branches:
      - feature/series-base-filter

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/series-base-filter
      - name: Update artist public summary count
        run: |
          sed -i '0,/catalogCount: 2451,/s//catalogCount: 2872,/' collector-collection-registry.js
          grep -A8 'artist: {' collector-collection-registry.js | grep -q 'catalogCount: 2872,'
          rm .github/workflows/fix-current-artist-summary.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update artist public summary count"
          git push origin HEAD:feature/series-base-filter
