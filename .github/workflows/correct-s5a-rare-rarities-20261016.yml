name: Correct six S5a Korean rare rarity labels after photo verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/correct-s5a-rare-rarities-20261016.yml'
      - 'scripts/correct-s5a-rare-rarities-20261016.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s5a-korean-rare-rarity-corrections
  cancel-in-progress: false
jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply six Korean photo-verified metadata fixes with identity guards
        run: node scripts/correct-s5a-rare-rarities-20261016.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit only verified rarity metadata when all regression tests pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/series.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "fix(s5a): correct six Korean rare-card rarities without touching ownership IDs"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/correct-s5a-rare-rarities-20261016.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
