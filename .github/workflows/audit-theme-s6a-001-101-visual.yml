name: Audit Korean s6a Eevee Heroes 001-101 images and print identities
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-s6a-001-101-visual.yml'
      - 'scripts/audit-theme-s6a-001-101-visual.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6a-001-101-owned-korean-image-preflight
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Check canonical numbers and read owned images for all 101 Korean card records
        run: python scripts/audit-theme-s6a-001-101-visual.py
      - name: Save evidence only without marking the 12 themes verified
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/s6a/001-101
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6a): archive 90-card Korean image preflight and contact sheets"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-s6a-001-101-visual.py
          done
