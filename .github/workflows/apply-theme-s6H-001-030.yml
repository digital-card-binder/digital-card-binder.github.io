name: Apply visually reviewed S6H 001-030 independent twelve-theme corrections
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-s6H-001-030.yml'
      - 'scripts/apply-theme-s6H-001-030.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-s6h-001-030-visual-themes
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Update 001-030 themes only after verified Korean art evidence
        run: node scripts/apply-theme-s6H-001-030.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit classifications only after full test suite
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add -u
            git add data/audits/theme-s6H-001-030-progress-20261015.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6H): verify 30 Korean artworks and correct inaccurate theme memberships"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-theme-s6H-001-030.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
