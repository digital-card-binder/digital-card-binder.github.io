name: Apply Korean SM2+ 031–066 and hold nine source mismatches
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-sm2plus-031-066-themes-20261020.yml'
      - 'scripts/apply-theme-sm2plus-031-066-hold-last-nine-20261020.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-sm2plus-031-066-themes
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependencies
        run: npm ci
      - name: Screen 36 verified Korean prints and hold mismapped 9
        run: node scripts/apply-theme-sm2plus-031-066-hold-last-nine-20261020.mjs
      - name: Synchronize generated coverage and verify full application
        run: |
          npm run site:prepare
          npm test
      - name: Commit one safe completed review batch
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          changed="$(git diff --cached --name-only)"
          if printf '%s\n' "$changed" | grep -E '^(radar-server/|api/radar/|data/radar-master/|data/card-radar-|tests/card-radar-|scripts/.*radar)' ; then
            echo 'Refusing to alter Card Radar files in independent theme audit'
            exit 1
          fi
          echo "$changed"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(theme): SM2+ 031-066 visuals and 9 mismatched final slots held'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
