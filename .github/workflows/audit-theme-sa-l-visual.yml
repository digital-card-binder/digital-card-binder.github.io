name: Audit SA-L Korean Lightning starter images from owned archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-sa-l-visual.yml'
      - 'scripts/audit-theme-sa-l-visual.py'
permissions:
  contents: write
concurrency:
  group: sa-l-Korean-25-images-evidence
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Inspect Korean SA-L originals from DCB-owned CDN only
        run: python scripts/audit-theme-sa-l-visual.py
      - name: Save image-contact evidence and no external-origin requests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/SA-L
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture Korean SA-L 25 own-card image proof"
          git pull --rebase origin main
          git push origin HEAD:main
