name: Complete Korean S8a-P 25th Anniversary Korean promo cards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-s8a-p-25.yml'
      - 'scripts/apply-theme-s8a-p-25-korean.mjs'
permissions:
  contents: write
concurrency:
  group: s8a-p-25-Korean-verified-artwork-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply Korean S8a-P 25 images and 12 independent art themes
        run: node scripts/apply-theme-s8a-p-25-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit verified data only, refresh latest main on push conflict
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-s8a-p-set-progress-20261014.json
            git add -u
            if git diff --cached --quiet; then
              echo "No changes needed: set already safely applied"
              exit 0
            fi
            git commit -m "Complete Korean S8a-P 25 own-CDN artworks and independent themes (attempt $attempt)"
            if git push origin HEAD:main; then
              echo "S8a-P committed successfully on main"
              exit 0
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "Five push conflicts: safe stop rather than overwriting concurrent changes"
              exit 1
            fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-theme-s8a-p-25-korean.mjs
            npm run site:prepare
            npm run site:check
            npm test
          done
