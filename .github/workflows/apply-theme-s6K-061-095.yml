name: Apply Korean s6K 061-095 themes with Japanese print holds
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-s6K-061-095.yml'
      - 'scripts/apply-theme-s6K-061-095-korean.mjs'
      - 'data/audits/theme-s6K-061-095-Korean-art-review-20261015.json'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-reviewed-061-095-art-with-foreign-prints-held
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply 35 reviewed artworks but keep twelve Japanese printed card placeholders flagged
        run: node scripts/apply-theme-s6K-061-095-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit only after checks pass, never mark s6K complete
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add -u
            git add data/audits/theme-s6K-061-095-progress-20261015.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): classify 95 artworks while holding twelve non-Korean prints"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-theme-s6K-061-095-korean.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
