name: One-time v0.9 news copy edit

on:
  push:
    branches:
      - chore/v09-news-copy-edit-20260904
    paths:
      - '.github/workflows/one-time-v09-news-copy-edit.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/v09-news-copy-edit-20260904

      - name: Shorten stability wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('news.json')
          text = path.read_text(encoding='utf-8')
          old = '네트워크나 Firebase 연결에 문제가 발생하더라도 앱 이용에 미치는 영향을 줄이도록 오류 처리와 전반적인 안정성을 개선했습니다.'
          new = '오류 처리와 전반적인 안정성을 개선했습니다.'
          if old not in text:
              raise SystemExit('target wording not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Shorten v0.9 stability news wording"
          git push
