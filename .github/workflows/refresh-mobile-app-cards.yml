name: Refresh mobile app cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-mobile-app-cards.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump dashboard asset versions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<script src="./news.js?v=20260813-1" defer></script>'
          new = '<script src="./news.js?v=20260915-3" defer></script>'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('news.js script tag not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Bust dashboard cache for compact Android and iPhone cards"
          git push origin HEAD:main
