name: Temporary extract Sword Shield character rarity candidates

on:
  push:
    branches:
      - fix/dashboard-and-swordshield-trainer-pokemon
    paths:
      - .github/workflows/tmp-extract-s-character-rarity.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-and-swordshield-trainer-pokemon
          fetch-depth: 0
      - name: Extract candidates
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          groups = json.loads(Path('data/series.json').read_text(encoding='utf-8'))
          rows=[]
          for g in groups:
            code=str(g.get('code') or '')
            u=code.upper()
            if not re.match(r'^S(?:[-0-9A-Z].*)?$',u) or u.startswith('SV') or u.startswith('SM'):
              continue
            for c in g.get('cards') or []:
              rarity=str(c.get('rarity') or '').upper().strip()
              if rarity not in {'CHR','CSR'}:
                continue
              rows.append({
                'set':code,'setName':g.get('title'),'name':c.get('name') or c.get('pokemonName'),
                'pokemonName':c.get('pokemonName') or c.get('name'),'rarity':rarity,
                'cardNumber':c.get('cardNumber') or c.get('number') or c.get('meta'),
                'code':c.get('code'),'image':c.get('image'),'illustrator':c.get('illustrator') or '',
              })
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/s-character-rarity-candidates.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('CANDIDATES',len(rows))
          from collections import Counter
          print('BY_SET',Counter(r['set'] for r in rows))
          PY
      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp/s-character-rarity-candidates.json
          git commit -m "chore: extract Sword Shield CHR CSR candidate list"
          git pull --rebase origin fix/dashboard-and-swordshield-trainer-pokemon
          git push origin HEAD:fix/dashboard-and-swordshield-trainer-pokemon
