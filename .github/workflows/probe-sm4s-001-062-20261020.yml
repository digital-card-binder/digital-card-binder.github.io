name: Probe Korean SM4S 001–062 artwork images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-sm4s-001-062-20261020.yml'
      - 'scripts/probe-sm4s-001-062-korean-20261020.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sm4s-korean-card-image-proof
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install requests pillow
      - name: Read 62 Korean card sources, without changing classifications
        run: |
          python -m py_compile scripts/probe-sm4s-001-062-korean-20261020.py
          python scripts/probe-sm4s-001-062-korean-20261020.py
      - name: Save image evidence only
        run: |
          set -euo pipefail
          git add data/audits/theme-sm4s-001-062-korean-image-preflight-20261020.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(sm4s): record 62 Korean image HTTP/source hashes'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
