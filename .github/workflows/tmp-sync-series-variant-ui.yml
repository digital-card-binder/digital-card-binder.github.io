name: Temporary sync series print variant UI

on:
  push:
    branches:
      - feature/series-print-variant-ui-20260928
    paths:
      - catalog.js

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Synchronize site versions
        run: npm run versions:sync
      - name: Commit synchronized versions
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No version changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collector-nav.js pwa.js site-version.json *.html
          git commit -m "Sync site versions for print variant metadata UI"
          git push
