name: Complete Korean S6K 086 physical print replacement safely
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-s6k-086-korean.yml'
      - 'scripts/complete-s6k-086-korean.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-korean-086-image-replacement
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Replace one verified Korean S6K 086 printed image, preserve eleven holds
        run: node scripts/complete-s6k-086-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit verified Korean 086 only after full structural tests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): restore Korean physical 086 print and hold eleven unverified images"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/complete-s6k-086-korean.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
