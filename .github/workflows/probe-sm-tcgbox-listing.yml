name: Probe SM TCGBOX Listing Images
on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-sm-tcgbox-listing.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Match remaining SM fallbacks from TCGBOX listing image filenames
        run: |
          python -m pip install --quiet requests beautifulsoup4
          python - <<'PY'
          import json,re
          from pathlib import Path
          from urllib.parse import urljoin,urlparse,parse_qs,unquote
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests
          from bs4 import BeautifulSoup

          BASE="https://tcgbox.co.kr"
          H={"User-Agent":"Mozilla/5.0 (compatible; DigitalCardBinder/1.0)","Accept-Language":"ko-KR,ko;q=0.9"}
          data=json.loads(Path("data/series.json").read_text(encoding="utf-8"))

          def norm(s):
            s=unquote(str(s or "")).casefold().replace("+","plus")
            return re.sub(r"[^a-z0-9]","",s)

          targets=[]
          for g in data:
            if str(g.get("era") or "").upper()!="SM": continue
            for c in g.get("cards",[]):
              if "static.tcgexchange.kr" not in str(c.get("image") or ""): continue
              m=re.search(r"_0*([0-9]+)(?:/|$)",str(c.get("code") or ""))
              if not m: continue
              num=int(m.group(1))
              codepref=str(c.get("code") or "").split("_",1)[0]
              prefs={norm(g.get("code")),norm(codepref)}
              targets.append({
                "set":g.get("code"),"code":c.get("code"),"name":c.get("name"),
                "num":num,"prefs":[p for p in prefs if p]
              })
          print("TARGETS",len(targets),flush=True)

          s=requests.Session(); s.headers.update(H)
          parent=s.get(BASE+"/product/list.html?cate_no=99",timeout=20); parent.raise_for_status()
          soup=BeautifulSoup(parent.text,"html.parser")
          cats={}
          for a in soup.find_all("a",href=True):
            label=" ".join(a.stripped_strings).strip()
            if not label: continue
            full=urljoin(BASE,a["href"]); q=parse_qs(urlparse(full).query)
            cn=(q.get("cate_no") or [""])[0]
            if not cn:
              parts=[p for p in urlparse(full).path.split("/") if p]
              if len(parts)>=3 and parts[0]=="category" and parts[-1].isdigit(): cn=parts[-1]
            if not cn or cn=="99": continue
            low=label.casefold()
            if "sm" in low or "썬&문" in label: cats[cn]=label
          print("CATEGORIES",len(cats),flush=True)

          def scan(cn,page):
            try:
              r=requests.get(BASE+f"/product/list.html?cate_no={cn}&page={page}",headers=H,timeout=15)
              if r.status_code!=200:return []
              sp=BeautifulSoup(r.text,"html.parser")
              rows=[]
              for a in sp.find_all("a",href=True):
                href=urljoin(BASE,a["href"]).split("#")[0]
                if "/product/" not in href: continue
                imgs=a.find_all("img")
                if not imgs: continue
                for im in imgs:
                  vals=[im.get(k,"") for k in ("src","ec-data-src","data-src")]
                  for src in vals:
                    if not src: continue
                    img=urljoin(BASE,src)
                    rows.append((href,img))
              return rows
            except Exception:
              return []

          pairs=[]
          with ThreadPoolExecutor(max_workers=32) as ex:
            fs=[ex.submit(scan,cn,p) for cn in cats for p in range(1,18)]
            for f in as_completed(fs): pairs.extend(f.result())
          seen=set(); unique=[]
          for href,img in pairs:
            k=(href,img)
            if k in seen: continue
            seen.add(k); unique.append(k)
          print("LISTING_PAIRS",len(unique),flush=True)

          matches={}
          for href,img in unique:
            nimg=norm(urlparse(img).path.rsplit("/",1)[-1])
            if not nimg: continue
            for t in targets:
              key=(t["set"],t["code"])
              if key in matches: continue
              num3=f"{t['num']:03d}"
              numraw=str(t["num"])
              if any((p+num3) in nimg or (p+numraw) in nimg for p in t["prefs"]):
                matches[key]={
                  **t,"image":img,"source":href,"filename":unquote(urlparse(img).path.rsplit("/",1)[-1])
                }
                print("LISTING_HIT",json.dumps(matches[key],ensure_ascii=False),flush=True)
          out=sorted(matches.values(),key=lambda x:(str(x["set"]),str(x["code"])))
          Path("sm-tcgbox-listing-hits.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print("LISTING_SUMMARY",json.dumps({"targets":len(targets),"pairs":len(unique),"hits":len(out)},ensure_ascii=False),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sm-tcgbox-listing-hits
          path: sm-tcgbox-listing-hits.json
          retention-days: 2
