name: Complete Korean SP1 8 steel starter cards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-sp1-8.yml'
      - 'scripts/apply-theme-sp1-8-korean.mjs'
permissions:
  contents: write
concurrency:
  group: sp1-8-full-Korean-reviewed-cards
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply all 8 Korean SP1 card artworks to independent themes
        run: node scripts/apply-theme-sp1-8-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit only after passing every regression check
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sp1-set-progress-20261014.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete Korean SP1 8 steel starter artworks and archive pointers"
          if git push origin HEAD:main; then exit 0; fi
          git fetch origin main
          git reset --hard origin/main
          node scripts/apply-theme-sp1-8-korean.mjs
          npm run site:prepare
          npm run site:check
          npm test
          git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-sp1-set-progress-20261014.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete Korean SP1 8 on latest main"
          git push origin HEAD:main
