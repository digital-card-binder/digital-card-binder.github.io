name: Temporary artist sync debug
on:
  push:
    branches: [feat/artist-dex-auto-sync]
    paths: [".github/workflows/tmp-artist-debug.yml", "scripts/sync_artist_dex.py"]
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet "Pillow==12.3.0"
      - run: python scripts/sync_artist_dex.py --clone --latest
      - name: Report
        run: |
          python - <<'PY'
          import json, urllib.request, re, collections
          r = json.load(open("data/audits/artist-dex-sync.json"))
          print("SUMMARY", r["addedCount"], r["heldByReason"], r["conflictCount"])
          un = [h for h in r["held"] if h["reason"] == "trainer-image-unavailable"]
          print("UNAVAILABLE BY SET", collections.Counter("/".join(h["tcgdexPath"].split("/")[:2]) for h in un).most_common(25))
          def status(url):
              try:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "DigitalCardBinder-ArtistSync"})
                  with urllib.request.urlopen(req, timeout=15) as resp: return resp.status
              except Exception as e: return getattr(e, "code", str(e)[:40])
          seen = set()
          for h in un:
              era, s, f = h["tcgdexPath"].split("/")
              if s in seen: continue
              seen.add(s)
              n = f[:-3]
              for lang in ("ja", "zh-tw", "th", "id"):
                  for ext in ("high.webp", "high.png", "low.webp"):
                      for stem in dict.fromkeys([n, str(int(n))]):
                          u = f"https://assets.tcgdex.net/{lang}/{era}/{s}/{stem}/{ext}"
                          st = status(u)
                          if st == 200: print("OK", u)
              if len(seen) >= 12: break
          for c in r["conflicts"][:70]: print("CONFLICT", c["artist"], c["set"], c["cardNumber"], c["card"], c["alsoCreditedTo"])
          PY
      - name: Visual additions
        run: |
          python - <<'PY'
          import json
          r = json.load(open("data/audits/artist-dex-sync.json"))
          rows = [(a, x) for a, xs in r["added"].items() for x in xs if x.get("visualDistance") is not None]
          print("VISUAL ADDED", len(rows))
          for a, x in rows: print("V", a, "|", x["set"], x["cardNumber"], x["name"], "|", x["tcgdexPath"], x["visualDistance"])
          for c in r["conflicts"]: print("C", c["artist"], "|", c["set"], c["cardNumber"], c["card"], "| also", c["alsoCreditedTo"], "|", c.get("tcgdexPath"), c.get("visualDistance"))
          PY
