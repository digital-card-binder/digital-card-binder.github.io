name: Review 25 remaining verified Korean SM2K artworks
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/review-sm2k-031-062-safe-korean-themes-20261018.yml"
      - "scripts/review-sm2k-031-062-safe-korean-themes-20261018.mjs"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sm2k-031-062-safe-korean-theme-20261018
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Review 25 Korean image-confirmed cards; hold six foreign or broken photos
        run: node scripts/review-sm2k-031-062-safe-korean-themes-20261018.mjs
      - name: Refresh theme index, related dex, metrics and shell versions
        run: |
          npm run theme-audit:sync
          npm run related-dex:sync
          npm run catalog-metrics:sync
          npm run shell:sync
          npm run versions:sync
      - name: Run complete site and ownership regression checks
        run: |
          npm run site:check
          npm run test:registry
          npm run test:syntax
          npm run test:architecture
      - name: Push verified theme records and six-photo hold report only after tests
        run: |
          set -euo pipefail
          git add -u
          git add data/audits/theme-sm2k-031-062-Korean-art-review-20261018.json
          git add data/audits/theme-sm2k-031-062-progress-20261018.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "audit(themes): finish safe SM2K art, hold six ambiguous Korean image slots"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
