name: Temporary trainer Pokemon complete audit
on:
  push:
    branches:
      - work/trainer-pokemon-audit-run3
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        part: [s-1, s-2, sv-1, sv-2, m6]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests ultralytics
      - name: Audit ${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: |
          python - <<'PY'
          import io,json,math,os,re
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor,as_completed
          import requests
          from PIL import Image,ImageDraw,ImageFont
          from ultralytics import YOLO

          part=os.environ['PART']
          series=json.loads(Path('data/series.json').read_text(encoding='utf-8'))
          rows=[]; selected=[]
          if part.startswith('s-'):
            gs=[g for g in series if str(g.get('code') or '').upper().startswith('S') and not str(g.get('code') or '').upper().startswith(('SV','SM'))]
            cut=(len(gs)+1)//2
            selected=gs[:cut] if part=='s-1' else gs[cut:]
            for g in selected:
              for c in g.get('cards') or []:
                rows.append({'set':g.get('code'),'setName':g.get('title'),'name':c.get('name') or c.get('pokemonName') or '', 'code':c.get('code') or '', 'image':c.get('image') or '', 'source':c.get('source') or '', 'rarity':c.get('rarity') or ''})
          elif part.startswith('sv-'):
            gs=[g for g in series if str(g.get('code') or '').upper().startswith('SV')]
            cut=(len(gs)+1)//2
            selected=gs[:cut] if part=='sv-1' else gs[cut:]
            for g in selected:
              for c in g.get('cards') or []:
                cc=str(c.get('code') or '')
                m=re.search(r'_(\d+)/(\d+)',cc)
                if m and int(m.group(1))<=int(m.group(2)):
                  rows.append({'set':g.get('code'),'setName':g.get('title'),'name':c.get('name') or c.get('pokemonName') or '', 'code':cc, 'image':c.get('image') or '', 'source':c.get('source') or '', 'rarity':c.get('rarity') or ''})
          else:
            txt=Path('mega-latest.js').read_text(encoding='utf-8')
            block=re.search(r'const M6_NAMES = Object\.freeze\(\[(.*?)\]\);',txt,re.S).group(1)
            names=re.findall(r'"([^"]+)"',block)
            for i,name in enumerate(names,1):
              tok=f'{i:03d}'
              rows.append({'set':'m6','setName':'스톰에메랄다','name':name,'code':f'm6_{tok}/076','image':f'https://cards.image.pokemonkorea.co.kr/data/wmimages/MEGA/M6/M6_{tok}.png','source':'','rarity':''})

          meta=[{'set':g.get('code'),'setName':g.get('title'),'cards':len(g.get('cards') or [])} for g in selected]
          print('PART',part,'ROWS',len(rows),'GROUPS',json.dumps(meta,ensure_ascii=False))
          Path(f'{part}-manifest.json').write_text(json.dumps({'groups':meta,'cards':rows},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          imgdir=Path(f'{part}-images'); imgdir.mkdir()
          failures=[]; downloaded=[]
          def dl(i,row):
            try:
              if not row['image']: raise RuntimeError('missing image')
              r=requests.get(row['image'],timeout=15,headers={'User-Agent':'digital-card-binder-audit/1.0'}); r.raise_for_status()
              p=imgdir/f'{i:05d}.jpg'; Image.open(io.BytesIO(r.content)).convert('RGB').save(p,quality=88)
              return i,row,p,None
            except Exception as e: return i,row,None,str(e)
          with ThreadPoolExecutor(max_workers=32) as ex:
            futs=[ex.submit(dl,i,r) for i,r in enumerate(rows)]
            for n,f in enumerate(as_completed(futs),1):
              i,row,p,e=f.result()
              if p: downloaded.append((i,row,p))
              else: failures.append({**row,'error':e})
              if n%200==0: print(part,'DOWNLOAD',n,'FAIL',len(failures))
          downloaded.sort(key=lambda x:x[0])
          Path(f'{part}-failures.json').write_text(json.dumps(failures,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          model=YOLO('yolo11n.pt')
          paths=[str(x[2]) for x in downloaded]
          results=model.predict(source=paths,classes=[0],conf=0.02,iou=0.45,imgsz=448,batch=64,verbose=False) if paths else []
          candidates=[]; thumbs=[]
          for item,result in zip(downloaded,results):
            i,row,p=item
            confs=[] if result.boxes is None else [float(x) for x in result.boxes.conf.cpu().tolist()]
            maxc=max(confs) if confs else 0
            if maxc>=.02:
              rec={**row,'personDetection':round(maxc,4),'personDetections':len(confs)}
              candidates.append(rec)
              im=Image.open(p).convert('RGB'); im.thumbnail((205,287)); thumbs.append((rec,im.copy()))
          print(part,'DOWNLOADED',len(downloaded),'FAIL',len(failures),'CANDIDATES',len(candidates))
          Path(f'{part}-human-candidates.json').write_text(json.dumps(candidates,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          out=Path(f'{part}-candidate-sheets'); out.mkdir(); W,H=245,355; COLS,ROWS=5,4; PER=20; font=ImageFont.load_default()
          for pg in range(math.ceil(len(thumbs)/PER)):
            can=Image.new('RGB',(COLS*W,ROWS*H),'white'); d=ImageDraw.Draw(can)
            for j,(row,im) in enumerate(thumbs[pg*PER:(pg+1)*PER]):
              x=(j%COLS)*W; y=(j//COLS)*H; can.paste(im,(x+20,y+4))
              d.multiline_text((x+5,y+294),f"{row['set']} {row['code']}\n{row['name']} p={row['personDetection']}",fill='black',font=font,spacing=2)
            can.save(out/f'page-{pg+1:03d}.jpg',quality=90)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: trainer-pokemon-audit-${{ matrix.part }}
          path: |
            ${{ matrix.part }}-manifest.json
            ${{ matrix.part }}-human-candidates.json
            ${{ matrix.part }}-failures.json
            ${{ matrix.part }}-candidate-sheets/
          retention-days: 1
