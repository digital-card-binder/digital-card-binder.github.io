name: Verify Korean secret-card physical print numbers from own CDN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-korean-secret-print-numbers.yml'
      - 'scripts/audit-korean-secret-print-numbers.py'
permissions:
  contents: write
concurrency:
  group: korean-vmax-secret-print-number-proof
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Enlarge eight archived Korean card printed-number regions without origin image requests
        run: python scripts/audit-korean-secret-print-numbers.py
      - name: Commit read-only number comparison evidence safely
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/printed-number-comparisons-20261014.webp.b64
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Inspect Korean secret-number physical labels from own CDN"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-korean-secret-print-numbers.py
          done
