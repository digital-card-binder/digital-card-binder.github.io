name: Temporary fix trainer Pokemon rarity metadata

on:
  push:
    branches:
      - feature/rename-and-expand-trainer-pokemon-dex
    paths:
      - .github/workflows/tmp-fix-trainer-pokemon-rarity.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rename-and-expand-trainer-pokemon-dex
          fetch-depth: 0
      - name: Apply official Korean rarity metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/trainer-pokemon.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          rarity = {
            's4_012/100': 'R',
            's4_026/100': 'U',
            's6h_021/070': 'R',
            's10p_024/067': 'C',
          }
          found = set()
          for group in data['groups']:
            for card in group['cards']:
              if card.get('code') in rarity:
                card['rarity'] = rarity[card['code']]
                found.add(card['code'])
          assert found == set(rarity), found
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit metadata fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trainer-pokemon.json
          git commit -m "fix: complete reviewed trainer Pokemon metadata"
          git pull --rebase origin feature/rename-and-expand-trainer-pokemon-dex
          git push origin HEAD:feature/rename-and-expand-trainer-pokemon-dex
