name: Deploy card images to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/card-image-deploy-request.json
  workflow_dispatch:
    inputs:
      project:
        description: Image project to build and deploy
        required: true
        type: choice
        options:
          - modern
          - legacy
      limit:
        description: Number of images (0 builds the full project)
        required: true
        default: "50"
        type: string

permissions:
  contents: read

concurrency:
  # Never run the two source downloads in parallel against upstream image hosts.
  group: cloudflare-card-images-migration
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODERN_PROJECT_OVERRIDE: ${{ vars.CLOUDFLARE_PAGES_MODERN_PROJECT }}
      LEGACY_PROJECT_OVERRIDE: ${{ vars.CLOUDFLARE_PAGES_LEGACY_PROJECT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve deployment request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROJECT: ${{ inputs.project }}
          DISPATCH_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            PROJECT="$DISPATCH_PROJECT"
            LIMIT="$DISPATCH_LIMIT"
          else
            PROJECT="$(node -p 'require("./.github/card-image-deploy-request.json").project')"
            LIMIT="$(node -p 'require("./.github/card-image-deploy-request.json").limit')"
          fi

          case "$PROJECT" in
            modern|legacy) ;;
            *) echo "::error::project must be modern or legacy"; exit 1 ;;
          esac
          if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
            echo "::error::limit must be a non-negative integer"
            exit 1
          fi

          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare authorization
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets are required."
            exit 1
          fi

      - name: Select free Pages project
        env:
          SELECTED_PROJECT: ${{ steps.request.outputs.project }}
        run: |
          set -euo pipefail
          if [ "$SELECTED_PROJECT" = "modern" ]; then
            PROJECT_NAME="${MODERN_PROJECT_OVERRIDE:-dcb-card-images-modern-2026}"
          else
            PROJECT_NAME="${LEGACY_PROJECT_OVERRIDE:-dcb-card-images-legacy-2026}"
          fi
          echo "CLOUDFLARE_PAGES_PROJECT=$PROJECT_NAME" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PAGES_BASE=https://$PROJECT_NAME.pages.dev" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image converter
        run: python -m pip install --quiet "Pillow==12.3.0"

      - name: Build migration manifest
        run: node scripts/build-card-image-manifest.mjs

      - name: Restore converted image cache
        id: image-cache
        uses: actions/cache/restore@v4
        with:
          path: tmp/card-images/build/${{ steps.request.outputs.project }}
          key: card-images-v1-${{ runner.os }}-${{ steps.request.outputs.project }}-${{ hashFiles('data/*.json', 'mega-latest.js', 'scripts/card-image-routing.mjs', 'scripts/build-card-image-manifest.mjs', 'scripts/download_card_images.py') }}-${{ github.run_id }}
          restore-keys: |
            card-images-v1-${{ runner.os }}-${{ steps.request.outputs.project }}-${{ hashFiles('data/*.json', 'mega-latest.js', 'scripts/card-image-routing.mjs', 'scripts/build-card-image-manifest.mjs', 'scripts/download_card_images.py') }}-

      - name: Download once and preserve source watermarks
        env:
          SELECTED_PROJECT: ${{ steps.request.outputs.project }}
          IMAGE_LIMIT: ${{ steps.request.outputs.limit }}
        run: |
          set -euo pipefail
          python scripts/download_card_images.py \
            --project "$SELECTED_PROJECT" \
            --limit "$IMAGE_LIMIT" \
            --min-delay 2.0

      - name: Validate Pages Free limits
        env:
          SELECTED_PROJECT: ${{ steps.request.outputs.project }}
          IMAGE_LIMIT: ${{ steps.request.outputs.limit }}
        run: |
          set -euo pipefail
          EXTRA_ARGS=()
          if [ "$IMAGE_LIMIT" != "0" ]; then
            EXTRA_ARGS+=(--allow-missing)
          fi
          node scripts/validate-card-image-build.mjs \
            --project="$SELECTED_PROJECT" \
            "${EXTRA_ARGS[@]}"

      - name: Save converted image cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tmp/card-images/build/${{ steps.request.outputs.project }}
          key: ${{ steps.image-cache.outputs.cache-primary-key }}

      - name: Upload migration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-image-migration-${{ steps.request.outputs.project }}-${{ github.run_id }}
          path: |
            tmp/card-images/migration-log.jsonl
            tmp/card-images/failures-${{ steps.request.outputs.project }}.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Create Pages project if needed
        run: node scripts/ensure-cloudflare-pages-project.mjs

      - name: Deploy static images
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SELECTED_PROJECT: ${{ steps.request.outputs.project }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.1 pages deploy "tmp/card-images/build/$SELECTED_PROJECT" \
            --project-name "$CLOUDFLARE_PAGES_PROJECT" \
            --branch main \
            --commit-dirty=true

      - name: Verify deployed image
        env:
          SELECTED_PROJECT: ${{ steps.request.outputs.project }}
        run: |
          set -euo pipefail
          ASSET_PATH="$(node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("tmp/card-images/manifest.json", "utf8"));
            const project = process.env.SELECTED_PROJECT;
            const asset = manifest.assets.find((item) => item.project === project);
            if (!asset) process.exit(1);
            process.stdout.write(asset.relativePath);
          ')"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
            "$CLOUDFLARE_PAGES_BASE/$ASSET_PATH" \
            --output "$RUNNER_TEMP/card-image-smoke-test.webp"
          python -c 'from PIL import Image; import os; Image.open(os.environ["RUNNER_TEMP"] + "/card-image-smoke-test.webp").verify()'
