name: Deploy card images to Cloudflare Pages

on:
  push:
    branches: [main]
    paths: ['.github/card-image-deploy-request.json']
  workflow_dispatch:
    inputs:
      repair_only:
        description: Restore saved archives and repair only missing images
        required: false
        default: false
        type: boolean
      batch_size:
        description: Images per checkpointed batch
        required: true
        default: "600"
        type: choice
        options:
          - "400"
          - "600"
          - "800"

permissions:
  contents: read

concurrency:
  # Starting the corrected sequence replaces the obsolete full-run downloader.
  group: cloudflare-card-images-migration
  cancel-in-progress: true

jobs:
  prepare:
    name: Plan SV → M → S → remaining
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      repair_only: ${{ steps.mode.outputs.repair_only }}
      sv: ${{ steps.plan.outputs.sv }}
      mega: ${{ steps.plan.outputs.mega }}
      s: ${{ steps.plan.outputs.s }}
      legacy: ${{ steps.plan.outputs.legacy }}
      summary: ${{ steps.plan.outputs.summary }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select recovery mode
        id: mode
        env:
          REQUESTED_REPAIR: ${{ github.event_name == 'push' || inputs.repair_only }}
        run: echo "repair_only=$REQUESTED_REPAIR" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build migration manifest
        run: node scripts/build-card-image-manifest.mjs

      - name: Create checkpoint plan
        id: plan
        run: node scripts/plan-card-image-batches.mjs --batch-size="${{ inputs.batch_size || '600' }}" --github-output

      - name: Record migration order
        env:
          PLAN_SUMMARY: ${{ steps.plan.outputs.summary }}
        run: |
          echo "### Card image migration plan" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$PLAN_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  download-sv:
    name: SV batch ${{ matrix.batch }}
    needs: prepare
    if: needs.prepare.outputs.repair_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.sv) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Process SV batch
        uses: ./.github/actions/download-card-image-batch
        with:
          project: modern
          root: SV
          phase: sv
          batch: ${{ matrix.batch }}
          offset: ${{ matrix.offset }}
          limit: ${{ matrix.limit }}

  download-mega:
    name: M (MEGA) batch ${{ matrix.batch }}
    needs: [prepare, download-sv]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.mega) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Process M (MEGA) batch
        uses: ./.github/actions/download-card-image-batch
        with:
          project: modern
          root: MEGA
          phase: mega
          batch: ${{ matrix.batch }}
          offset: ${{ matrix.offset }}
          limit: ${{ matrix.limit }}

  download-s:
    name: S batch ${{ matrix.batch }}
    needs: [prepare, download-mega]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.s) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Process S batch
        uses: ./.github/actions/download-card-image-batch
        with:
          project: modern
          root: S
          phase: s
          batch: ${{ matrix.batch }}
          offset: ${{ matrix.offset }}
          limit: ${{ matrix.limit }}

  download-remaining:
    name: Remaining cards batch ${{ matrix.batch }}
    needs: [prepare, download-s]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.legacy) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Process remaining-card batch
        uses: ./.github/actions/download-card-image-batch
        with:
          project: legacy
          phase: remaining
          batch: ${{ matrix.batch }}
          offset: ${{ matrix.offset }}
          limit: ${{ matrix.limit }}

  verify-and-deploy:
    name: Validate complete archives and deploy
    needs: [prepare, download-remaining]
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.download-remaining.result == 'success' ||
       (needs.prepare.outputs.repair_only == 'true' && needs.download-remaining.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODERN_PROJECT_OVERRIDE: ${{ vars.CLOUDFLARE_PAGES_MODERN_PROJECT }}
      LEGACY_PROJECT_OVERRIDE: ${{ vars.CLOUDFLARE_PAGES_LEGACY_PROJECT }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Cloudflare authorization
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] || [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN repository secrets are required."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image verifier
        run: python -m pip install --quiet "Pillow==12.3.0"

      - name: Test cache recovery and complete image verification
        run: python -m unittest discover -s tests -p test_card_image_recovery.py

      - name: Build migration manifest
        run: node scripts/build-card-image-manifest.mjs

      - name: Restore complete modern archive
        id: modern-cache
        uses: actions/cache/restore@v4
        with:
          path: tmp/card-images/build/modern
          key: card-images-v2-${{ runner.os }}-modern-${{ hashFiles('data/*.json', 'mega-latest.js', 'scripts/card-image-routing.mjs', 'scripts/build-card-image-manifest.mjs', 'scripts/card-image-source-repairs.json', 'scripts/download_card_images.py') }}-final-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            card-images-v2-${{ runner.os }}-modern-${{ hashFiles('data/*.json', 'mega-latest.js', 'scripts/card-image-routing.mjs', 'scripts/build-card-image-manifest.mjs', 'scripts/card-image-source-repairs.json', 'scripts/download_card_images.py') }}-
            card-images-v2-${{ runner.os }}-modern-
            card-images-v1-${{ runner.os }}-modern-

      - name: Restore complete remaining-card archive
        id: legacy-cache
        uses: actions/cache/restore@v4
        with:
          path: tmp/card-images/build/legacy
          key: card-images-v2-${{ runner.os }}-legacy-${{ hashFiles('data/*.json', 'mega-latest.js', 'scripts/card-image-routing.mjs', 'scripts/build-card-image-manifest.mjs', 'scripts/card-image-source-repairs.json', 'scripts/download_card_images.py') }}-final-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            card-images-v2-${{ runner.os }}-legacy-${{ hashFiles('data/*.json', 'mega-latest.js', 'scripts/card-image-routing.mjs', 'scripts/build-card-image-manifest.mjs', 'scripts/card-image-source-repairs.json', 'scripts/download_card_images.py') }}-
            card-images-v2-${{ runner.os }}-legacy-
            card-images-v1-${{ runner.os }}-legacy-

      - name: Repair missing images in restored archives
        run: |
          set -euo pipefail
          FAILED=0
          python scripts/download_card_images.py --project modern --missing-only --max-missing 600 --min-delay 2.0 --allow-failures || FAILED=1
          python scripts/download_card_images.py --project legacy --missing-only --max-missing 600 --min-delay 2.0 --allow-failures || FAILED=1
          exit "$FAILED"

      - name: Save repaired modern archive
        if: always() && steps.modern-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: tmp/card-images/build/modern
          key: ${{ steps.modern-cache.outputs.cache-primary-key }}

      - name: Save repaired remaining-card archive
        if: always() && steps.legacy-cache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: tmp/card-images/build/legacy
          key: ${{ steps.legacy-cache.outputs.cache-primary-key }}

      - name: Validate every expected image before deployment
        if: always() && steps.modern-cache.outcome == 'success' && steps.legacy-cache.outcome == 'success'
        run: |
          set -euo pipefail
          FAILED=0
          node scripts/validate-card-image-build.mjs --project=modern || FAILED=1
          node scripts/validate-card-image-build.mjs --project=legacy || FAILED=1
          python scripts/verify_card_image_archive.py || FAILED=1
          exit "$FAILED"

      - name: Upload complete recovery and validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-image-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/card-images/migration-log.jsonl
            tmp/card-images/failures-*.json
            tmp/card-images/validation-*.json
            tmp/card-images/archive-verification.json
          retention-days: 14

      - name: Select Cloudflare Pages projects
        run: |
          set -euo pipefail
          echo "MODERN_PROJECT_NAME=${MODERN_PROJECT_OVERRIDE:-dcb-card-images-modern-2026}" >> "$GITHUB_ENV"
          echo "LEGACY_PROJECT_NAME=${LEGACY_PROJECT_OVERRIDE:-dcb-card-images-legacy-2026}" >> "$GITHUB_ENV"

      - name: Ensure both Pages projects exist
        run: |
          set -euo pipefail
          CLOUDFLARE_PAGES_PROJECT="$MODERN_PROJECT_NAME" node scripts/ensure-cloudflare-pages-project.mjs
          CLOUDFLARE_PAGES_PROJECT="$LEGACY_PROJECT_NAME" node scripts/ensure-cloudflare-pages-project.mjs

      - name: Deploy both complete static archives
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.136.1 pages deploy tmp/card-images/build/modern \
            --project-name "$MODERN_PROJECT_NAME" \
            --branch main \
            --commit-dirty=true
          npx --yes wrangler@4.136.1 pages deploy tmp/card-images/build/legacy \
            --project-name "$LEGACY_PROJECT_NAME" \
            --branch main \
            --commit-dirty=true

      - name: Verify representative deployed images
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
            "https://$MODERN_PROJECT_NAME.pages.dev/data/wmimages/MEGA/M-P/M-P_012.webp" \
            --output "$RUNNER_TEMP/card-image-modern.webp"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors --retry-max-time 120 \
            "https://$LEGACY_PROJECT_NAME.pages.dev/data/wmimages/BW/BD/bw_bd_001.webp" \
            --output "$RUNNER_TEMP/card-image-legacy.webp"
          python -c 'from PIL import Image; import os; [Image.open(os.path.join(os.environ["RUNNER_TEMP"], name)).verify() for name in ("card-image-modern.webp", "card-image-legacy.webp")]'

      - name: Confirm cutover remains disabled
        run: |
          set -euo pipefail
          grep -Eq 'active:[[:space:]]*false' card-image-cdn.js
          echo "Cloudflare archives are verified. card-image-cdn.js remains disabled."
