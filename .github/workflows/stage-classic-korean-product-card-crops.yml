name: Stage Korean Classic official first-party card crop quality proposals
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stage-classic-korean-product-card-crops.yml'
      - 'scripts/stage-classic-korean-official-card-crops.py'
permissions:
  contents: write
concurrency:
  group: korean-classic-marketing-crop-proposals
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Generate Korean-language individual card crop proposals from official imagery
        run: python scripts/stage-classic-korean-official-card-crops.py
      - name: Store inspection evidence only, without changing production cards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-classic-korean-official-card-crop-proposals-20261013
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Stage official Korean Classic card photo crop proposals for visual quality review"
          git pull --rebase origin main
          git push origin HEAD:main
