name: Probe M6 Fallback Images

on:
  push:
    branches:
      - feature/add-m6
    paths:
      - .github/workflows/build-m6-series-data.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pokecardmon page image sources
        shell: bash
        run: |
          set -e
          curl -L -sS -A 'Mozilla/5.0' 'https://pokecardmon.com/ko/box/M6?market=JP' -o /tmp/pokecardmon.html
          echo '--- interesting image/source URLs ---'
          grep -Eo 'https?[^"'"' ]+|/_next/image[^"'"' ]+|[^"'"' ]+\.(png|jpg|jpeg|webp)' /tmp/pokecardmon.html | grep -Ei 'M6|card|image|113|077' | head -n 120 || true
          echo '--- M6 / 113 context ---'
          grep -Eio '.{0,180}(113/076|M6[^<]{0,100}113|메가레쿠쟈|メガレックウザ).{0,300}' /tmp/pokecardmon.html | head -n 30 || true

      - name: Inspect Samurai Sword card list image sources
        shell: bash
        run: |
          set +e
          curl -L -sS -A 'Mozilla/5.0' 'https://samuraiswordtokyo.com/zh-hant/blogs/news/storm-emeralda-m6-card-list-all-73-cards' -o /tmp/samurai.html
          wc -c /tmp/samurai.html || true
          grep -Eo 'https?[^"'"' ]+\.(png|jpg|jpeg|webp)[^"'"' ]*' /tmp/samurai.html | grep -Ei 'M6|077|113|storm|rayquaza|masquerain' | head -n 120 || true
          echo '--- image tags around 077/113 ---'
          grep -Eio '.{0,250}(077/076|113/076).{0,500}' /tmp/samurai.html | head -n 20 || true
