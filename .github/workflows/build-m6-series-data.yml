name: Inspect M5 Series Data

on:
  push:
    branches:
      - feature/add-m6
    paths:
      - .github/workflows/build-m6-series-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Extract current M5 group
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          groups = json.loads(Path('data/series.json').read_text(encoding='utf-8'))
          matches = [g for g in groups if str(g.get('code', '')).lower() == 'm5']
          if len(matches) != 1:
              raise SystemExit(f'M5 group count: {len(matches)}')
          group = matches[0]
          cards = group.get('cards') or []
          Path('tmp').mkdir(exist_ok=True)
          Path('tmp/m5-current.json').write_text(
              json.dumps(group, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f"M5 cards={len(cards)}")
          print(f"M5 missing names={sum(not str(c.get('name') or '').strip() for c in cards)}")
          print(f"M5 missing images={sum(not str(c.get('image') or '').strip() for c in cards)}")
          PY

      - name: Commit M5 snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f tmp/m5-current.json
          git commit -m 'Extract M5 series snapshot for repair'
          git push origin HEAD:${{ github.ref_name }}
