name: Probe M6 Image Filenames

on:
  push:
    branches:
      - feature/add-m6
    paths:
      - .github/workflows/build-m6-series-data.yml

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Korean M6 images
        shell: bash
        run: |
          set +e
          base='https://cards.image.pokemonkorea.co.kr/data/wmimages/MEGA/M6'
          for n in 071 072 073 074 075 076 077 113; do
            for suffix in ".png" ".jpg" ".webp" "_1.png" "_2.png" "_L.png" "_R.png"; do
              url="$base/M6_${n}${suffix}"
              result=$(curl -L -sS -A 'Mozilla/5.0' -o /tmp/probe -w '%{http_code} %{content_type} %{size_download}' "$url")
              if [[ "$result" == 200* ]]; then
                echo "FOUND $n $suffix $result"
                break
              fi
              if [[ "$suffix" == ".png" ]]; then echo "BASE $n $result"; fi
            done
          done
