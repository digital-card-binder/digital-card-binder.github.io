name: Complete 141 Korean sv3 Obsidian Flames artwork reviews
on:
  push:
    branches: [main]
    paths:
      - 'data/audits/theme-sv3-001-141-art-review.json'
permissions:
  contents: write
concurrency:
  group: theme-sv3-strict-complete
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply 141 Korean canonical visual reviews and protect nine prior placements
        run: node scripts/apply-theme-sv3-complete-review.mjs
      - name: Rebuild site indexes
        run: npm run site:prepare
      - name: Check generated output
        run: npm run site:check
      - name: Run all regression tests
        run: npm test
      - name: Commit only successful validated master and generated artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series.json data/series-legacy.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete Korean sv3 Obsidian Flames 141 artwork and 12-theme audit"
          git pull --rebase origin main
          git push origin HEAD:main
