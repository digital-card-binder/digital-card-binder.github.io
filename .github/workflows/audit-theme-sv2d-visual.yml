name: Audit 99 Korean Clay Burst cards from owned archives
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-theme-sv2d-visual.py'
permissions:
  contents: write
concurrency:
  group: sv2d-evidence-main
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Decode existing 99 Korean card images using DCB Cloudflare CDN only
        run: python scripts/audit-theme-sv2d-visual.py
      - name: Save Korean print image evidence without modifying catalog or ownership
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/sv2D
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Capture 99 Korean Clay Burst card images in owned CDN visual evidence"
          git pull --rebase origin main
          git push origin HEAD:main
