name: Archive Korean s8b UR 278-285 artwork candidates
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-theme-s8b-ur-rehost.yml"
      - "scripts/audit-theme-s8b-ur-rehost.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s8b-korean-ur-art-source-candidates
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet Pillow==12.3.0 numpy
      - name: Gather eight Korean UR scans without altering main card records
        run: python scripts/audit-theme-s8b-ur-rehost.py
      - name: Save verified image candidates and contact sheet
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/cards/s8b-ur-korean data/audits/theme-visual-evidence/s8b/ur-278-285
          if ! git diff --cached --quiet; then
            git commit -m "audit(s8b): archive Korean UR 278-285 candidate artwork for visual verification"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
