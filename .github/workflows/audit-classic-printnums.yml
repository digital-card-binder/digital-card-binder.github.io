name: Audit Classic printed numbers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-classic-printnums.yml'
      - 'scripts/inspect-classic-korean-printed-number-crops.py'
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.3.0
      - run: python scripts/inspect-classic-korean-printed-number-crops.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-classic-official-printed-number-crosscheck-20261013
          git commit -m "Capture Korean Classic printed number evidence" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
