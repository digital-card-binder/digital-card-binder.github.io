name: Test Pokemon Korea macOS temp
on:
  push:
    branches: [feat/add-ranked-artists-top10-ko-20260826]
    paths: [.github/workflows/test-pokemonkorea-macos-temp.yml]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test official search API
        run: |
          python - <<'PY'
          import urllib.request, uuid
          url='https://pokemoncard.co.kr/v2/ajax2_dev2'
          boundary='----x'+uuid.uuid4().hex
          fields={'action':'search_text_cards','search_text':'nagimiso','search_params':'all','limit':'0'}
          body=b''
          for k,v in fields.items():
            body += f'--{boundary}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode()
          body += f'--{boundary}--\r\n'.encode()
          req=urllib.request.Request(url,data=body,headers={'User-Agent':'Mozilla/5.0','Referer':'https://pokemoncard.co.kr/cards','X-Requested-With':'XMLHttpRequest','Content-Type':f'multipart/form-data; boundary={boundary}'})
          try:
            r=urllib.request.urlopen(req,timeout=30)
            data=r.read().decode('utf-8','ignore')
            print('STATUS',r.status,'LEN',len(data),'HEAD',data[:500])
          except Exception as e:
            print('ERROR',repr(e)); raise
          PY
