name: Audit SP5 13 Korean V-UNION card images via own CDN
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-sp5-visual.yml'
      - 'scripts/audit-theme-sp5-visual.py'
permissions:
  contents: write
concurrency:
  group: sp5-korean-own-cdn-image-evidence
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Inspect all 13 Korean originals from own archived CDN
        run: python scripts/audit-theme-sp5-visual.py
      - name: Commit image proof contact sheets without offsite traffic
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/SP5
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Korean SP5 13 self-hosted V-UNION cards proof"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-sp5-visual.py
          done
