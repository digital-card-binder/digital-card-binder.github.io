name: Rework people Pokemon dex

on:
  push:
    branches:
      - feature/trainer-pokemon-dex
    paths:
      - .github/workflows/rework-people-pokemon-dex.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/trainer-pokemon-dex
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Rework collection around Pokemon groups
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          branch_cards = [
