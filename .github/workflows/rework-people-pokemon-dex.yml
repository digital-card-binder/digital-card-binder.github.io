                "setName": "열풍의 아레나",
                "rarity": "AR",
                "cardNumber": "075/063",
                "code": "sv9a_075/063",
                "illustrator": "Natsumi Yoshida",
                "image": "https://cards.image.pokemonkorea.co.kr/data/wmimages/SV/SV9a/SV9a_075.png",
                "source": "https://pokemoncard.co.kr/cards/detail/BS2025005075",
                "owned": False
              }]
            },
          ]

          payload = {
            "version": 2,
            "updatedAt": "2026-09-02",
            "title": "사람과 포켓몬 도감",
            "description": "포켓몬 카드 일러스트 안에 사람과 포켓몬이 같은 장면으로 함께 등장하는 한글판 카드 컬렉션",
            "grouping": "pokemon-national-dex",
            "rules": {
              "include": [
                "이름이 확인되는 트레이너·주요 인물이 포켓몬과 같은 실제 일러스트 장면에 함께 등장",
                "이름 없는 일반인·가족·직원·학생·NPC 등도 사람의 모습이나 행동이 확인되고 포켓몬과 같은 장면을 구성하면 포함"
              ],
              "exclude": [
                "트레이너 얼굴 아이콘·마크·사진·포스터·간판만 있는 경우",
                "점처럼 작게 보이는 관중이나 군중처럼 사람의 존재가 단순 배경 요소에 그치는 경우"
              ]
            },
            "groups": [
              {"name": item["group"], "nationalDexNo": item["dex"], "cards": item["cards"]}
              for item in branch_cards
            ]
          }
          Path("data/trainer-pokemon.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def patch(path, replacements):
            p = Path(path)
            text = p.read_text(encoding="utf-8")
            for old, new in replacements:
              if old not in text:
                raise RuntimeError(f"{path}: missing anchor: {old[:100]!r}")
              text = text.replace(old, new)
            p.write_text(text, encoding="utf-8")

          patch("collector-collection-registry.js", [
            ('title: "트레이너 & 포켓몬 도감",', 'title: "사람과 포켓몬 도감",'),
            ('description: "사람과 포켓몬이 함께한 일러스트",', 'description: "사람이 함께 등장하는 포켓몬 일러스트",'),
          ])
          patch("collector-nav.js", [
            ('"트레이너 & 포켓몬 도감",\n        "TRAINER × POKÉMON",', '"사람과 포켓몬 도감",\n        "PEOPLE × POKÉMON",'),
          ])
          patch("owner-sheets-sync.js", [
            ('trainerPokemon: "트레이너 & 포켓몬 도감",', 'trainerPokemon: "사람과 포켓몬 도감",'),
          ])

          patch("trainer-pokemon.html", [
            ('트레이너 &amp; 포켓몬 도감', '사람과 포켓몬 도감'),
            ('트레이너 & 포켓몬 도감', '사람과 포켓몬 도감'),
            ('TRAINER × POKÉMON', 'PEOPLE × POKÉMON'),
            ('트레이너와 사람, 포켓몬이 하나의 일러스트 안에서 함께 등장하는 장면을 모읍니다.', '사람과 포켓몬이 하나의 일러스트 장면 안에 함께 등장하는 포켓몬 카드를 모읍니다.'),
            ('등록 그룹', '포켓몬 수'),
            ('이름 있는 트레이너', '이름 있는 인물'),
            ('트레이너 이름을 확인할 수 있으면 해당 인물 그룹에 모읍니다.', '이름을 확인할 수 있는 인물은 카드 정보의 인물 태그로 기록합니다.'),
            ('그 외의 사람들', '이름 없는 사람도 포함'),
            ('일반 NPC·관중·가족·직원 등 이름을 특정하기 어려워도 장면의 일부라면 포함합니다.', '가족·직원·학생·일반 NPC 등 이름을 특정하기 어려워도 포켓몬과 같은 장면을 이루면 포함합니다.'),
            ('인물 그룹', '포켓몬'),
            ('선택 그룹', '선택 포켓몬'),
            ('포켓몬·트레이너·세트 검색', '포켓몬·인물·세트 검색'),
          ])

          patch("trainer-pokemon.js", [
            ('const TP_DATA_URL = "./data/trainer-pokemon.json?v=20260902-1";', 'const TP_DATA_URL = "./data/trainer-pokemon.json?v=20260902-2";'),
            ('  tpDataset.groups.forEach((group) => {\n', '  tpDataset.groups\n    .sort((a, b) => Number(a.nationalDexNo || 9999) - Number(b.nationalDexNo || 9999))\n    .forEach((group) => {\n'),
            ('    option.textContent = `${group.name} · ${(group.cards || []).length}장`;', '    option.textContent = `#${String(group.nationalDexNo).padStart(3, "0")} ${group.name} · ${(group.cards || []).length}장`;'),
            ('  const haystack = `${card.name} ${card.pokemonName} ${card.trainer} ${card.set} ${card.setName} ${card.rarity} ${card.cardNumber} ${card.illustrator}`.toLowerCase();', '  const haystack = `${card.name} ${card.pokemonName} ${card.personName || ""} ${card.trainer || ""} ${card.set} ${card.setName} ${card.rarity} ${card.cardNumber} ${card.illustrator}`.toLowerCase();'),
            ('      return String(a.pokemonName || a.name).localeCompare(String(b.pokemonName || b.name), "ko");', '      return String(a.name).localeCompare(String(b.name), "ko");'),
            ('  tp("tp-dialog-person").textContent = String(card.trainer || tpSelected.name).toUpperCase();', '  const personName = card.personName || card.trainer || "그 외의 사람들";\n  tp("tp-dialog-person").textContent = String(personName).toUpperCase();'),
            ('  tp("tp-dialog-person-detail").textContent = card.trainer || tpSelected.name;', '  tp("tp-dialog-person-detail").textContent = personName;'),
            ('  tp("tp-dialog-pokemon").textContent = card.pokemonName || card.name;', '  tp("tp-dialog-pokemon").textContent = card.pokemonName || tpSelected.name;'),
            ('  person.textContent = `${card.trainer || tpSelected.name} × ${card.pokemonName || card.name}`;', '  person.textContent = `${card.personName || card.trainer || "그 외의 사람들"} × ${card.pokemonName || tpSelected.name}`;'),
            ('  tp("tp-selected-group").textContent = tpSelected.name;', '  tp("tp-selected-group").textContent = `#${String(tpSelected.nationalDexNo).padStart(3, "0")} ${tpSelected.name}`;'),
          ])

          test_data = '''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst data = JSON.parse(\n  await readFile(new URL("../data/trainer-pokemon.json", import.meta.url), "utf8"),\n);\n\ntest("people and Pokemon dex groups verified Korean scene cards by National Dex", () => {\n  const cards = data.groups.flatMap((group) => group.cards || []);\n  assert.equal(data.title, "사람과 포켓몬 도감");\n  assert.equal(data.grouping, "pokemon-national-dex");\n  assert.equal(cards.length, 6);\n  assert.deepEqual(\n    data.groups.map((group) => group.nationalDexNo),\n    [54, 131, 157, 445, 644, 820],\n  );\n  assert.equal(cards.every((card) => card.owned === false), true);\n  assert.equal(new Set(cards.map((card) => card.code)).size, cards.length);\n\n  for (const group of data.groups) {\n    assert.ok(Number.isInteger(group.nationalDexNo));\n    assert.ok(group.cards.length > 0);\n    for (const card of group.cards) {\n      assert.equal(card.pokemonName, group.name);\n      assert.match(card.image, /^https:\\/\\/cards[.]image[.]pokemonkorea[.]co[.]kr\\//);\n      assert.match(card.source, /^https:\\/\\/pokemoncard[.]co[.]kr\\/cards\\/detail\\//);\n      assert.ok(card.personName || card.trainer);\n      assert.ok(["named", "other"].includes(card.personType));\n    }\n  }\n});\n'''
          Path("tests/trainer-pokemon-data.test.mjs").write_text(test_data, encoding="utf-8")

          p = Path("tests/collector-registry.test.mjs")
          text = p.read_text(encoding="utf-8")
          old = '    trainerPokemon: 5,\n'
          if old not in text:
            raise RuntimeError("collector registry trainerPokemon group count anchor missing")
          p.write_text(text.replace(old, '    trainerPokemon: 6,\n', 1), encoding="utf-8")

          # Align any remaining user-facing literal in the feature branch.
          for path in [Path("tests/collector-ui-contract.test.mjs")]:
            text = path.read_text(encoding="utf-8")
            text = text.replace("트레이너 & 포켓몬 도감", "사람과 포켓몬 도감")
            text = text.replace("TRAINER × POKÉMON", "PEOPLE × POKÉMON")
            path.write_text(text, encoding="utf-8")

          print("people + Pokemon dex reworked")
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm test
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trainer-pokemon.json trainer-pokemon.html trainer-pokemon.js collector-collection-registry.js collector-nav.js owner-sheets-sync.js tests/trainer-pokemon-data.test.mjs tests/collector-registry.test.mjs tests/collector-ui-contract.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "feat: group people Pokemon dex by Pokemon"
            git pull --rebase origin feature/trainer-pokemon-dex
            git push origin HEAD:feature/trainer-pokemon-dex
          fi
