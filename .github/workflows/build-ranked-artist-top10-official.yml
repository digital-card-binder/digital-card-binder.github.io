name: Audit ranked artist top10 Korean candidates

on:
  push:
    branches:
      - feat/add-ranked-artists-top10-ko-20260826
    paths:
      - .github/workflows/build-ranked-artist-top10-official.yml
      - scripts/audit_ranked_artist_top10_korean_candidates.py
      - scripts/audit_ranked_artist_top10_legacy_candidates.py
      - scripts/build_ranked_artist_top10_local_official.py

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-ranked-artists-top10-ko-20260826
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Korean-release candidate audit
        run: python scripts/audit_ranked_artist_top10_korean_candidates.py
      - name: Build legacy candidate audit
        run: python scripts/audit_ranked_artist_top10_legacy_candidates.py
      - name: Build official-image local base
        run: python scripts/build_ranked_artist_top10_local_official.py
      - name: Commit generated audits and base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artist-top10-korean-candidate-audit.json data/artist-top10-legacy-candidate-audit.json data/artists-top10-local-official.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate ranked top 10 official-image artist base"
          git push origin HEAD:feat/add-ranked-artists-top10-ko-20260826
