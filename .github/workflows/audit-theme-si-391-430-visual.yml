name: Audit SI 391-430 Korean owned CDN image proofs
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-si-391-430-visual.yml'
      - 'scripts/audit-theme-si-391-420-visual.py'
      - 'scripts/audit-theme-si-421-430-visual.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: si-391-430-owned-cdn-proof
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Check only user-owned CDN images for SI 391-420
        run: python scripts/audit-theme-si-391-420-visual.py
      - name: Check only user-owned CDN images for SI 421-430
        run: python scripts/audit-theme-si-421-430-visual.py
      - name: Save the two image contact sheets and integrity indexes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/SI/391-420
            git add data/audits/theme-visual-evidence/SI/421-430
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Capture SI 391-430 Korean owned archive image proofs"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-si-391-420-visual.py
            python scripts/audit-theme-si-421-430-visual.py
          done
