name: Compare Korean S6K app 093 and 094 card faces
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-korean-s6k-card-faces-20261018.yml'
      - 'scripts/compare-korean-s6k-card-faces-20261018.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python scripts/compare-korean-s6k-card-faces-20261018.py
