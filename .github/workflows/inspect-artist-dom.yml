name: Inspect Pokemon Korea artist DOM

on:
  push:
    branches:
      - feat/add-popular-artists-20260825
    paths:
      - "scripts/inspect_pokemonkorea_artist_dom.py"
      - ".github/workflows/inspect-artist-dom.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/inspect_pokemonkorea_artist_dom.py
