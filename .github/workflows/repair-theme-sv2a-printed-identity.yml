name: Repair Korean 151 printed-number theme identities
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-theme-sv2a-printed-identity.mjs'
      - '.github/workflows/repair-theme-sv2a-printed-identity.yml'
permissions:
  contents: write
concurrency:
  group: theme-sv2a-guarded-batches
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Correct shuffled canonical-order theme keys using Korean print identities
        run: node scripts/repair-theme-sv2a-printed-identity.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit only verified theme identities, evidence and checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-sv2a-set-progress-20261013.json data/audits/theme-sv2a-identity-repair-20261013.json data/audits/theme-sv2a-*-art-review.json
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Repair Korean 151 print-number identity across 150 reviewed cards"
          git pull --rebase origin main
          git push origin HEAD:main
