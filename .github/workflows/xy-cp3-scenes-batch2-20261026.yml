name: XY CP3 9 scene themes evidence-gated
on:
  push:
    branches: [audit/xy-cp3-scenes-batch2-20261026]
    paths:
      - .github/workflows/xy-cp3-scenes-batch2-20261026.yml
      - scripts/audit-xy-cp3-scene-batch2-20261026.mjs
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: xy-cp3-scenes-batch2-20261026
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/xy-cp3-scenes-batch2-20261026
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Apply illustration scene evidence with no false all-theme certification
        run: node scripts/audit-xy-cp3-scene-batch2-20261026.mjs
      - name: Install and regression-test full application
        run: |
          npm ci --no-fund
          npm run site:prepare
          npm test
      - name: Protect master data Firestore and card radar
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(data/series\.json|data/series-legacy\.json|data/series-image-overrides\.json|firestore\.rules|radar-server/|api/radar/|data/radar-|data/card-radar-|tests/card-radar-|scripts/.*radar|\.github/)'; then
            echo 'STOP: protected scope changed'
            exit 1
          fi
      - name: Commit only validated evidence to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add data/audits/theme-xy-cp3-additional-illustration-scenes-20261026.json
          git commit -m "audit(xy): nine CP3 cameo-season-food-work memberships evidenced"
          git push origin HEAD:audit/xy-cp3-scenes-batch2-20261026
