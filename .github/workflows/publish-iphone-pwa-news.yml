name: Publish iPhone PWA installation news

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-iphone-pwa-news.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add iPhone PWA news item
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('news.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          items = data.setdefault('items', [])
          news_id = 'iphone-pwa-install'
          if any(item.get('id') == news_id for item in items):
              print('News item already exists.')
          else:
              items.insert(0, {
                  'id': news_id,
                  'date': '2026-09-15',
                  'category': '업데이트',
                  'title': 'iPhone 앱 설치를 지원합니다',
                  'summary': 'iPhone에서도 디지털 카드 바인더를 홈 화면 앱으로 이용할 수 있습니다.',
                  'details': [
                      'Safari에서 ‘홈 화면에 추가’하면 주소창 없이 앱 형태로 이용할 수 있습니다.',
                      '홈 화면에 설치한 뒤 새소식 푸시 알림도 받을 수 있습니다.'
                  ]
              })
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit news update
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi
          git commit -m "Add iPhone app installation news"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
