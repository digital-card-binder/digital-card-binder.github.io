name: Complete Korean S8a-G 16 Golden Box cards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-theme-s8a-g-16.yml'
      - 'scripts/apply-theme-s8a-g-16-korean.mjs'
permissions:
  contents: write
concurrency:
  group: s8a-g-16-korean-verified-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Apply 16 Korean Golden Box artwork classifications and owned CDN
        run: node scripts/apply-theme-s8a-g-16-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm test
      - name: Commit data only after validation, retry safely on concurrent push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/series.json data/series-legacy.json data/series-image-overrides.json data/art-themes.json data/audits/theme-series-review-status.json data/audits/theme-image-selfhost-audit.json data/audits/theme-s8a-g-set-progress-20261014.json
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Complete Korean S8a-G 16 Gold Box cards and own CDN themes"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/apply-theme-s8a-g-16-korean.mjs
            npm run site:prepare
            npm run site:check
            npm test
          done
