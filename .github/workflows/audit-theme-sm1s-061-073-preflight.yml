name: Preflight SM1S Sun Collection final 13 Korean candidate images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-sm1s-061-073-preflight.yml'
      - 'scripts/audit-theme-sm1s-061-073-preflight.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sm1s-061-073-visual-preflight
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Inventory SM1S Explosive Walker card numbers and only fetch DCB-owned image archives
        run: python scripts/audit-theme-sm1s-061-073-preflight.py
      - name: Archive evidence sheets and binary metadata without modifying ownership or theme data
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add data/audits/theme-visual-evidence/sm1s/061-073
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(theme): archive SM1S Korean 061-073 image provenance and contact sheets"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            python scripts/audit-theme-sm1s-061-073-preflight.py
          done
