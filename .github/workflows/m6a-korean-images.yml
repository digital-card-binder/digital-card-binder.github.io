name: Import Korean M6a Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/m6a-korean-images.yml'

permissions:
  contents: write

concurrency:
  group: m6a-korean-images
  cancel-in-progress: false

jobs:
  import-official-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image validator
        run: python -m pip install 'Pillow>=10,<13'
      - name: Import verified Korean assets from Pokemon Korea
        id: import
        run: |
          set +e
          python scripts/sync_m6a_korean_images.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Commit locally hosted images and verified mappings
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/cards/mega/m6a data/series-image-overrides.json data/audits/m6a-korean-image-sync.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets(m6a): self-host newly published Korean 104-135 card artwork'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Flag incomplete official coverage without corrupting existing cards
        if: steps.import.outputs.exit_code != '0'
        run: |
          echo 'Some Korean M6a images are still unavailable. Published assets were committed; old image mappings were preserved for missing numbers.'
          exit 1
