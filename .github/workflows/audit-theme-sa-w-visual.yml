name: Verify 24 Korean SA-W starter card archives without origin hotlinks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-theme-sa-w-visual.yml'
      - 'scripts/audit-theme-sa-w-visual.py'
permissions:
  contents: write
concurrency:
  group: saw-24-korean-own-cdn-proofs
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==12.3.0
      - name: Check SA-W images only against DCB-owned Cloudflare
        run: python scripts/audit-theme-sa-w-visual.py
      - name: Commit proof contact sheets without altering collection or themes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/theme-visual-evidence/SA-W
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Checkpoint Korean SA-W 24 owned-card image originals"
          git pull --rebase origin main
          git push origin HEAD:main
