name: Origin ADV Contact Sheets
on:
  push:
    branches: [main]
    paths: [".github/workflows/origin-adv-contact-sheets.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sheets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: python -m pip install --quiet beautifulsoup4 requests pillow
      - name: Build contact sheets
        run: |
          python - <<'PY'
          import io,json,re,requests,os,math
          from bs4 import BeautifulSoup
          from PIL import Image,ImageOps,ImageDraw,ImageFont
          from concurrent.futures import ThreadPoolExecutor,as_completed
          BASE="https://www.dogam.app"
          sets=[
            ("BASE","/sets/01KW0T5RVDKBB4K1DEZJJ10J80"),
            ("ADV1","/sets/01KW0T4DR139PHGAETY4KAVK0Z"),
            ("ADV1-K","/sets/01M10GBB4QP2ZA58RFZ8VD913S"),
            ("ADV1-A","/sets/01M10GBB4Q7GYQ6HQ7T02R4621"),
            ("ADV1-M","/sets/01M10GBB4QKQZPFA6CE0GYWB6A"),
            ("ADVP","/sets/01M10F45J59EZ270K6C0XV3TRV"),
          ]
          H={"User-Agent":"Mozilla/5.0","Accept-Language":"ko-KR,ko;q=0.9"}
          def get(url):
            return requests.get(url,headers=H,timeout=20)
          rows=[]
          for setcode,href in sets:
            soup=BeautifulSoup(get(BASE+href).text,"html.parser")
            seen=set()
            for a in soup.find_all("a",href=True):
              ch=a["href"]
              if not ch.startswith(href+"/cards/") or ch in seen: continue
              seen.add(ch)
              rows.append({"set":setcode,"href":ch,"label":" ".join(a.stripped_strings)})
          def detail(row):
            try:
              page=get(BASE+row["href"]).text
              m=re.search(r"https://static[.]tcgexchange[.]kr/[A-Za-z0-9._/-]+[.](?:png|jpe?g|webp)",page,re.I)
              return {**row,"image":m.group(0) if m else ""}
            except Exception as e: return {**row,"image":"","error":str(e)}
          det=[]
          with ThreadPoolExecutor(max_workers=32) as ex:
            for f in as_completed([ex.submit(detail,r) for r in rows]): det.append(f.result())
          order={s:i for i,(s,_) in enumerate(sets)}
          def numkey(label):
            m=re.search(r"([0-9]{1,3})\s*$",label)
            return int(m.group(1)) if m else 9999
          det.sort(key=lambda r:(order[r["set"]],numkey(r["label"]),r["label"]))
          def image(row):
            try:
              rr=get(row["image"]); rr.raise_for_status()
              return row,Image.open(io.BytesIO(rr.content)).convert("RGB")
            except Exception: return row,None
          got=[]
          with ThreadPoolExecutor(max_workers=24) as ex:
            for f in as_completed([ex.submit(image,r) for r in det]): got.append(f.result())
          bykey={(r["set"],r["href"]):img for r,img in got}
          os.makedirs("origin-adv-sheets",exist_ok=True)
          open("origin-adv-sheets/mapping.json","w",encoding="utf-8").write(json.dumps(det,ensure_ascii=False,indent=2))
          W,Hh=180,252
          labelh=42
          cols=8; rows_per=4; per=cols*rows_per
          font=ImageFont.load_default()
          for start in range(0,len(det),per):
            chunk=det[start:start+per]
            sheet=Image.new("RGB",(cols*W,rows_per*(Hh+labelh)),"white")
            dr=ImageDraw.Draw(sheet)
            for idx,row in enumerate(chunk):
              x=(idx%cols)*W; y=(idx//cols)*(Hh+labelh)
              img=bykey.get((row["set"],row["href"]))
              if img:
                fit=ImageOps.contain(img,(W-8,Hh-8))
                sheet.paste(fit,(x+(W-fit.width)//2,y+4))
              label=f"{start+idx+1:03d} {row['set']} {row['label']}"
              dr.text((x+3,y+Hh+2),label[:28],fill="black",font=font)
            sheet.save(f"origin-adv-sheets/sheet_{start//per+1:02d}.jpg",quality=90)
          print("TOTAL",len(det),"SHEETS",math.ceil(len(det)/per))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: origin-adv-contact-sheets
          path: origin-adv-sheets
          retention-days: 2
