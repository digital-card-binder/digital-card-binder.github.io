name: Fetch official DP image candidates

on:
  push:
    paths:
      - "scripts/fetch_dp_official_candidates.py"
      - ".github/workflows/fetch-official-dp-candidates.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/fetch_dp_official_candidates.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/packs/candidates
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add official DP image candidates"
          git push origin HEAD:main
