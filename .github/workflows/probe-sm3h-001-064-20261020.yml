name: Inspect Korean SM3H 001–064 card sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-sm3h-001-064-20261020.yml'
      - 'scripts/probe-sm3h-001-064-korean-20261020.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sm3h-korean-source-probe
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image-source checks
        run: python -m pip install requests pillow
      - name: Inspect canonical Korean card image sources without modifying themes
        run: |
          python -m py_compile scripts/probe-sm3h-001-064-korean-20261020.py
          python scripts/probe-sm3h-001-064-korean-20261020.py
      - name: Store source hash/checkpoint only
        run: |
          set -euo pipefail
          git add data/audits/theme-sm3h-001-064-korean-image-preflight-20261020.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'audit(sm3h): save Korean 64-card image source and decode evidence'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
