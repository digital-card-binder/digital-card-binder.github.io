name: Inspect next five artists temporary

on:
  push:
    branches:
      - feat/add-next-five-artists-20260826
    paths:
      - "scripts/inspect_next_five_artists.py"
      - ".github/workflows/inspect-next-five-artists-temp.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/add-next-five-artists-20260826
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/inspect_next_five_artists.py
