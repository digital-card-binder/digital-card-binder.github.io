name: Apply verified Korean S6K 093 clean UR card print
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-s6k-093-korean.yml'
      - 'scripts/complete-s6k-093-korean.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: s6k-clean-korean-093-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply Korean printed S6K 093 clean self-hosted scan
        run: node scripts/complete-s6k-093-korean.mjs
      - run: npm run site:prepare
      - run: npm run site:check
      - run: npm run test:syntax
      - run: npm run test:registry
      - run: npm run test:ui
      - run: npm run test:architecture
      - name: Commit one image replacement only after all checks pass
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git add -u
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "audit(s6K): replace Korean 093 UR image; preserve four unverified Korean prints"
            if git push origin HEAD:main; then exit 0; fi
            if [[ "$attempt" -eq 5 ]]; then exit 1; fi
            git fetch origin main
            git reset --hard origin/main
            node scripts/complete-s6k-093-korean.mjs
            npm run site:prepare
            npm run site:check
            npm run test:syntax
            npm run test:registry
            npm run test:ui
            npm run test:architecture
          done
