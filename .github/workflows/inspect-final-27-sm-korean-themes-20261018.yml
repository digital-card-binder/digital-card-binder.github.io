name: Inspect 27 remaining Korean SM theme illustrations
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-final-27-sm-korean-themes-20261018.yml"
      - "scripts/inspect-final-27-sm-korean-themes-20261018.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - name: Inspect 19 plus 4 plus 4 verified Korean cards and existing 12 theme categories
        run: python scripts/inspect-final-27-sm-korean-themes-20261018.py
