name: Audit MEGA print variants

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_legacy_series_data.py'
      - 'scripts/audit-series-print-variants.py'
      - 'scripts/audit-series-canonical-slots.mjs'
      - 'scripts/audit-mega-gap-evidence.mjs'
      - 'scripts/audit-mega-korean-membership.mjs'
      - 'scripts/fix-mega-master-data.mjs'
      - 'scripts/probe-mega-official-images.mjs'
      - 'scripts/merge-series-print-variant-audit.mjs'
      - 'scripts/audit-master-card-db.mjs'
      - 'tests/series-print-variants.test.mjs'
      - '.github/workflows/audit-mega-print-variants.yml'

permissions:
  contents: write

concurrency:
  group: mega-print-variant-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore Pokemon Korea audit cache
        uses: actions/cache@v4
        with:
          path: tmp/legacy-series-cache
          key: mega-print-audit-v1-${{ runner.os }}
          restore-keys: |
            mega-print-audit-v1-

      - name: Normalize confirmed MEGA master data
        run: node scripts/fix-mega-master-data.mjs

      - name: Refresh series inventory audit
        run: node scripts/audit-series-inventory.mjs

      - name: Build canonical printed-slot baseline
        run: node scripts/audit-series-canonical-slots.mjs

      - name: Refresh Korean MEGA product audit
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p data/audits
          python3 scripts/audit-series-print-variants.py \
            --era M \
            --workers 2 \
            --output data/audits/series-print-variant-audit-M.json

      - name: Reuse verified Korean MEGA audit on push
        if: github.event_name == 'push'
        run: test -s data/audits/series-print-variant-audit-M.json

      - name: Build MEGA gap evidence
        run: node scripts/audit-mega-gap-evidence.mjs

      - name: Refresh official MEGA image evidence
        run: node scripts/probe-mega-official-images.mjs

      - name: Build Korean MEGA membership evidence
        run: node scripts/audit-mega-korean-membership.mjs

      - name: Merge verified print variants
        run: |
          node scripts/merge-series-print-variant-audit.mjs \
            data/audits/series-print-variant-audit-M.json
          node scripts/audit-master-card-db.mjs

      - name: Verify master DB contracts
        run: |
          node --test \
            tests/series-print-variants.test.mjs \
            tests/master-card-db-audit.test.mjs

      - name: Commit verified audit data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/series.json \
            data/series-legacy.json \
            data/series-inventory-audit.json \
            data/series-canonical-slot-audit.json \
            data/audits/series-print-variant-audit-M.json \
            data/audits/mega-gap-evidence.json \
            data/audits/mega-official-image-probe.json \
            data/audits/mega-korean-membership-audit.json \
            data/series-print-variants.json \
            data/master-card-db-audit.json
          if git diff --cached --quiet; then
            echo "No MEGA audit data changes."
            exit 0
          fi
          git commit -m "Audit Korean MEGA print variants"
          git pull --rebase origin main
          git push origin HEAD:main
