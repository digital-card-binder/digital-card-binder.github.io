name: M4 official Korean card names — verify and apply
on:
  push:
    branches: [fix/m4-96-korean-official-names-20261028]
    paths:
      - 'scripts/enrich-m4-korean-card-names-20261028.mjs'
      - 'tests/m4-official-card-names-20261028.test.mjs'
      - '.github/workflows/m4-korean-official-20261028.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: m4-korean-name-reconciliation-20261028
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/m4-96-korean-official-names-20261028
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install and verify parsing safety
        run: |
          npm ci --no-fund
          node --test tests/m4-official-card-names-20261028.test.mjs
      - name: Retrieve only 96 missing names from numbered Pokemon Korea card pages
        run: node scripts/enrich-m4-korean-card-names-20261028.mjs
      - name: Regenerate series/search/metrics and asset versions
        run: npm run site:prepare
      - name: Preserve official evidence even when validation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-official-name-evidence
          path: data/audits/m4-korean-card-names-20261028.json
          if-no-files-found: ignore
      - name: Full data, account and Firestore emulator regression
        run: npm test
      - name: Guard ownership and runtime security
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only | grep -E '^(firestore\.rules$|firebase-config\.js$|android-app/|radar-service/|data/audits/theme-|data/series-legacy\.json$)'; then
            echo "Protected account or audit state changed"; exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const g=JSON.parse(fs.readFileSync('data/series.json','utf8')).find(x=>x.code.toLowerCase()==='m4');
          const audit=JSON.parse(fs.readFileSync('data/audits/m4-korean-card-names-20261028.json','utf8'));
          if(g.cards.length!==120 || audit.beforeMissing!==96 ||
              audit.afterMissing!==g.cards.filter(x=>!x.name).length ||
              !audit.verified.length || audit.verifiedCount+audit.heldCount!==96)process.exit(1);
          console.log('OFFICIAL_M4_VERIFIED',audit.verifiedCount,'HELD',audit.heldCount);
          NODE
      - name: Commit reviewed Korean names and generated indexes to staging only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add data/audits/m4-korean-card-names-20261028.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(m4): preserve verified Korean official card names and evidence'
          git push origin HEAD:fix/m4-96-korean-official-names-20261028
